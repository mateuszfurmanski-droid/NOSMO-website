<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOSMO Nexus - Thematic Dock</title>
<meta name="description" content="Tematyczny jednoekranowy launcher modulow NOSMO Nexus.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#f3f7fa;background:#04080d}.app{position:relative;width:100%;height:100%;background:radial-gradient(circle at 18% 12%,rgba(47,195,255,.13),transparent 29rem),radial-gradient(circle at 82% 28%,rgba(86,232,180,.10),transparent 27rem),linear-gradient(145deg,#04080d,#07131a 58%,#04080d)}.topbar{height:52px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(123,177,196,.18);background:rgba(2,7,11,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-mark{width:29px;height:29px;border:1px solid rgba(90,225,188,.42);border-radius:9px;display:grid;place-items:center;color:#67e0b8;font-size:10px;font-weight:900}.brand-text{min-width:0}.brand-text strong{display:block;font-size:12px;letter-spacing:.08em}.brand-text span{display:block;color:#8197a2;font-size:9px;margin-top:2px}.top-actions{display:flex;gap:7px}.top-btn{width:31px;height:31px;border:1px solid rgba(123,177,196,.20);background:rgba(255,255,255,.025);color:#dce8ed;border-radius:9px;display:grid;place-items:center;text-decoration:none}.top-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}.workspace{position:absolute;inset:52px 0 112px;display:grid;place-items:center;padding:14px}.focus{position:relative;width:min(920px,100%);height:min(510px,100%);display:grid;grid-template-columns:1.1fr .9fr;border:1px solid rgba(123,177,196,.20);border-radius:22px;background:linear-gradient(145deg,rgba(17,37,47,.84),rgba(7,18,25,.90));box-shadow:0 30px 90px rgba(0,0,0,.34);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);overflow:hidden}.focus-main{padding:clamp(22px,5vw,48px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#67e0b8;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.focus h1{font-size:clamp(36px,7vw,76px);line-height:.9;letter-spacing:-.06em;margin:12px 0 17px}.focus p{margin:0;color:#98adb7;line-height:1.58;font-size:clamp(13px,2vw,16px);max-width:560px}.status-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.status{border:1px solid rgba(123,177,196,.24);border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.status.live{color:#67e0b8;border-color:rgba(103,224,184,.40);background:rgba(103,224,184,.07)}.status.demo{color:#55d8ff;border-color:rgba(85,216,255,.38);background:rgba(85,216,255,.07)}.status.plan{color:#efc867;border-color:rgba(239,200,103,.38);background:rgba(239,200,103,.07)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:21px}.primary,.secondary{min-height:40px;border-radius:10px;padding:0 14px;font-size:11px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{border:0;background:#67e0b8;color:#062018}.secondary{border:1px solid rgba(123,177,196,.25);background:rgba(255,255,255,.03);color:#e8f1f4}.focus-side{border-left:1px solid rgba(123,177,196,.16);padding:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(42,83,97,.12),rgba(0,0,0,.08))}.big-icon{width:min(220px,58vw);aspect-ratio:1;border-radius:42px;border:1px solid rgba(103,224,184,.25);background:radial-gradient(circle at 30% 25%,rgba(103,224,184,.20),rgba(85,216,255,.06) 45%,rgba(0,0,0,.10));display:grid;place-items:center;color:#67e0b8;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 70px rgba(0,0,0,.28)}.big-icon svg{width:45%;height:45%;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.dock-shell{position:absolute;left:0;right:0;bottom:0;height:112px;padding:7px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(2,7,11,.99),rgba(2,7,11,.82));border-top:1px solid rgba(123,177,196,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.groups{height:31px;display:flex;justify-content:center;gap:5px;overflow-x:auto;scrollbar-width:none}.groups::-webkit-scrollbar,.dock::-webkit-scrollbar{display:none}.group-btn{flex:0 0 auto;height:28px;border:1px solid rgba(123,177,196,.16);background:rgba(255,255,255,.025);color:#7e949d;border-radius:999px;padding:0 12px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.group-btn.active{color:#67e0b8;border-color:rgba(103,224,184,.38);background:rgba(103,224,184,.08)}.dock{height:62px;margin:3px auto 0;max-width:100%;display:flex;align-items:center;justify-content:center;gap:5px;overflow-x:auto;scrollbar-width:none}.dock-btn{position:relative;flex:0 0 54px;width:54px;height:56px;border:1px solid transparent;border-radius:14px;background:transparent;color:#80969f;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.16s ease}.dock-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dock-btn span{width:50px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8px;font-weight:800;text-align:center}.dock-btn:hover,.dock-btn.active{color:#67e0b8;background:rgba(103,224,184,.10);border-color:rgba(103,224,184,.18)}.dock-btn.active{transform:translateY(-2px)}.dot{position:absolute;right:8px;top:7px;width:5px;height:5px;border-radius:50%;background:#67e0b8;box-shadow:0 0 9px rgba(103,224,184,.75)}.dot.demo{background:#55d8ff}.dot.plan{background:#efc867}.group-summary{display:none}.group-summary.show{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px;max-width:520px}.summary-item{border:1px solid rgba(123,177,196,.18);background:rgba(255,255,255,.025);border-radius:11px;padding:11px}.summary-item strong{display:block;font-size:12px}.summary-item span{display:block;margin-top:4px;color:#859ba5;font-size:9px;line-height:1.35}
@media(max-width:720px){.topbar{height:48px;padding:0 10px}.workspace{inset:48px 0 110px;padding:9px;align-items:stretch}.focus{height:100%;grid-template-columns:1fr;border-radius:18px}.focus-main{padding:22px;justify-content:flex-end}.focus-side{position:absolute;right:22px;top:24px;width:88px;height:88px;padding:0;border:0;background:none}.big-icon{width:88px;border-radius:24px}.focus h1{font-size:clamp(35px,12vw,58px);max-width:76%;margin-top:10px}.focus p{font-size:13px}.dock-shell{height:110px;padding-left:5px;padding-right:5px}.groups{justify-content:flex-start}.dock{justify-content:flex-start}.group-summary.show{grid-template-columns:1fr 1fr}.brand-text span{display:none}}
@media(max-height:650px){.focus-main{padding:18px}.focus h1{font-size:38px}.focus p{line-height:1.4}.status-line,.actions{margin-top:12px}.focus-side{display:none}.group-summary{display:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">N</div><div class="brand-text"><strong>NOSMO NEXUS</strong><span>Tematyczny Dock</span></div></div>
  <div class="top-actions"><a class="top-btn" href="nexus.html" aria-label="Nexus page"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z"></path></svg></a><a class="top-btn" href="nexus-module-wall.html" aria-label="Technical list"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></a></div>
</header>
<main class="workspace">
<section class="focus">
  <div class="focus-main">
    <div id="eyebrow" class="eyebrow">Nexus Core</div>
    <h1 id="title">Workspace</h1>
    <p id="description">Jedno miejsce laczace projekty, ludzi, zadania, dokumenty i historie operacyjna.</p>
    <div id="statuses" class="status-line"></div>
    <div class="actions"><a id="primaryAction" class="primary" href="nexus.html">Otworz</a><a class="secondary" href="nexus-module-wall.html">Status techniczny</a></div>
    <div id="groupSummary" class="group-summary"></div>
  </div>
  <div class="focus-side"><div id="bigIcon" class="big-icon"></div></div>
</section>
</main>
<footer class="dock-shell">
  <div id="groups" class="groups"></div>
  <nav id="dock" class="dock" aria-label="Nexus thematic modules"></nav>
</footer>
</div>
<script>
const icons={
workspace:'<svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"></path><path d="M8 9h8M8 13h5"></path></svg>',projects:'<svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"></path></svg>',people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3 19c.8-4 3-6 6-6s5.2 2 6 6M16 6c2.2.2 3.5 1.5 3.5 3.5S18.2 12.8 16 13"></path></svg>',cards:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.8-2 1.8-3 3-3s2.2 1 3 3M14 10h4M14 14h4"></path></svg>',documents:'<svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"></path><path d="M14 3v4h4M9 12h6M9 16h6"></path></svg>',tasks:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"></path></svg>',timeline:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>',decisions:'<svg viewBox="0 0 24 24"><path d="M12 3v18M12 6h6l-2 3 2 3h-6M12 12H6l2 3-2 3h6"></path></svg>',doorflow:'<svg viewBox="0 0 24 24"><path d="M5 3h13v18H5z"></path><path d="M9 7h5v14H9z"></path><circle cx="12" cy="14" r=".6"></circle></svg>',electrical:'<svg viewBox="0 0 24 24"><path d="m13 2-7 12h6l-1 8 7-12h-6z"></path></svg>',safety:'<svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.2 8.3 8 10 4.8-1.7 8-5 8-10V6z"></path><path d="m8.5 12 2.2 2.2 4.8-5"></path></svg>',communication:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"></path><path d="M8 9h8M8 12h5"></path></svg>',company:'<svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14"></path><path d="M8 10h2M14 10h2M8 14h2M14 14h2M10 21v-4h4v4"></path></svg>',training:'<svg viewBox="0 0 24 24"><path d="m3 10 9-5 9 5-9 5z"></path><path d="M7 13v4c3 2 7 2 10 0v-4M21 10v6"></path></svg>',procurement:'<svg viewBox="0 0 24 24"><path d="M3 5h2l2 11h10l3-7H7"></path><circle cx="9" cy="20" r="1"></circle><circle cx="17" cy="20" r="1"></circle></svg>',bim:'<svg viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"></path><path d="m4 7.5 8 4.5 8-4.5M12 12v9"></path></svg>',field:'<svg viewBox="0 0 24 24"><path d="M4 20v-8l4-4 4 4 4-4 4 4v8"></path><path d="M8 8V4h8v4"></path></svg>',integrations:'<svg viewBox="0 0 24 24"><path d="M8 12a4 4 0 0 1 4-4h3M16 12a4 4 0 0 1-4 4H9"></path><path d="m14 5 3 3-3 3M10 19l-3-3 3-3"></path></svg>'
};
const groups=[
{id:'core',label:'Core Control',eyebrow:'Nexus Core',description:'Codzienna praca projektu: workspace, projekty, zadania, dokumenty, timeline i decyzje.'},
{id:'people',label:'People & Business',eyebrow:'People and Business',description:'Osoby, karty, komunikacja, firmy oraz rozwoj kompetencji.'},
{id:'field',label:'Field Operations',eyebrow:'Field Delivery',description:'Moduly wykonawcze, commissioning, safety, materialy i dowody z budowy.'},
{id:'ecosystem',label:'Digital Ecosystem',eyebrow:'BIM and Integrations',description:'BIM, partnerzy technologiczni i rejestr zewnetrznych polaczen.'}
];
const modules=[
{id:'workspace',group:'core',label:'Workspace',icon:'workspace',status:'live',description:'Jedno miejsce laczace projekty, ludzi, zadania, dokumenty i historie operacyjna.',href:'nexus.html'},
{id:'projects',group:'core',label:'Projects',icon:'projects',status:'live',description:'Portfolio projektow i kontekst operacyjny kazdego projektu.',href:'nexus.html#system'},
{id:'tasks',group:'core',label:'Tasks',icon:'tasks',status:'live',description:'Zadania, priorytety, przypisania, gotowosc i postep wykonania.',href:'nexus-module-wall.html'},
{id:'documents',group:'core',label:'Documents',icon:'documents',status:'live',description:'Plany, dokumenty, wiedza i historia wersji projektu.',href:'nexus.html#bim'},
{id:'timeline',group:'core',label:'Timeline',icon:'timeline',status:'live',description:'Chronologia zdarzen, zmian i pamiec projektu.',href:'nexus-module-wall.html'},
{id:'decisions',group:'core',label:'Decisions',icon:'decisions',status:'plan',description:'Decyzje, zatwierdzenia i odpowiedzialnosc czlowieka.',href:'nexus-module-wall.html'},
{id:'people',group:'people',label:'People',icon:'people',status:'live',description:'Person Cards, role, firmy, przypisania i dostepnosc.',href:'nexus.html#system'},
{id:'cards',group:'people',label:'Card Maker',icon:'cards',status:'live',description:'Tworzenie i wzbogacanie kart osob z kontrolowanym AI Prefill.',href:'nexus-module-wall.html'},
{id:'communication',group:'people',label:'Communication',icon:'communication',status:'demo',description:'Telefon, SMS, WhatsApp i e-mail z kontekstem zadania lub obiektu.',href:'communication-hub-demo.html'},
{id:'company',group:'people',label:'Companies',icon:'company',status:'plan',description:'Company Cards, relacje, projekty i historia wspolpracy.',href:'nexus-module-wall.html'},
{id:'training',group:'people',label:'Training',icon:'training',status:'plan',description:'Micro-learning, kompetencje, dowody, certyfikaty i odnowienia.',href:'nexus-module-wall.html'},
{id:'doorflow',group:'field',label:'DoorFlow',icon:'doorflow',status:'live',description:'Plany drzwi, Door Schedule, Door Cards i proces Fire Door.',href:'doorflow.html'},
{id:'electrical',group:'field',label:'Electrical',icon:'electrical',status:'demo',description:'Commissioning, testy, certyfikaty i snagi instalacji elektrycznych.',href:'nexus-module-wall.html'},
{id:'safety',group:'field',label:'Safety',icon:'safety',status:'demo',description:'Work Wallet Safety Connector i status gotowosci pracownika lub zadania.',href:'nexus-module-wall.html'},
{id:'procurement',group:'field',label:'Supplies',icon:'procurement',status:'plan',description:'Materialy, narzedzia, wynajem, zakupy i gotowosc zadania.',href:'nexus-module-wall.html'},
{id:'field',group:'field',label:'Field Layer',icon:'field',status:'plan',description:'Wspolna warstwa dowodow, postepu instalacji i as-built dla wielu branz.',href:'nexus.html#fabstation-module'},
{id:'bim',group:'ecosystem',label:'BIM',icon:'bim',status:'demo',description:'Model jako kontekst dla zadan, osob, dokumentow, instalacji i dowodow.',href:'nexus.html#bim'},
{id:'integrations',group:'ecosystem',label:'Integrations',icon:'integrations',status:'demo',description:'Native NOSMO Modules, external connectors i partner field layers.',href:'nexus.html#modules'}
];
let currentGroup='core';let currentModule='workspace';
const statusText={live:'ACTIVE',demo:'DEMO / CONNECTED',plan:'PLANNED'};
function renderGroups(){const box=document.getElementById('groups');box.innerHTML='';groups.forEach(g=>{const b=document.createElement('button');b.className='group-btn'+(g.id===currentGroup?' active':'');b.textContent=g.label;b.onclick=()=>{currentGroup=g.id;const first=modules.find(m=>m.group===g.id);currentModule=first.id;renderAll();};box.appendChild(b);});}
function renderDock(){const box=document.getElementById('dock');box.innerHTML='';modules.filter(m=>m.group===currentGroup).forEach(m=>{const b=document.createElement('button');b.className='dock-btn'+(m.id===currentModule?' active':'');b.innerHTML=icons[m.icon]+'<span>'+m.label+'</span><i class="dot '+m.status+'"></i>';b.onclick=()=>{currentModule=m.id;renderAll();};box.appendChild(b);});}
function renderFocus(){const m=modules.find(x=>x.id===currentModule);const g=groups.find(x=>x.id===currentGroup);document.getElementById('eyebrow').textContent=g.eyebrow;document.getElementById('title').textContent=m.label;document.getElementById('description').textContent=m.description;document.getElementById('bigIcon').innerHTML=icons[m.icon];document.getElementById('statuses').innerHTML='<span class="status '+m.status+'">'+statusText[m.status]+'</span><span class="status demo">'+g.label+'</span>';const a=document.getElementById('primaryAction');a.href=m.href||'nexus-module-wall.html';a.textContent=m.status==='plan'?'Zobacz specyfikacje':'Otworz ekran';const summary=document.getElementById('groupSummary');summary.innerHTML='';modules.filter(x=>x.group===currentGroup).forEach(x=>{const d=document.createElement('div');d.className='summary-item';d.innerHTML='<strong>'+x.label+'</strong><span>'+statusText[x.status]+'</span>';summary.appendChild(d);});}
function renderAll(){renderGroups();renderDock();renderFocus();localStorage.setItem('nosmo-dock-group',currentGroup);localStorage.setItem('nosmo-dock-module',currentModule);}
const savedGroup=localStorage.getItem('nosmo-dock-group');const savedModule=localStorage.getItem('nosmo-dock-module');if(groups.some(g=>g.id===savedGroup))currentGroup=savedGroup;if(modules.some(m=>m.id===savedModule&&m.group===currentGroup))currentModule=savedModule;renderAll();
</script>
</body>
</html>
