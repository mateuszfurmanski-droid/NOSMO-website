<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOSMO Nexus — Kamil Live Person Card</title>
<style>
:root{--bg:#020713;--panel:#081326;--line:#23466c;--text:#f5f8ff;--muted:#8fa4c8;--blue:#1f7aff;--cyan:#43d9ff;--green:#23d18b;--yellow:#ffd166;--red:#ff5c7a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#1f7aff3f,transparent 22rem),radial-gradient(circle at 85% 18%,#43d9ff16,transparent 24rem),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:14px 14px 96px}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 0;background:#020713e8;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#001827;font-weight:1000}.brand small{display:block;color:var(--cyan);font-size:11px;letter-spacing:.16em}.brand strong{font-size:18px}.pill{border:1px solid #23d18b77;border-radius:999px;padding:9px 12px;color:var(--green);font-weight:900;background:#052319}.hero,.panel{border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,#0a1730ee,#050b18ef);box-shadow:0 24px 70px #0008}.hero{overflow:hidden}.hero img{display:block;width:100%;height:auto;background:#030712}.identity{padding:16px}.identity h1{margin:0;font-size:31px;line-height:.95;text-transform:uppercase;letter-spacing:-.035em}.identity h2{margin:9px 0 2px;color:var(--blue);font-size:18px;text-transform:uppercase}.identity p{margin:0;color:var(--muted)}.status{display:flex;gap:8px;overflow-x:auto;padding:13px 0;scrollbar-width:none}.status::-webkit-scrollbar{display:none}.status button,.actions button,.tabs button,.wide{border:1px solid var(--line);border-radius:15px;background:#081529;color:var(--text);padding:11px 12px;font:inherit;cursor:pointer}.status button{white-space:nowrap;font-size:12px}.status button.active{background:var(--blue);box-shadow:0 0 24px #1f7aff55}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.actions button{min-height:54px;padding:8px 4px;font-size:11px;font-weight:900}.actions button.active{background:linear-gradient(135deg,var(--blue),#003bc0)}.send{padding:13px;margin-bottom:12px}textarea{width:100%;min-height:82px;border:1px solid #23466c99;border-radius:18px;background:#0004;color:var(--text);padding:13px;resize:vertical;font:inherit}.send .wide{width:100%;margin-top:10px;min-height:54px;background:linear-gradient(135deg,var(--blue),#003bc0);font-weight:1000}.panel{padding:15px;margin-bottom:12px}.panel h3{margin:0 0 12px;color:var(--cyan);font-size:13px;letter-spacing:.12em;text-transform:uppercase}.row{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff12}.row:last-child{border-bottom:0}.row span{color:var(--muted);font-size:12px}.row strong{font-size:13px}.progress{height:12px;border-radius:999px;background:#ffffff12;overflow:hidden}.fill{height:100%;width:70%;background:linear-gradient(90deg,var(--blue),var(--green));box-shadow:0 0 20px #23d18b66}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:520px;margin:0 auto;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:#020713f4;border-top:1px solid #23466c99}.tabs button{font-size:11px;padding:10px 4px;color:var(--muted)}.tabs button.active{color:#fff;border-color:#1f7affcc;background:#1f7aff22}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff12}.item:last-child{border-bottom:0}.item small{display:block;color:var(--muted);margin-top:4px}.item button{border:1px solid var(--line);border-radius:12px;background:#081529;color:#fff;padding:8px 10px}.ok{color:var(--green)}.warn{color:var(--yellow)}.activity{border-left:3px solid var(--blue);padding-left:10px;color:#d7e2ff}.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;margin:10px 0 14px;font-weight:800}.back:hover{color:var(--cyan)}
</style>
</head>
<body>
<main class="app">
<a class="back" href="nexus-preview.html?v=clouds3">← Back to Nexus Preview</a>
<header class="top"><div class="brand"><div class="logo">N</div><div><small>NOSMO NEXUS</small><strong>Person Card</strong></div></div><div class="pill" id="topStatus">Available</div></header>
<section class="hero"><img src="assets/KamilKaraszewski.jpeg" alt="Kamil Karaszewski NOSMO profile card"><div class="identity"><h1>Kamil Karaszewski</h1><h2>Technical Advisor</h2><p>Welding & Fabrication</p></div></section>
<section class="status" id="statusButtons"></section>
<section class="actions" id="actions"></section>
<section class="panel send"><h3>Send / Share</h3><textarea id="message" placeholder="Write work note, instruction, question or context..."></textarea><button class="wide" onclick="sendShare()">SEND / SHARE</button></section>
<section class="panel"><h3>Current Context</h3><div class="row"><span>Project</span><strong>ASML Projects — Netherlands</strong></div><div class="row"><span>Task</span><strong>Technical welding / fabrication support</strong></div><div class="row"><span>Location</span><strong>Netherlands / Remote Advisory</strong></div></section>
<section class="panel" id="content"></section>
<nav class="tabs"><button class="active" onclick="tab(this,'home')">Home</button><button onclick="tab(this,'work')">Work</button><button onclick="tab(this,'training')">Training</button><button onclick="tab(this,'evidence')">Evidence</button><button onclick="tab(this,'more')">More</button></nav>
</main>
<script>
const state={status:'Available',channel:'WhatsApp',progress:70,activity:['Person Card opened','Growth layer connected','Training path assigned'],micro:[['Review clean-room welding reminder','2-minute lesson',false],['Complete 5-question QA quiz','Quiz',false],['Confirm QA documentation checklist','Checklist',false]],tasks:[['Review welding documentation','In Progress'],['Prepare fabrication checklist','Todo'],['Support machine construction planning','Todo']],docs:[['Welding certificates','PDF'],['Fabrication checklist','XLSX'],['Technical advisor notes','DOC']]};
const statuses=['Available','Busy','On Task','Offline','Waiting for Materials','Training'];const channels=['WhatsApp','Email','Teams','Call','Camera'];
function renderStatus(){statusButtons.innerHTML=statuses.map(s=>`<button class="${state.status===s?'active':''}" onclick="setStatus('${s}')">${s}</button>`).join('');topStatus.textContent=state.status}
function setStatus(s){state.status=s;state.activity.unshift('Status changed to '+s);renderStatus();render()}
function renderActions(){actions.innerHTML=channels.map(c=>`<button class="${state.channel===c?'active':''}" onclick="state.channel='${c}';renderActions()">${c}</button>`).join('')}
function sendShare(){const msg=document.getElementById('message').value.trim()||'Shared current Kamil card context.';state.activity.unshift('Sent via '+state.channel+': '+msg);document.getElementById('message').value='';render()}
function tab(btn,name){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.tab=name;render()}
function completeMicro(i){state.micro[i][2]=!state.micro[i][2];state.progress=Math.min(100,70+state.micro.filter(x=>x[2]).length*5);state.activity.unshift('Micro-training updated');render()}
function doneTask(i){state.tasks[i][1]='Done';state.activity.unshift('Task marked as done');render()}
function render(){const t=state.tab||'home';if(t==='home')content.innerHTML=`<h3>Growth Snapshot</h3><div class="row"><span>Path</span><strong>Technical Advisor Path</strong></div><div class="row"><span>Next unlock</span><strong>Senior Technical Advisor</strong></div><div class="progress"><div class="fill" style="width:${state.progress}%"></div></div><p class="ok">${state.progress}% ready</p><h3>Latest Activity</h3>${state.activity.slice(0,5).map(x=>`<p class="activity">${x}</p>`).join('')}`;if(t==='work')content.innerHTML=`<h3>Tasks</h3>${state.tasks.map((x,i)=>`<div class="item"><div><strong>${x[0]}</strong><small>${x[1]}</small></div>${x[1]==='Done'?'<span class="ok">Done</span>':`<button onclick="doneTask(${i})">Done</button>`}</div>`).join('')}<h3>Documents</h3>${state.docs.map(x=>`<div class="item"><div><strong>${x[0]}</strong><small>${x[1]}</small></div><button>Open</button></div>`).join('')}`;if(t==='training')content.innerHTML=`<h3>Training Progress</h3><div class="progress"><div class="fill" style="width:${state.progress}%"></div></div><p class="ok">${state.progress}% — Technical Advisor Path</p><h3>Today’s Micro-Training</h3>${state.micro.map((x,i)=>`<div class="item"><div><strong>${x[0]}</strong><small>${x[1]}</small></div><button onclick="completeMicro(${i})" class="${x[2]?'ok':''}">${x[2]?'Done':'Complete'}</button></div>`).join('')}<h3>Required For Next Unlock</h3><p>□ QA documentation module</p><p>□ Supervisor sign-off</p><p>□ Training provider validation</p>`;if(t==='evidence')content.innerHTML=`<h3>Evidence</h3><div class="item"><div><strong>Practical evidence placeholder</strong><small>Photos, checklists and supervisor sign-off will appear here.</small></div><button>Upload</button></div><div class="item"><div><strong>DoorFlow connection</strong><small>Future QA records can count toward training readiness.</small></div><span class="warn">Later</span></div>`;if(t==='more')content.innerHTML=`<h3>More</h3><button class="wide">CV</button><button class="wide">Certificates</button><button class="wide">Performance</button><button class="wide">Work Fit / Accessibility</button><button class="wide">Privacy Settings</button>`}
renderStatus();renderActions();render();
</script>
</body>
</html>
