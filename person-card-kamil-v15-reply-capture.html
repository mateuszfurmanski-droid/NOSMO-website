<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOSMO Nexus — Kamil Person Card v15</title>
<style>
:root{--bg:#030711;--panel:#071329;--line:#2457aa;--text:#f5f8ff;--muted:#9baad0;--blue:#2078ff;--cyan:#39d8ff;--green:#20e37a;--warn:#ffb020;--red:#ff5e73;--shadow:0 18px 70px #000b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 18% 4%,#155cff45,transparent 17rem),radial-gradient(circle at 100% 18%,#39d8ff18,transparent 22rem),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a,button,input,textarea,select{font:inherit;color:inherit}.screen{width:100%;max-width:430px;min-height:100vh;margin:0 auto;padding:12px 12px 24px}.top{height:44px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:8px;align-items:center}.mark{width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#1764ff,#44d7ff);display:grid;place-items:center;font-weight:1000;color:#00121f}.word{font-size:17px;line-height:.9;font-weight:1000;letter-spacing:.05em}.word span{display:block;color:var(--blue);font-size:11px;letter-spacing:.22em}.topBtns{display:flex;gap:8px}.topBtns a,.topBtns button{width:36px;height:36px;border:1px solid #ffffff24;border-radius:14px;background:#081225aa;display:grid;place-items:center;text-decoration:none}.hamb{font-size:22px;font-weight:900}.card,.panel,.composer,.box{border:1px solid #2255a8cc;background:linear-gradient(180deg,#091b3aee,#050b18f2);box-shadow:var(--shadow),inset 0 0 0 1px #69a8ff12;border-radius:22px}.card{position:relative;overflow:hidden;padding:16px 15px 14px}.hero{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center}.photoWrap{position:relative;width:112px;height:132px;border-radius:20px;display:grid;place-items:center;background:#07142a;border:1px solid #2b65c3;box-shadow:0 14px 45px #0008;overflow:hidden;cursor:zoom-in}.photo{width:100%;height:100%;object-fit:cover;border-radius:18px}.tapHint{position:absolute;left:7px;bottom:7px;padding:3px 6px;border:1px solid #ffffff22;border-radius:999px;background:#020916cc;color:#cbd8f7;font-size:9px}.verify{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:8px;background:#092762;border:1px solid #3b8bff;display:grid;place-items:center}.name h1{margin:0;font-size:31px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase}.name h2{margin:9px 0 1px;color:#2f7dff;font-size:14px;letter-spacing:.08em;text-transform:uppercase}.name p{margin:0;color:#dde4f8;font-size:13px;letter-spacing:.035em;text-transform:uppercase}.meta{margin-top:9px;display:flex;gap:12px;flex-wrap:wrap;color:#d9e5ff;font-size:12px}.statusBar{margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1.35fr;border:1px solid #234779;border-radius:18px;overflow:hidden;background:#07142a}.statusBar button{min-height:43px;border:0;border-right:1px solid #234779;background:transparent;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}.statusBar button:last-child{border-right:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.tile{min-height:70px;border:1px solid #2255a8cc;border-radius:16px;background:#07142a;text-decoration:none;display:grid;place-items:center;text-align:center;padding:7px 3px}.tile b{display:block;font-size:12px}.tile span{display:block;color:var(--green);font-size:11px;margin-top:2px}.panel,.composer,.box{padding:14px;margin:12px 0}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#2f7dff;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}.muted{color:var(--muted);font-size:12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.actions button,.actions a,.smallBtn{border:1px solid #2456a6;border-radius:14px;background:#0a1b36;padding:10px 6px;text-align:center;text-decoration:none;font-size:12px}.primary{border-color:#39d8ff!important;background:#0c3672!important}.danger{border-color:#ff5e73!important}.composer label{display:block;margin:10px 0 5px;color:#9baad0;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.composer input,.composer textarea,.composer select{width:100%;border:1px solid #2456a6;border-radius:14px;background:#050d1d;color:#f5f8ff;padding:10px}.composer textarea{min-height:105px;resize:vertical;line-height:1.35}.agencyTools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.agencyList{display:grid;gap:8px;max-height:330px;overflow:auto;padding-right:2px}.agency{border:1px solid #ffffff18;border-radius:16px;background:#07142a;padding:10px}.agencyTop{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start}.agency b{font-size:13px}.agency small{display:block;color:#9baad0;margin-top:2px}.badge{display:inline-block;margin-top:7px;border:1px solid #2456a6;border-radius:999px;padding:4px 7px;font-size:10px;color:#cfe0ff}.badge.sent{border-color:#39d8ff;color:#39d8ff}.badge.due{border-color:#ffb020;color:#ffb020}.badge.replied{border-color:#20e37a;color:#20e37a}.badge.closed{border-color:#777;color:#aaa}.badge.blacklist{border-color:#ff5e73;color:#ff5e73}.replyRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}.replyRow button{border:1px solid #2456a6;border-radius:12px;background:#0a1b36;padding:8px 4px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.stat{border:1px solid #ffffff18;border-radius:13px;background:#07142a;padding:8px 4px;text-align:center}.stat b{display:block;font-size:15px}.stat span{display:block;color:#9baad0;font-size:9px;text-transform:uppercase}.source textarea{min-height:92px;font-size:12px}.logList{display:grid;gap:7px}.logItem{border:1px solid #ffffff14;border-radius:13px;background:#07142a;padding:8px 10px}.logItem b{display:block;font-size:12px}.logItem span{display:block;color:#9baad0;font-size:11px;margin-top:2px}.shade{position:fixed;inset:0;z-index:30;display:none;background:transparent}.shade.open{display:block}.mainMenu{position:fixed;z-index:31;top:60px;right:max(12px,calc((100vw - 430px)/2 + 12px));width:250px;border:1px solid #ffffff26;border-radius:18px;background:#101724fa;box-shadow:0 20px 60px #000d;display:none;overflow:hidden}.mainMenu.open{display:block}.mainMenu button{width:100%;display:block;padding:13px 15px;border:0;border-bottom:1px solid #ffffff12;background:transparent;text-align:left}.mainMenu strong{display:block;font-size:14px}.mainMenu span{display:block;font-size:11px;color:#a6b3cf;margin-top:2px}.viewer{display:none;position:fixed;z-index:80;inset:0;background:#000;overflow:hidden;touch-action:none}.viewer.open{display:block}.viewerTop{position:absolute;z-index:82;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;justify-content:space-between}.viewerTop button{width:42px;height:42px;border:1px solid #ffffff33;border-radius:14px;background:#111a;color:#fff;font-size:22px}.viewerCanvas{width:100%;height:100%;display:grid;place-items:center}.viewer img{max-width:none;max-height:none;width:82vw;height:auto;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}.toast{position:fixed;z-index:90;left:50%;bottom:16px;transform:translateX(-50%);background:#0c3672;border:1px solid #39d8ff;border-radius:999px;padding:9px 13px;font-size:12px;display:none}@media(max-height:770px){.screen{max-width:410px}.card{padding:13px}.hero{grid-template-columns:100px 1fr}.photoWrap{width:100px;height:118px}.name h1{font-size:26px}.tile{min-height:63px}.panel{padding:11px}}
</style>
</head>
<body>
<div class="shade" id="shade" onclick="closeMenu()"></div>
<nav class="mainMenu" id="mainMenu">
<button onclick="openComposer('profile');closeMenu()"><strong>Profile Email</strong><span>Personalised intro</span></button>
<button onclick="openComposer('agency');closeMenu()"><strong>Agency Pack</strong><span>Batch send + replies</span></button>
<button onclick="document.getElementById('agencyBox').scrollIntoView({behavior:'smooth'});closeMenu()"><strong>Agency Pipeline</strong><span>Statuses, follow-ups, replies</span></button>
<button onclick="document.getElementById('sourceBox').scrollIntoView({behavior:'smooth'});closeMenu()"><strong>Agency Source</strong><span>Import Google Sheet / CSV</span></button>
<button onclick="openComposer('indeed');closeMenu()"><strong>Indeed Reply</strong><span>AI personalised answer</span></button>
</nav>
<main class="screen">
<header class="top"><div class="brand"><div class="mark">N</div><div class="word">NOSMO<span>NEXUS</span></div></div><div class="topBtns"><a href="nexus-preview.html?v=clouds6">↩</a><button class="hamb" onclick="toggleMenu()">☰</button></div></header>
<section class="card"><div class="hero"><button class="photoWrap" onclick="openViewer()"><img class="photo" src="assets/KamilKaraszewski.jpeg" alt="Kamil Karaszewski"><div class="verify">✓</div><span class="tapHint">tap to zoom</span></button><div class="name"><h1>Kamil<br>Karaszewski</h1><h2>Technical Advisor</h2><p>Welding & Fabrication</p><div class="meta"><span>⌖ Eindhoven</span><span>▣ 15+ yrs</span></div></div></div><div class="statusBar"><button><i class="dot"></i>Available</button><button>🛡 Verified</button><button onclick="openComposer('agency')">Agency Pack ›</button></div></section>
<div class="grid5"><button class="tile" onclick="openComposer('cv')"><b>My CV</b><span>send</span></button><button class="tile" onclick="openComposer('certs')"><b>Certs</b><span>8 verified</span></button><button class="tile" onclick="openComposer('refs')"><b>Refs</b><span>5 active</span></button><button class="tile" onclick="openComposer('availability')"><b>Avail.</b><span>open</span></button><button class="tile" onclick="openComposer('agency')"><b>Agency</b><span>batch</span></button></div>
<section class="composer" id="composer"><div class="head">Share Composer <span class="muted" id="composerMode">Profile</span></div><label>Recipient email(s)</label><input id="toField" placeholder="agency@example.com"><label>Subject</label><input id="subjectField"><label>Message</label><textarea id="messageField"></textarea><label>Follow-up</label><select id="followField"><option value="3">+3 days</option><option value="7">+7 days</option><option value="14">+14 days</option><option value="0">No follow-up</option></select><div class="actions"><button onclick="copyMessage()">Copy</button><button class="primary" onclick="openEmail()">Email</button><button onclick="openWhatsApp()">WhatsApp</button><button onclick="openIndeed()">Indeed</button></div></section>
<section class="box" id="agencyBox"><div class="head">Agency Pipeline <button class="smallBtn" onclick="openComposer('agency')">Compose</button></div><div class="stats" id="stats"></div><div class="agencyTools"><button class="smallBtn" onclick="selectAll()">Select all</button><button class="smallBtn" onclick="clearSelected()">Clear</button><button class="smallBtn primary" onclick="sendSelected()">Send batch</button></div><div class="agencyList" id="agencyList"></div></section>
<section class="box source" id="sourceBox"><div class="head">Agency Source <button class="smallBtn" onclick="exportCsv()">Copy CSV</button></div><p class="muted">Paste rows from Google Sheet / Excel. Headers: agency,email,sector,region,priority,lastSent,status,notes</p><textarea id="csvInput">agency,email,sector,region,priority,lastSent,status,notes
TechWeld Recruitment,contact@techweld.example,Welding,UK,High,,not_contacted,
Fab Talent UK,jobs@fabtalent.example,Fabrication,UK,High,,not_contacted,
Orbital Staff Europe,desk@orbitalstaff.example,Orbital Welding,EU,Medium,,sent,Waiting for feedback</textarea><div class="actions"><button class="primary" onclick="importCsv()">Import</button><button onclick="seedDemo()">Demo</button><button onclick="clearAgencies()">Clear</button><button onclick="copyAgencySummary()">Summary</button></div></section>
<section class="box"><div class="head">Recent Actions <button class="smallBtn" onclick="clearLog()">Clear</button></div><div class="logList" id="logList"></div></section>
</main>
<div class="viewer" id="viewer"><div class="viewerTop"><button onclick="closeViewer()">×</button><button onclick="resetView()">↺</button></div><div class="viewerCanvas" id="viewerCanvas"><img id="viewerImg" src="assets/KamilKaraszewski.jpeg" alt="Kamil full profile"></div></div>
<div class="toast" id="toast"></div>
<script>
const profileUrl='https://nosmotechnology.co.uk/person-card-kamil.html';
const defaultAgencies=[
{agency:'TechWeld Recruitment',email:'contact@techweld.example',sector:'Welding',region:'UK',priority:'High',lastSent:'',followUp:'',status:'not_contacted',notes:''},
{agency:'Fab Talent UK',email:'jobs@fabtalent.example',sector:'Fabrication',region:'UK',priority:'High',lastSent:'',followUp:'',status:'not_contacted',notes:''},
{agency:'Orbital Staff Europe',email:'desk@orbitalstaff.example',sector:'Orbital Welding',region:'EU',priority:'Medium',lastSent:'',followUp:'',status:'sent',notes:'Waiting for feedback'},
{agency:'Pipework Contracts Desk',email:'work@pipecontracts.example',sector:'Pipe welding',region:'UK/EU',priority:'Medium',lastSent:'',followUp:'',status:'not_contacted',notes:''}
];
function $(id){return document.getElementById(id)}
function store(k,v){localStorage.setItem(k,JSON.stringify(v))}
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}
let agencies=load('nexus.kamil.agencies.v15',defaultAgencies);let selected=new Set();
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1500)}
function log(action,detail=''){let l=load('nexus.kamil.log.v15',[]);l.unshift({action,detail,time:new Date().toLocaleString()});store('nexus.kamil.log.v15',l.slice(0,12));renderLog()}
function renderLog(){let l=load('nexus.kamil.log.v15',[]);$('logList').innerHTML=l.length?l.map(x=>`<div class="logItem"><b>${x.action}</b><span>${x.time}${x.detail?' · '+x.detail:''}</span></div>`).join(''):'<p class="muted">No actions yet.</p>'}
function clearLog(){store('nexus.kamil.log.v15',[]);renderLog();toast('Log cleared')}
function statusLabel(s){return ({not_contacted:'Not contacted',sent:'Sent',due:'Follow-up due',replied:'Replied',closed:'Closed',blacklist:'Blacklisted',interested:'Interested',no_role:'No role',call_back:'Call back',send_certs:'Send certs',waiting:'Waiting'})[s]||s}
function badgeClass(s){if(['sent','waiting'].includes(s))return 'sent';if(['due','call_back','send_certs'].includes(s))return 'due';if(['replied','interested'].includes(s))return 'replied';if(['closed','no_role'].includes(s))return 'closed';if(s==='blacklist')return 'blacklist';return ''}
function renderAgencies(){store('nexus.kamil.agencies.v15',agencies);let counts={not_contacted:0,sent:0,due:0,replied:0,closed:0};agencies.forEach(a=>{if(['interested','waiting','call_back','send_certs'].includes(a.status))counts.replied++;else if(a.status==='blacklist'||a.status==='no_role')counts.closed++;else counts[a.status]=(counts[a.status]||0)+1});$('stats').innerHTML=`<div class="stat"><b>${counts.not_contacted||0}</b><span>new</span></div><div class="stat"><b>${counts.sent||0}</b><span>sent</span></div><div class="stat"><b>${counts.due||0}</b><span>due</span></div><div class="stat"><b>${counts.replied||0}</b><span>reply</span></div><div class="stat"><b>${counts.closed||0}</b><span>closed</span></div>`;
$('agencyList').innerHTML=agencies.map((a,i)=>`<div class="agency"><div class="agencyTop"><input type="checkbox" ${selected.has(i)?'checked':''} onchange="toggleAgency(${i},this.checked)"><div><b>${a.agency}</b><small>${a.email}</small><small>${a.sector||''} · ${a.region||''} · ${a.priority||''}</small><span class="badge ${badgeClass(a.status)}">${statusLabel(a.status)}</span>${a.followUp?` <span class="badge due">FU ${a.followUp}</span>`:''}${a.notes?`<small>Note: ${a.notes}</small>`:''}</div><button class="smallBtn" onclick="useAgency(${i})">Use</button></div><div class="replyRow"><button onclick="capture(${i},'interested')">Interested</button><button onclick="capture(${i},'no_role')">No role</button><button onclick="capture(${i},'call_back')">Call back</button><button onclick="capture(${i},'send_certs')">Send certs</button><button onclick="capture(${i},'waiting')">Waiting</button><button class="danger" onclick="capture(${i},'blacklist')">Blacklist</button></div></div>`).join('')}
function toggleAgency(i,on){on?selected.add(i):selected.delete(i);renderComposerForSelection()}
function selectAll(){agencies.forEach((_,i)=>selected.add(i));renderAgencies();renderComposerForSelection();log('Agency select all',selected.size+' selected')}
function clearSelected(){selected.clear();renderAgencies();renderComposerForSelection()}
function useAgency(i){selected.clear();selected.add(i);renderAgencies();openComposer('agency')}
function capture(i,status){agencies[i].status=status;agencies[i].notes=(agencies[i].notes?agencies[i].notes+' | ':'')+'Reply: '+statusLabel(status)+' '+new Date().toLocaleDateString();renderAgencies();log('Reply captured',agencies[i].agency+' · '+statusLabel(status));toast('Reply captured')}
function openComposer(type){$('composer').scrollIntoView({behavior:'smooth'});$('composerMode').textContent=type;let subject='Kamil Karaszewski — welding/fabrication profile';let msg=`Hi,\n\nPlease find Kamil Karaszewski's NOSMO Nexus Person Card below.\n\nProfile: ${profileUrl}\n\nCore skills: TIG 141, orbital welding, pipe welding, machine construction, fabrication.\nAvailability: open to discuss suitable welding/fabrication roles.\n\nRegards,\nNOSMO Nexus`; if(type==='indeed'){subject='Indeed reply — Kamil Karaszewski';msg=`Hi,\n\nThank you for the opportunity. Kamil Karaszewski is available to discuss the role. He has strong experience in TIG 141, orbital welding, pipe welding, machine construction and fabrication.\n\nNOSMO profile: ${profileUrl}\n\nKind regards`;}
 if(type==='certs'){subject='Kamil Karaszewski — certificates';msg=`Hi,\n\nPlease send or review the certificate pack for Kamil Karaszewski.\n\nNOSMO profile: ${profileUrl}\n\nRegards`;}
 if(type==='agency'){renderComposerForSelection();return}
 $('subjectField').value=subject;$('messageField').value=msg;log('Composer opened',type)}
function renderComposerForSelection(){let list=[...selected].map(i=>agencies[i]);$('toField').value=list.map(a=>a.email).join(', ');$('subjectField').value='Kamil Karaszewski — available welding/fabrication profile';$('messageField').value=`Hi,\n\nI am sharing Kamil Karaszewski's NOSMO Nexus Person Card for suitable welding/fabrication roles.\n\nProfile: ${profileUrl}\n\nCore skills: TIG 141, orbital welding, pipe welding, machine construction, fabrication.\nAvailability: open to discuss.\n\nBatch note: ${list.length||0} recipient(s) selected.\n\nRegards,\nNOSMO Nexus`;log('Agency composer opened',(list.length||0)+' selected')}
function addDays(d){let x=new Date();x.setDate(x.getDate()+Number(d));return x.toISOString().slice(0,10)}
function markSent(){let days=$('followField').value;[...selected].forEach(i=>{agencies[i].status='sent';agencies[i].lastSent=new Date().toISOString().slice(0,10);agencies[i].followUp=days==='0'?'':addDays(days)});renderAgencies()}
function sendSelected(){openComposer('agency');markSent();log('Batch prepared',selected.size+' agency recipients');toast('Batch prepared')}
function copyMessage(){navigator.clipboard?.writeText($('messageField').value);log('Message copied',$('composerMode').textContent);toast('Copied')}
function openEmail(){markSent();let url='mailto:'+encodeURIComponent($('toField').value)+'?subject='+encodeURIComponent($('subjectField').value)+'&body='+encodeURIComponent($('messageField').value);log('Email opened',$('toField').value);location.href=url}
function openWhatsApp(){markSent();log('WhatsApp opened',$('composerMode').textContent);window.open('https://wa.me/?text='+encodeURIComponent($('messageField').value),'_blank')}
function openIndeed(){log('Indeed opened','AI reply ready');window.open('https://www.indeed.co.uk/','_blank')}
function importCsv(){let rows=$('csvInput').value.trim().split(/\n+/).map(r=>r.split(/\t|,|;/).map(c=>c.trim()));let head=rows.shift().map(h=>h.toLowerCase());agencies=rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h==='agency name'?'agency':h,r[i]||'']))).map(a=>({agency:a.agency||a.name||'Agency',email:a.email||'',sector:a.sector||'',region:a.region||'',priority:a.priority||'',lastSent:a.lastsent||a['last sent']||'',followUp:a.followup||a['follow-up']||'',status:a.status||'not_contacted',notes:a.notes||''}));selected.clear();renderAgencies();log('Agency source imported',agencies.length+' rows');toast('Imported')}
function exportCsv(){let csv='agency,email,sector,region,priority,lastSent,followUp,status,notes\n'+agencies.map(a=>[a.agency,a.email,a.sector,a.region,a.priority,a.lastSent,a.followUp,a.status,a.notes].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n');navigator.clipboard?.writeText(csv);log('Agency CSV copied',agencies.length+' rows');toast('CSV copied')}
function seedDemo(){agencies=[...defaultAgencies];selected.clear();renderAgencies();log('Demo agencies loaded')}
function clearAgencies(){agencies=[];selected.clear();renderAgencies();log('Agencies cleared')}
function copyAgencySummary(){let txt=agencies.map(a=>`${a.agency}: ${statusLabel(a.status)} ${a.followUp?'- follow-up '+a.followUp:''}`).join('\n');navigator.clipboard?.writeText(txt);log('Agency summary copied')}
function toggleMenu(){let m=$('mainMenu'),s=$('shade');m.classList.toggle('open');s.classList.toggle('open',m.classList.contains('open'))}
function closeMenu(){$('mainMenu').classList.remove('open');$('shade').classList.remove('open')}
let scale=1,x=0,y=0,startDist=0,lastX=0,lastY=0,drag=false;function applyView(){$('viewerImg').style.transform=`translate(${x}px,${y}px) scale(${scale})`}
function openViewer(){$('viewer').classList.add('open');log('Photo viewer opened');resetView()}function closeViewer(){$('viewer').classList.remove('open')}function resetView(){scale=1;x=0;y=0;applyView()}
$('viewer').addEventListener('touchstart',e=>{if(e.touches.length===2){startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}else{drag=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY}}, {passive:false});
$('viewer').addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=Math.max(1,Math.min(5,scale*d/startDist));startDist=d}else if(drag&&scale>1){x+=e.touches[0].clientX-lastX;y+=e.touches[0].clientY-lastY;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY}applyView()}, {passive:false});
$('viewer').addEventListener('touchend',()=>drag=false);
renderAgencies();renderLog();openComposer('profile');
</script>
</body>
</html>
