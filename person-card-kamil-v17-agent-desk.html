<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOSMO Nexus — Kamil Person Card v17 Agent Desk</title>
<style>
:root{--bg:#030711;--panel:#071329;--line:#2457aa;--text:#f5f8ff;--muted:#9baad0;--blue:#2078ff;--cyan:#39d8ff;--green:#20e37a;--warn:#ffb020;--red:#ff4d67;--shadow:0 18px 70px #000b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 18% 4%,#155cff45,transparent 17rem),radial-gradient(circle at 100% 18%,#39d8ff18,transparent 22rem),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a,button,input,textarea,select{font:inherit;color:inherit}.screen{width:100%;max-width:430px;min-height:100vh;margin:0 auto;padding:12px 12px 24px}.top{height:44px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:8px;align-items:center}.mark{width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#1764ff,#44d7ff);display:grid;place-items:center;font-weight:1000;color:#00121f}.word{font-size:17px;line-height:.9;font-weight:1000;letter-spacing:.05em}.word span{display:block;color:var(--blue);font-size:11px;letter-spacing:.22em}.topBtns{display:flex;gap:8px}.topBtns a,.topBtns button{width:36px;height:36px;border:1px solid #ffffff24;border-radius:14px;background:#081225aa;display:grid;place-items:center;text-decoration:none}.card,.panel,.desk,.composer,.logBox,.tile,.agency{border:1px solid #2255a8cc;background:linear-gradient(180deg,#091b3aee,#050b18f2);box-shadow:var(--shadow),inset 0 0 0 1px #69a8ff12}.card{position:relative;overflow:hidden;padding:14px;border-radius:24px}.hero{display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center}.photoWrap{width:82px;height:96px;border:1px solid #2b65c3;border-radius:18px;overflow:hidden;background:#07142a}.photo{width:100%;height:100%;object-fit:cover}.name h1{margin:0;font-size:26px;line-height:.9;text-transform:uppercase;letter-spacing:-.04em}.name h2{margin:7px 0 1px;color:#2f7dff;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.name p{margin:0;color:#dde4f8;font-size:12px;text-transform:uppercase}.status{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1.35fr;border:1px solid #234779;border-radius:16px;overflow:hidden;background:#07142a}.status button{min-height:38px;border:0;border-right:1px solid #234779;background:transparent;font-weight:900;font-size:12px}.status button:last-child{border-right:0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green);margin-right:5px}.desk,.panel,.composer,.logBox{padding:13px;margin-top:12px;border-radius:18px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.head strong{color:#2f7dff;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.head span{color:#9baad0;font-size:11px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{border:1px solid #1e4e97;border-radius:15px;background:#07142a;padding:9px 6px;text-align:center}.metric b{display:block;font-size:20px}.metric span{display:block;color:#9baad0;font-size:10px;margin-top:2px}.toolbar,.tabs,.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.toolbar button,.tabs button,.quick button,.btn{border:1px solid #2456a6;border-radius:999px;background:#0a1b36;padding:8px 10px;font-size:12px;text-decoration:none}.toolbar button.primary,.tabs button.active,.btn.primary{border-color:#39d8ff;background:#0c3672}.plan{display:grid;gap:8px;margin-top:10px}.task{border:1px solid #ffffff14;border-radius:15px;background:#07142a;padding:10px}.task b{display:block;font-size:13px}.task span{display:block;color:#9baad0;font-size:11px;margin-top:3px;line-height:1.35}.task.hot{border-color:#20e37a88}.task.due{border-color:#ffb02088}.task.skip{opacity:.62}.agencyList{display:grid;gap:8px;margin-top:10px}.agency{padding:10px;border-radius:15px}.agencyTop{display:flex;gap:8px;align-items:flex-start}.agency input{margin-top:3px}.agency b{display:block;font-size:13px}.agency small{display:block;color:#9baad0;font-size:11px;margin-top:2px}.badge{display:inline-block;margin-top:5px;margin-right:4px;border:1px solid #2456a6;border-radius:999px;padding:3px 7px;font-size:10px;color:#cbd8f7}.badge.hot{border-color:#20e37a;color:#20e37a}.badge.due{border-color:#ffb020;color:#ffb020}.badge.black{border-color:#ff4d67;color:#ff4d67}.composer label{display:block;margin:10px 0 5px;color:#9baad0;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.composer input,.composer textarea{width:100%;border:1px solid #2456a6;border-radius:14px;background:#050d1d;color:#f5f8ff;padding:10px}.composer textarea{min-height:130px;resize:vertical;line-height:1.35}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.actions button,.actions a{border:1px solid #2456a6;border-radius:14px;background:#0a1b36;padding:10px 5px;text-align:center;text-decoration:none;font-size:12px}.actions .primary{border-color:#39d8ff;background:#0c3672}.logList{display:grid;gap:7px}.logItem{border:1px solid #ffffff14;border-radius:13px;background:#07142a;padding:8px 10px}.logItem b{display:block;font-size:12px}.logItem span{display:block;color:#9baad0;font-size:11px;margin-top:2px}.source textarea{width:100%;min-height:110px;border:1px solid #2456a6;border-radius:14px;background:#050d1d;color:#f5f8ff;padding:10px;resize:vertical;font-size:12px}.hide{display:none}@media(max-height:770px){.screen{max-width:410px}.name h1{font-size:23px}.desk,.panel,.composer,.logBox{padding:11px}.metric b{font-size:17px}}
</style>
</head>
<body>
<main class="screen">
<header class="top"><div class="brand"><div class="mark">N</div><div class="word">NOSMO<span>NEXUS</span></div></div><div class="topBtns"><a href="nexus-preview.html?v=clouds6" title="Back">↩</a><button onclick="buildPlan()">AI</button></div></header>
<section class="card"><div class="hero"><div class="photoWrap"><img class="photo" src="assets/KamilKaraszewski.jpeg" alt="Kamil Karaszewski"></div><div class="name"><h1>Kamil<br>Karaszewski</h1><h2>Technical Advisor</h2><p>Welding & Fabrication</p></div></div><div class="status"><button><span class="dot"></span>Available</button><button>Verified</button><button>Agent Desk</button></div></section>
<section class="desk">
  <div class="head"><strong>Nexus Agent Desk</strong><span id="todayLabel"></span></div>
  <div class="grid4"><div class="metric"><b id="mTotal">0</b><span>Agencies</span></div><div class="metric"><b id="mDue">0</b><span>Due today</span></div><div class="metric"><b id="mHot">0</b><span>Hot leads</span></div><div class="metric"><b id="mQueue">0</b><span>Queue</span></div></div>
  <div class="tabs"><button class="active" onclick="showTab('plan',this)">Today</button><button onclick="showTab('agencies',this)">Agencies</button><button onclick="showTab('source',this)">Source</button><button onclick="showTab('log',this)">Log</button></div>
  <div class="toolbar"><button class="primary" onclick="buildPlan()">Build today's plan</button><button onclick="selectDue()">Select due</button><button onclick="selectHot()">Select hot</button><button onclick="sendBatch()">Queue selected</button></div>
</section>
<section class="panel" id="tab-plan"><div class="head"><strong>Today Plan</strong><span>AI routed actions</span></div><div class="plan" id="planList"></div></section>
<section class="panel hide" id="tab-agencies"><div class="head"><strong>Agency Pack</strong><span id="selectedCount">0 selected</span></div><div class="quick"><button onclick="selectAll(true)">Select all</button><button onclick="selectAll(false)">Clear</button><button onclick="markSelected('sent')">Mark sent</button><button onclick="markSelected('waiting')">Waiting</button><button onclick="markSelected('blacklist')">Blacklist</button></div><div class="agencyList" id="agencyList"></div></section>
<section class="panel source hide" id="tab-source"><div class="head"><strong>Agency Source</strong><span>Google Sheet / CSV paste</span></div><textarea id="csvBox">Agency name,Email,Sector,Region,Priority,Last sent,Status,Notes
Mane Contract Services,jobs@mane.co.uk,Welding,UK,High,2026-08-08,sent,Need follow-up
Shorterm Group,industrial@shorterm.co.uk,Engineering,UK,High,2026-08-10,interested,Ask for certs
Technojobs,contact@technojobs.co.uk,Technical,UK,Medium,,not_contacted,
Matchtech,candidates@matchtech.com,Fabrication,UK,Medium,2026-08-01,waiting,Call back
Carbon60,industrial@carbon60global.com,Industrial,UK,Low,2026-08-02,no_role,Try later</textarea><div class="toolbar"><button class="primary" onclick="importCsv()">Import</button><button onclick="copyCsv()">Copy CSV</button><button onclick="resetDemo()">Reset demo</button></div></section>
<section class="composer" id="composer"><div class="head"><strong>Composer</strong><span id="modeLabel">ready</span></div><label>To</label><input id="toField" value=""><label>Subject</label><input id="subjectField" value="Kamil Karaszewski — Welding / Fabrication profile"><label>Message</label><textarea id="messageField"></textarea><div class="actions"><button class="primary" onclick="copyMsg()">Copy</button><a id="emailBtn" href="#" onclick="openEmail(event)">Email</a><a id="waBtn" href="#" onclick="openWhatsapp(event)">WhatsApp</a><button onclick="queueMsg()">Queue</button></div></section>
<section class="logBox" id="tab-log"><div class="head"><strong>Recent Actions</strong><span><button class="btn" onclick="clearLog()">Clear</button></span></div><div class="logList" id="logList"></div></section>
</main>
<script>
const profileUrl='https://nosmotechnology.co.uk/person-card-kamil.html?v=v17agent1';
const storeKey='nosmo_v17_agencies'; const logKey='nosmo_v17_log';
let agencies=[]; let selected=new Set();
function demoAgencies(){return[
{name:'Mane Contract Services',email:'jobs@mane.co.uk',sector:'Welding',region:'UK',priority:'High',lastSent:'2026-08-08',status:'sent',notes:'Need follow-up'},
{name:'Shorterm Group',email:'industrial@shorterm.co.uk',sector:'Engineering',region:'UK',priority:'High',lastSent:'2026-08-10',status:'interested',notes:'Ask for certs'},
{name:'Technojobs',email:'contact@technojobs.co.uk',sector:'Technical',region:'UK',priority:'Medium',lastSent:'',status:'not_contacted',notes:''},
{name:'Matchtech',email:'candidates@matchtech.com',sector:'Fabrication',region:'UK',priority:'Medium',lastSent:'2026-08-01',status:'waiting',notes:'Call back'},
{name:'Carbon60',email:'industrial@carbon60global.com',sector:'Industrial',region:'UK',priority:'Low',lastSent:'2026-08-02',status:'no_role',notes:'Try later'}]}
function load(){agencies=JSON.parse(localStorage.getItem(storeKey)||'null')||demoAgencies();document.getElementById('todayLabel').textContent=new Date().toLocaleDateString();renderAll();buildPlan(false);}
function save(){localStorage.setItem(storeKey,JSON.stringify(agencies));}
function daysSince(d){if(!d)return 999;return Math.floor((new Date()-new Date(d+'T00:00:00'))/86400000)}
function isDue(a){return ['sent','waiting','call_back'].includes(a.status)&&daysSince(a.lastSent)>=3}
function isHot(a){return ['interested','send_certs','call_back'].includes(a.status)||a.priority==='High'}
function metrics(){document.getElementById('mTotal').textContent=agencies.length;document.getElementById('mDue').textContent=agencies.filter(isDue).length;document.getElementById('mHot').textContent=agencies.filter(isHot).length;document.getElementById('mQueue').textContent=selected.size;document.getElementById('selectedCount').textContent=selected.size+' selected'}
function badge(a){let b=''; if(isHot(a))b+='<span class="badge hot">HOT</span>'; if(isDue(a))b+='<span class="badge due">DUE</span>'; if(a.status==='blacklist')b+='<span class="badge black">BLACKLIST</span>'; b+='<span class="badge">'+a.status.replace('_',' ')+'</span>'; return b;}
function renderAgencies(){document.getElementById('agencyList').innerHTML=agencies.map((a,i)=>`<div class="agency"><div class="agencyTop"><input type="checkbox" ${selected.has(i)?'checked':''} onchange="toggleSel(${i},this.checked)"><div><b>${a.name}</b><small>${a.email} · ${a.sector} · ${a.region} · ${a.priority}</small>${badge(a)}<small>${a.notes||'No notes'} · last sent: ${a.lastSent||'never'}</small><div class="quick"><button onclick="compose(${i},'initial')">Initial</button><button onclick="compose(${i},'followup')">Follow-up</button><button onclick="compose(${i},'certs')">Certs</button><button onclick="compose(${i},'call')">Call</button></div></div></div></div>`).join('')}
function renderAll(){metrics();renderAgencies();renderLog();}
function toggleSel(i,v){v?selected.add(i):selected.delete(i);renderAll();}
function selectAll(v){selected=v?new Set(agencies.map((_,i)=>i)):new Set();renderAll();}
function selectDue(){selected=new Set(agencies.map((a,i)=>isDue(a)?i:null).filter(x=>x!==null));renderAll();log('Selected due agencies',selected.size+' agencies')}
function selectHot(){selected=new Set(agencies.map((a,i)=>isHot(a)?i:null).filter(x=>x!==null));renderAll();log('Selected hot leads',selected.size+' agencies')}
function showTab(name,btn){['plan','agencies','source','log'].forEach(t=>document.getElementById('tab-'+t)?.classList.add('hide'));document.getElementById('tab-'+name)?.classList.remove('hide');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn?.classList.add('active')}
function buildPlan(writeLog=true){let tasks=[];agencies.forEach((a,i)=>{if(a.status==='blacklist')tasks.push({c:'skip',t:'Skip '+a.name,d:'Blacklisted. Do not contact unless manually reopened.',i,mode:'skip'});else if(a.status==='interested'||a.status==='send_certs')tasks.push({c:'hot',t:'Send certificates to '+a.name,d:'Hot lead. Send certs, profile link and availability.',i,mode:'certs'});else if(a.status==='call_back'||a.status==='waiting')tasks.push({c:'due',t:'Call / follow up '+a.name,d:'Waiting or call-back state. Follow up with short message.',i,mode:'followup'});else if(isDue(a))tasks.push({c:'due',t:'Follow up '+a.name,d:'Last sent '+daysSince(a.lastSent)+' days ago. Send polite follow-up.',i,mode:'followup'});else if(!a.lastSent)tasks.push({c:'',t:'Initial outreach '+a.name,d:'No previous contact. Send profile intro.',i,mode:'initial'});});
 if(!tasks.length)tasks=[{c:'',t:'No urgent actions',d:'No due follow-ups. Add agencies or import Google Sheet rows.',i:null,mode:'initial'}];
 document.getElementById('planList').innerHTML=tasks.map(x=>`<div class="task ${x.c}"><b>${x.t}</b><span>${x.d}</span>${x.i!==null?`<div class="quick"><button onclick="compose(${x.i},'${x.mode}')">Compose</button><button onclick="toggleSel(${x.i},true)">Select</button></div>`:''}</div>`).join('');
 if(writeLog)log('AI daily plan built',tasks.length+' task(s) routed');}
function textFor(a,mode){let base=`Hi ${a.name},\n\nI am sharing Kamil Karaszewski's NOSMO Person Card and work profile. Kamil is available for welding, fabrication and technical advisory work.\n\nProfile: ${profileUrl}\n\n`; if(mode==='followup')base=`Hi ${a.name},\n\nJust following up on Kamil Karaszewski's profile. He is available for welding/fabrication roles and can send certificates, references and availability details if useful.\n\nProfile: ${profileUrl}\n\n`; if(mode==='certs')base=`Hi ${a.name},\n\nThanks for the interest. I can send Kamil Karaszewski's certificates, CV/work pack and references. His Person Card is here:\n\n${profileUrl}\n\n`; if(mode==='call')base=`Hi ${a.name},\n\nCan we arrange a quick call about possible work for Kamil Karaszewski? He is available for welding/fabrication/technical advisory roles.\n\nProfile: ${profileUrl}\n\n`; return base+'Regards,\nNOSMO Nexus';}
function compose(i,mode){let a=agencies[i];document.getElementById('toField').value=a.email;document.getElementById('subjectField').value=`Kamil Karaszewski — ${mode==='followup'?'follow-up':mode==='certs'?'certificates / work pack':mode==='call'?'call request':'welding / fabrication profile'}`;document.getElementById('messageField').value=textFor(a,mode);document.getElementById('modeLabel').textContent=a.name+' · '+mode;document.getElementById('composer').scrollIntoView({behavior:'smooth'});log('Composer opened',a.name+' · '+mode)}
function mailto(){return 'mailto:'+encodeURIComponent(document.getElementById('toField').value)+'?subject='+encodeURIComponent(document.getElementById('subjectField').value)+'&body='+encodeURIComponent(document.getElementById('messageField').value)}
function openEmail(e){e.preventDefault();log('Email opened',document.getElementById('toField').value);location.href=mailto()}
function openWhatsapp(e){e.preventDefault();log('WhatsApp opened','message copied to WhatsApp flow');window.open('https://wa.me/?text='+encodeURIComponent(document.getElementById('messageField').value),'_blank')}
function copyMsg(){navigator.clipboard?.writeText(document.getElementById('messageField').value);log('Message copied',document.getElementById('toField').value)}
function queueMsg(){log('Queued message',document.getElementById('toField').value)}
function sendBatch(){if(!selected.size){log('Queue skipped','No agencies selected');return}let emails=[...selected].map(i=>agencies[i].email).join(',');document.getElementById('toField').value=emails;document.getElementById('subjectField').value='Kamil Karaszewski — selected agency batch';document.getElementById('messageField').value='Hi,\n\nSharing Kamil Karaszewski\'s NOSMO Person Card and work profile.\n\nProfile: '+profileUrl+'\n\nRegards,\nNOSMO Nexus';log('Batch queued',selected.size+' agencies');}
function markSelected(status){[...selected].forEach(i=>{agencies[i].status=status;agencies[i].lastSent=new Date().toISOString().slice(0,10)});save();renderAll();buildPlan(false);log('Selected marked '+status,selected.size+' agencies')}
function importCsv(){let rows=document.getElementById('csvBox').value.trim().split(/\n+/);let data=rows.slice(1).map(r=>{let p=r.split(/\t|;|,/).map(x=>x.trim());return{name:p[0]||'Agency',email:p[1]||'',sector:p[2]||'',region:p[3]||'',priority:p[4]||'Medium',lastSent:p[5]||'',status:p[6]||'not_contacted',notes:p.slice(7).join(' ')||''}}).filter(a=>a.email);agencies=data;selected=new Set();save();renderAll();buildPlan(false);log('Agency source imported',data.length+' rows')}
function copyCsv(){let csv='Agency name,Email,Sector,Region,Priority,Last sent,Status,Notes\n'+agencies.map(a=>[a.name,a.email,a.sector,a.region,a.priority,a.lastSent,a.status,a.notes].join(',')).join('\n');navigator.clipboard?.writeText(csv);log('CSV copied',agencies.length+' agencies')}
function resetDemo(){agencies=demoAgencies();selected=new Set();save();renderAll();buildPlan(false);log('Demo data reset','Agency source restored')}
function log(title,detail){let l=JSON.parse(localStorage.getItem(logKey)||'[]');l.unshift({title,detail,time:new Date().toLocaleString()});localStorage.setItem(logKey,JSON.stringify(l.slice(0,20)));renderLog();}
function renderLog(){let l=JSON.parse(localStorage.getItem(logKey)||'[]');document.getElementById('logList').innerHTML=l.length?l.map(x=>`<div class="logItem"><b>${x.title}</b><span>${x.detail} · ${x.time}</span></div>`).join(''):'<div class="logItem"><b>No actions yet</b><span>Agent Desk is ready.</span></div>'}
function clearLog(){localStorage.removeItem(logKey);renderLog()}
load();
</script>
</body>
</html>
