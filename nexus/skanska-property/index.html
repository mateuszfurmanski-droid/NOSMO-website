<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110d">
<title>NOSMO Nexus — SKANSKA Property Demo</title>
<meta name="description" content="NOSMO Nexus commercial property and building operations demonstrator prepared for SKANSKA use-case exploration.">
<link rel="stylesheet" href="./skanska-property-demo.css">
<style>html,body,#root{margin:0;min-height:100%;background:#07110d}#bootError{display:none;padding:24px;color:#fff;font:14px system-ui;background:#120b0b}</style>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="importmap">
{"imports":{
"react":"https://esm.sh/react@18.3.1",
"react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
"lucide-react":"https://esm.sh/lucide-react@0.468.0?external=react"
}}
</script>
</head>
<body>
<div id="root"></div>
<div id="bootError"></div>
<script type="module">
import React, { useEffect, useMemo, useState } from "react";
import { createRoot } from "react-dom/client";
import {
  AlertTriangle, ArrowRight, Bot, Boxes, Building2, Camera, CheckCircle2,
  ClipboardCheck, Database, Factory, FileText, History, Layers, Leaf, Link2,
  MapPin, Play, Recycle, RotateCcw, Search, ShieldCheck, Upload, User, Wrench
} from "lucide-react";

(async function bootPropertyDemo(){
  try {
    const [dataResponse, appResponse] = await Promise.all([
      fetch('./data.ts', {cache:'no-store'}),
      fetch('./SkanskaPropertyDemo.tsx', {cache:'no-store'})
    ]);
    if (!dataResponse.ok || !appResponse.ok) throw new Error('Demo source files could not be loaded.');
    let dataSource = await dataResponse.text();
    let appSource = await appResponse.text();

    dataSource = dataSource.replace(/\bexport\s+/g, '');
    const appStart = appSource.indexOf('type DemoTheme');
    if (appStart < 0) throw new Error('Property demo component boundary was not found.');
    appSource = appSource.slice(appStart)
      .replace('export default function SkanskaPropertyDemo()', 'function SkanskaPropertyDemo()');

    const source = [
      'const compactNexusLogo = "../spark/NEXUS_Logo_UI_Mark_N.png";',
      dataSource,
      appSource,
      'createRoot(document.getElementById("root")).render(React.createElement(SkanskaPropertyDemo));'
    ].join('\n');

    const compiled = Babel.transform(source, {
      filename: 'SkanskaPropertyDemo.tsx',
      presets: ['typescript', ['react', {runtime:'classic'}]],
      sourceType: 'script'
    }).code;

    eval(compiled);
  } catch (error) {
    console.error(error);
    const target = document.getElementById('bootError');
    target.style.display = 'block';
    target.textContent = 'NOSMO SKANSKA Property Demo failed to start: ' + (error?.message || String(error));
  }
})();
</script>
</body>
</html>
