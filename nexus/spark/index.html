<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08110f">
<title>NEXUS Spark Demo Core</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08110f}#sparkFrame{display:block;width:100%;height:100%;border:0;background:#08110f}.langToggle{position:fixed;right:10px;top:8px;z-index:9999;width:36px;height:34px;border:1px solid #3d554c;border-radius:5px;background:#0c1714;color:#fff;font:18px/1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.28)}.langToggle:hover{background:#13221d}.langToggle:focus-visible{outline:2px solid #9de6c2;outline-offset:2px}@media(max-width:720px){.langToggle{top:7px;right:8px;width:34px;height:32px;font-size:17px}}
</style>
</head>
<body>
<iframe id="sparkFrame" src="core.html" title="NEXUS Spark Demo"></iframe>
<button id="langToggle" class="langToggle" type="button" aria-label="Przełącz na język polski" title="Polski">🇵🇱</button>
<script>
const frame=document.getElementById('sparkFrame');
const toggle=document.getElementById('langToggle');
const compactLogoUrl='/assets/NEXUS_Logo_UI_Blue.png?v=c9098f';
let language='en',observer=null,translating=false;
const originals=new WeakMap(),attrOriginals=new WeakMap();
const pl={
'Project':'Projekt','Environmental':'Środowisko','Project structure':'Struktura projektu','Source truth':'Wiarygodność źródła','CO₂ data':'Dane CO₂','Maintenance':'Utrzymanie','Demo writes':'Zapisy dema','rule-based':'oparte na regułach','browser-local':'lokalne w przeglądarce','tracked':'śledzone','created locally':'utworzone lokalnie','reuse':'ponowne użycie','recover / recycle':'odzysk / recykling','known provenance':'znane pochodzenie','high attention':'wysoka uwaga','human decisions':'decyzje człowieka','record edits':'edycje rekordów','+ Add Object':'+ Dodaj obiekt','All circular statuses':'Wszystkie statusy cyrkularne','All provenance':'Wszystkie poziomy pochodzenia','Object':'Obiekt','Area':'Obszar','Type':'Typ','Circular':'Cyrkularność','Provenance':'Pochodzenie','Attention':'Uwaga','Last inspection':'Ostatnia inspekcja','Source':'Źródło','Select a row or create a typed Object Card.':'Wybierz rekord lub utwórz Kartę Obiektu.','Location':'Lokalizacja','Lifecycle state':'Stan cyklu życia','Source document':'Dokument źródłowy','Edit record':'Edytuj rekord','Edited by':'Edytował','Change note':'Notatka zmiany','Save record update':'Zapisz aktualizację rekordu','Evidence':'Dowody','Lifecycle timeline':'Oś czasu cyklu życia','Maintenance / inspection':'Utrzymanie / inspekcja','Attention reason':'Powód uwagi','Human circular decision':'Decyzja cyrkularna człowieka','Target circular status':'Docelowy status cyrkularny','Decision by':'Decyzję podjął','Decision rationale':'Uzasadnienie decyzji','Save human decision':'Zapisz decyzję człowieka','NEW OBJECT CARD':'NOWA KARTA OBIEKTU','Add project object':'Dodaj obiekt projektu','BROWSER-LOCAL DEMO':'DEMO LOKALNE W PRZEGLĄDARCE','Nexus Object Card v1':'Nexus Karta Obiektu v1','Object profile':'Profil obiektu','Name / label':'Nazwa / etykieta','Specific type':'Szczegółowy typ','Project area':'Obszar projektu','Initial circular status':'Początkowy status cyrkularny','Created by':'Utworzył','Creation note':'Notatka utworzenia','Create Object Card':'Utwórz Kartę Obiektu','Circular / Environmental report':'Raport cyrkularny / środowiskowy','Download CSV':'Pobierz CSV','Print / Save PDF':'Drukuj / Zapisz PDF','Circular status':'Status cyrkularny','CO₂ reporting readiness':'Gotowość raportowania CO₂','Verified quantity':'Zweryfikowana ilość','EPD / carbon factor':'EPD / współczynnik emisji','Maintenance attention':'Poziom uwagi utrzymaniowej','Object creation audit':'Rejestr tworzenia obiektów','Created objects':'Utworzone obiekty','Human decision audit':'Rejestr decyzji człowieka','Audit events':'Zdarzenia audytowe','Objects changed':'Zmienione obiekty','Record edit audit':'Rejestr edycji rekordów','Edit events':'Zdarzenia edycji','Objects edited':'Edytowane obiekty','Current Object Register records':'Bieżące rekordy Rejestru Obiektów','Synthetic / browser-derived demonstrator records':'Syntetyczne / utworzone w przeglądarce rekordy demonstratora','Missing or unverified source data':'Brakujące lub niezweryfikowane dane źródłowe','No real SKANSKA project records loaded':'Nie wczytano rzeczywistych rekordów projektu SKANSKA','Not connected in demonstrator':'Niepodłączone w demonstratorze','Intentionally not fabricated':'Celowo nie są generowane sztuczne wartości','Browser-local typed Object Cards':'Lokalne w przeglądarce typowane Karty Obiektu','Browser-local demo decisions':'Lokalne w przeglądarce decyzje demonstracyjne','Unique records with a human decision':'Unikalne rekordy z decyzją człowieka','Browser-local demo field updates':'Lokalne w przeglądarce aktualizacje pól','Unique records with edited fields':'Unikalne rekordy z edytowanymi polami','No demo record edit saved yet.':'Nie zapisano jeszcze edycji rekordu demonstracyjnego.','No evidence attached to this demo object.':'Do tego obiektu demonstracyjnego nie dołączono dowodów.','No human demo decision recorded yet.':'Nie zapisano jeszcze decyzji demonstracyjnej.','No browser-local Object Card created yet.':'Nie utworzono jeszcze lokalnej Karty Obiektu.','No human demo decisions recorded yet.':'Nie zapisano jeszcze decyzji demonstracyjnych.','No demo record edits saved yet.':'Nie zapisano jeszcze edycji rekordów demonstracyjnych.'
};
const ph={
'Search ID, object, location, type or source':'Szukaj ID, obiektu, lokalizacji, typu lub źródła','Optional reason for the update':'Opcjonalny powód aktualizacji','Why is this circular route defensible?':'Dlaczego ta ścieżka cyrkularna jest uzasadniona?','e.g. Timber acoustic panel batch':'np. partia drewnianych paneli akustycznych','e.g. CLT panel, pump, door set':'np. panel CLT, pompa, zestaw drzwiowy','Level / room / storage or installation position':'Poziom / pomieszczenie / magazyn lub miejsce instalacji','Optional — does not imply verification':'Opcjonalne — nie oznacza weryfikacji','What is this record and why is it being added?':'Czym jest ten rekord i dlaczego jest dodawany?'
};
function ensureBrandLogo(){
 const doc=frame.contentDocument;if(!doc)return;
 const brand=doc.querySelector('.brand');if(!brand||brand.dataset.compactNexusLogo==='1')return;
 brand.replaceChildren();
 const img=doc.createElement('img');img.src=compactLogoUrl;img.alt='NEXUS compact logo';img.style.cssText='display:block;height:36px;width:auto;object-fit:contain';
 brand.appendChild(img);brand.dataset.compactNexusLogo='1';
}
function transform(s){
 const lead=s.match(/^\s*/)?.[0]||'',trail=s.match(/\s*$/)?.[0]||'',t=s.trim();
 if(pl[t])return lead+pl[t]+trail;
 let x=t
 .replace(/Spark 4\.0 \/ SKANSKA Residential Development use-case/g,'Spark 4.0 / SKANSKA Residential Development — przypadek użycia')
 .replace(/Object Register/g,'Rejestr obiektów')
 .replace(/tracked records/g,'śledzonych rekordów')
 .replace(/(\d+) areas/g,'$1 obszary')
 .replace(/Current status:/g,'Aktualny status:')
 .replace(/LOW attention/g,'NISKA uwaga')
 .replace(/MEDIUM attention/g,'ŚREDNIA uwaga')
 .replace(/HIGH attention/g,'WYSOKA uwaga')
 .replace(/Decision audit trail/g,'Rejestr decyzji')
 .replace(/Record edit audit/g,'Rejestr edycji rekordów');
 return lead+x+trail;
}
function translateNode(node){
 if(!originals.has(node))originals.set(node,node.textContent||'');
 const en=originals.get(node)||'',target=language==='pl'?transform(en):en;
 if(node.textContent!==target)node.textContent=target;
}
function translateElement(el){
 if(!attrOriginals.has(el))attrOriginals.set(el,{placeholder:el.getAttribute('placeholder'),title:el.getAttribute('title'),aria:el.getAttribute('aria-label')});
 const o=attrOriginals.get(el);
 if(o.placeholder!==null){const target=language==='pl'?(ph[o.placeholder]||transform(o.placeholder)):o.placeholder;if(el.getAttribute('placeholder')!==target)el.setAttribute('placeholder',target)}
 if(o.title!==null){const target=language==='pl'?transform(o.title):o.title;if(el.getAttribute('title')!==target)el.setAttribute('title',target)}
 if(o.aria!==null){const target=language==='pl'?transform(o.aria):o.aria;if(el.getAttribute('aria-label')!==target)el.setAttribute('aria-label',target)}
}
function applyLanguage(){
 const doc=frame.contentDocument;if(!doc||translating)return;translating=true;
 try{
  ensureBrandLogo();
  doc.documentElement.lang=language;
  const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
  let n;while((n=walker.nextNode())){const p=n.parentElement;if(!p||p.tagName==='SCRIPT'||p.tagName==='STYLE')continue;translateNode(n)}
  doc.querySelectorAll('[placeholder],[title],[aria-label]').forEach(translateElement);
  let pad=doc.getElementById('nexusLangOverlayPadding');if(!pad){pad=doc.createElement('style');pad.id='nexusLangOverlayPadding';pad.textContent='.truth{padding-right:44px!important}';doc.head.appendChild(pad)}
 }finally{translating=false}
}
function installObserver(){
 if(observer)observer.disconnect();const doc=frame.contentDocument;if(!doc)return;
 observer=new MutationObserver(()=>{if(language==='pl'&&!translating)queueMicrotask(applyLanguage)});
 observer.observe(doc.body,{subtree:true,childList:true});
}
function setLanguage(next){language=next;toggle.textContent=next==='en'?'🇵🇱':'🇬🇧';toggle.title=next==='en'?'Polski':'English';toggle.setAttribute('aria-label',next==='en'?'Przełącz na język polski':'Switch to English');applyLanguage()}
frame.addEventListener('load',()=>{installObserver();applyLanguage()});
toggle.addEventListener('click',()=>setLanguage(language==='en'?'pl':'en'));
</script>
</body>
</html>
