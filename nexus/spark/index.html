<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>NEXUS Spark Demo Core</title>
<link rel="stylesheet" href="./spark-demo.css">
<style>html,body,#root{margin:0;min-height:100%;background:#0a0a0a}#bootError{display:none;padding:20px;color:#fff;font:14px system-ui;background:#0a0a0a}</style>
</head>
<body>
<div id="root"></div>
<div id="bootError"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script>
(async function bootSparkDemo(){
  try {
    const [dataResponse, appResponse] = await Promise.all([
      fetch('./data.ts', {cache:'no-store'}),
      fetch('./SparkSkanskaDemo.tsx', {cache:'no-store'})
    ]);
    if (!dataResponse.ok || !appResponse.ok) throw new Error('Spark source files could not be loaded.');
    let dataSource = await dataResponse.text();
    let appSource = await appResponse.text();
    dataSource = dataSource.replace(/\bexport\s+/g, '');
    const appStart = appSource.indexOf('const circularStatuses');
    if (appStart < 0) throw new Error('Spark component source boundary was not found.');
    appSource = appSource.slice(appStart)
      .replace('export default function SparkSkanskaDemo()', 'function SparkSkanskaDemo()');
    const source = [
      'const { useEffect, useMemo, useState } = React;',
      'const compactNexusLogo = "./NEXUS_Logo_UI_Mark_N.png";',
      dataSource,
      appSource,
      'ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(SparkSkanskaDemo));'
    ].join('\n');
    const compiled = Babel.transform(source, {
      filename: 'SparkSkanskaDemo.tsx',
      presets: ['typescript', ['react', {runtime:'classic'}]],
      sourceType: 'script'
    }).code;
    (0, eval)(compiled);
  } catch (error) {
    console.error(error);
    const target = document.getElementById('bootError');
    target.style.display = 'block';
    target.textContent = 'NEXUS Spark Demo failed to start: ' + (error && error.message ? error.message : String(error));
  }
})();
</script>
</body>
</html>
