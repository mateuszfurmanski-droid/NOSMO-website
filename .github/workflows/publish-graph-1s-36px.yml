name: Publish graph 1s 36px

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-graph-1s-36px.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-2ff4-81f7-b432-803493851c67/raw?se=2026-08-04T08:00:59Z&sp=r&sv=2026-02-06&sr=b&scid=a44d722d-b045-54c0-b879-1f49fad9ae7c&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T06:58:50Z&ske=2026-08-05T06:58:50Z&sks=b&skv=2026-02-06&sig=JuiOOE1p03kBXtFXTKpmvQfmpM06GvvQ%2B52L16ifalY%3D'

    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated graph preview
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-graph.zip
          rm -rf /tmp/nexus-graph-build
          mkdir -p /tmp/nexus-graph-build
          unzip -q /tmp/nexus-graph.zip -d /tmp/nexus-graph-build
          test -f /tmp/nexus-graph-build/index.html
          test -f /tmp/nexus-graph-build/relationship-tree/index.html

      - name: Replace public graph preview
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-graph-build/. apps/nexus-graph-preview/
          grep -Fq '/apps/nexus-graph-preview/assets/' apps/nexus-graph-preview/index.html
          grep -Fq '/apps/nexus-graph-preview/relationship-tree' apps/nexus-graph-preview/relationship-tree/index.html

      - name: Commit preview and remove workflow
        run: |
          rm .github/workflows/publish-graph-1s-36px.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/nexus-graph-preview .github/workflows/publish-graph-1s-36px.yml
          git commit -m "Set Nexus graph release to 1s and 36px"
          git push origin HEAD:main
