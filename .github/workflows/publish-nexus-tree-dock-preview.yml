name: Publish Nexus Relationship Tree Dock Preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-nexus-tree-dock-preview.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-511c-81f4-9425-55375bde448f/raw?se=2026-08-04T16:08:24Z&sp=r&sv=2026-02-06&sr=b&scid=3f54a428-d37c-522d-a837-be37b6e30b38&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T06:54:07Z&ske=2026-08-05T06:54:07Z&sks=b&skv=2026-02-06&sig=lno04R%2BVmk0INClRZgxXsB/t0Xnpv291Z%2BW75SfmqM4%3D'
      JS_FILE: index-B5PBiEpQ.js
      CSS_FILE: index-06Xg5fKC.css
      PUBLIC_BASE: /apps/nexus-tree-dock-preview/

    steps:
      - name: Check out public website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated Nexus artifact
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-tree-dock.zip
          rm -rf /tmp/nexus-tree-dock-build
          mkdir -p /tmp/nexus-tree-dock-build
          unzip -q /tmp/nexus-tree-dock.zip -d /tmp/nexus-tree-dock-build
          test -f "/tmp/nexus-tree-dock-build/assets/$JS_FILE"
          test -f "/tmp/nexus-tree-dock-build/assets/$CSS_FILE"

      - name: Configure isolated public base
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path('/tmp/nexus-tree-dock-build')
          public_base = os.environ['PUBLIC_BASE']
          js_name = os.environ['JS_FILE']
          css_name = os.environ['CSS_FILE']

          index = root / 'index.html'
          html = index.read_text()
          replacements = {
              'href="/favicon.svg"': f'href="{public_base}favicon.svg"',
              f'src="/assets/{js_name}"': f'src="{public_base}assets/{js_name}"',
              f'href="/assets/{css_name}"': f'href="{public_base}assets/{css_name}"',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Missing index marker: {old}')
              html = html.replace(old, new, 1)
          index.write_text(html)

          js_path = root / 'assets' / js_name
          js = js_path.read_text()
          markers = ['const Mp="/"', 'const Tw="/"', 'const WB="/"']
          for marker in markers:
              if marker not in js:
                  raise SystemExit(f'Missing JS base marker: {marker}')
              js = js.replace(marker, marker.replace('"/"', f'"{public_base}"'), 1)

          router_marker = 'base:"/".replace(/\\/$/,"")'
          if router_marker not in js:
              raise SystemExit('Missing router base marker')
          js = js.replace(router_marker, f'base:"{public_base}".replace(/\\/$/,"")', 1)
          js_path.write_text(js)
          PY

      - name: Replace isolated preview package
        run: |
          rm -rf apps/nexus-tree-dock-preview
          mkdir -p apps/nexus-tree-dock-preview
          cp -a /tmp/nexus-tree-dock-build/. apps/nexus-tree-dock-preview/
          cat > nexus-tree-dock-preview.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#050913">
          <title>NOSMO Nexus Relationship Tree Dock Preview</title>
          <meta http-equiv="refresh" content="0; url=/apps/nexus-tree-dock-preview/">
          <script>window.location.replace('/apps/nexus-tree-dock-preview/?v=dock1'+window.location.hash);</script>
          </head>
          <body>Opening NOSMO Nexus…</body>
          </html>
          HTML

      - name: Verify preview and launcher targets
        run: |
          node --check "apps/nexus-tree-dock-preview/assets/$JS_FILE"
          grep -Fq 'const Mp="/apps/nexus-tree-dock-preview/"' "apps/nexus-tree-dock-preview/assets/$JS_FILE"
          grep -Fq 'const Tw="/apps/nexus-tree-dock-preview/"' "apps/nexus-tree-dock-preview/assets/$JS_FILE"
          grep -Fq 'const WB="/apps/nexus-tree-dock-preview/"' "apps/nexus-tree-dock-preview/assets/$JS_FILE"
          grep -Fq 'base:"/apps/nexus-tree-dock-preview/".replace' "apps/nexus-tree-dock-preview/assets/$JS_FILE"
          test -f apps/nexus-tree-dock-preview/doorflow-demo/index.html
          test -f apps/nexus-tree-dock-preview/fire-door-register-demo/index.html
          test -f apps/nexus-tree-dock-preview/fire-door-register-demo/app.html
          test -f apps/nexus-tree-dock-preview/electrical-commissioning/index.html

      - name: Commit preview and remove one-time workflow
        run: |
          rm .github/workflows/publish-nexus-tree-dock-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/nexus-tree-dock-preview nexus-tree-dock-preview.html .github/workflows/publish-nexus-tree-dock-preview.yml
          git commit -m "Publish isolated Nexus Relationship Tree dock preview"
          git push origin HEAD:main
