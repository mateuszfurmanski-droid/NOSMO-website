name: Refresh glossy Nexus assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-glossy-assets.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create unique non-cached assets
        shell: bash
        run: |
          set -euo pipefail
          base='apps/nexus-graph-preview'
          cp "$base/assets/index-C3TsMmtB.js" "$base/assets/nexus-glossy-20260806.js"
          cp "$base/assets/index-BXtaF8HQ.css" "$base/assets/nexus-glossy-20260806.css"
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('apps/nexus-graph-preview/index.html'),
              Path('apps/nexus-graph-preview/relationship-tree/index.html'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('/apps/nexus-graph-preview/assets/index-C3TsMmtB.js?build=glossy4', '/apps/nexus-graph-preview/assets/nexus-glossy-20260806.js')
              text = text.replace('/apps/nexus-graph-preview/assets/index-C3TsMmtB.js', '/apps/nexus-graph-preview/assets/nexus-glossy-20260806.js')
              text = text.replace('/apps/nexus-graph-preview/assets/index-BXtaF8HQ.css?build=glossy4', '/apps/nexus-graph-preview/assets/nexus-glossy-20260806.css')
              text = text.replace('/apps/nexus-graph-preview/assets/index-BXtaF8HQ.css', '/apps/nexus-graph-preview/assets/nexus-glossy-20260806.css')
              path.write_text(text, encoding='utf-8')
          PY
          touch .nojekyll
          test -s "$base/assets/nexus-glossy-20260806.js"
          grep -q 'nexus-glossy-20260806.js' "$base/relationship-tree/index.html"

      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/refresh-glossy-assets.yml
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Force fresh glossy Nexus assets'
          git push origin HEAD:main
