name: Render v47 Onboarding Copy Preview

on:
  push:
    branches:
      - codex/person-card-v47-work-ai-recruitment
    paths:
      - person-card-onboarding-v1.html
      - apps/nexus/person-onboarding-v47.js
      - .github/workflows/render-v47-copy-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.55.0 install chromium webkit --with-deps

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 8123 >/tmp/nosmo-v47-preview.log 2>&1 &
          echo $! > /tmp/nosmo-v47-preview.pid
          sleep 2
          curl --fail http://127.0.0.1:8123/person-card-onboarding-v1.html >/dev/null

      - name: Interaction smoke for v47 FULL
        shell: bash
        run: |
          cat > v47-full-smoke.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8123/person-card-v47-full-v1.html?preview=closed',{waitUntil:'networkidle'});
            const name=(await page.locator('.name').innerText()).replace(/\s+/g,' ').trim();
            if(!name.includes('Kamil')||!name.includes('Karaszewski')) throw new Error('FULL package no longer preserves Kamil donor identity');
            for(const label of ['My CV','Certs','Refs','Avail.','Vault','Registry','Tree','Data','Logo','Nexus','Find Work','Matches','Agencies','AI Check','Share']){
              if(await page.getByText(label,{exact:true}).count()===0) throw new Error('Missing action: '+label);
            }
            await page.getByText('Find Work',{exact:true}).click();
            if(!(await page.locator('.workOverlay').evaluate(el=>el.classList.contains('open')))) throw new Error('Find Work overlay did not open');
            if(!(await page.locator('.workPanel[data-panel="find"]').evaluate(el=>el.classList.contains('active')))) throw new Error('Find Work panel not active');
            await page.locator('#workClose').click();
            await page.locator('#openOnboarding').click();
            if(!(await page.locator('#onboardOverlay').evaluate(el=>el.classList.contains('open')))) throw new Error('Onboarding editor did not open');
            const first=await page.locator('#firstName').inputValue();
            const last=await page.locator('#lastName').inputValue();
            if(first!=='Kamil'||last!=='Karaszewski') throw new Error('FULL editor not prefilled from copied v47');
            await page.locator('#onboardClose').click();
            if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
            await browser.close();
            console.log('V47_FULL_INTERACTION_OK');
          })();
          EOF
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          node v47-full-smoke.cjs
          rm -f v47-full-smoke.cjs

      - name: Render mobile screenshots
        shell: bash
        run: |
          mkdir -p docs/previews
          npx --yes playwright@1.55.0 screenshot --browser chromium --device "iPhone 13" --full-page "http://127.0.0.1:8123/person-card-onboarding-v1.html?preview=closed&agency=NOSMO%20Work%20Profile" docs/previews/v47-copy-full.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --device "iPhone 13" "http://127.0.0.1:8123/person-card-onboarding-v1.html?agency=NOSMO%20Work%20Profile" docs/previews/v47-copy-onboarding.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --device "iPhone 13" --full-page "http://127.0.0.1:8123/person-card-v47-full-v1.html?preview=closed" docs/previews/v47-full-package.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --device "iPhone 13" "http://127.0.0.1:8123/person-card-v47-full-v1.html?preview=closed&previewWork=find" docs/previews/v47-full-find-work.png

      - name: Commit preview screenshots
        shell: bash
        run: |
          git status --short docs/previews || true
          if git diff --quiet -- docs/previews/v47-copy-full.png docs/previews/v47-copy-onboarding.png docs/previews/v47-full-package.png docs/previews/v47-full-find-work.png && git ls-files --error-unmatch docs/previews/v47-copy-full.png >/dev/null 2>&1 && git ls-files --error-unmatch docs/previews/v47-copy-onboarding.png >/dev/null 2>&1 && git ls-files --error-unmatch docs/previews/v47-full-package.png >/dev/null 2>&1 && git ls-files --error-unmatch docs/previews/v47-full-find-work.png >/dev/null 2>&1; then
            echo "Preview images unchanged"
            exit 0
          fi
          git config user.name "NOSMO Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/previews/v47-copy-full.png docs/previews/v47-copy-onboarding.png docs/previews/v47-full-package.png docs/previews/v47-full-find-work.png
          git commit -m "preview: render fixed v47 onboarding copy [skip ci]"
          git push
