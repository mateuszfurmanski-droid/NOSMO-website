name: Verify Relationship Tree Timeline Live
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-relationship-tree-timeline-live.yml
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify public timeline assets
        run: |
          set -e
          base='https://nosmotechnology.co.uk/apps/nexus-graph-preview/relationship-tree'
          for i in $(seq 1 12); do
            html="$(curl -fsSL "$base/?v=timeline-d9fe458" || true)"
            if echo "$html" | grep -q 'nexus-timeline-panel.js' && echo "$html" | grep -q 'nexus-timeline-panel.css'; then break; fi
            sleep 10
          done
          echo "$html" | grep -q 'nexus-timeline-panel.js'
          echo "$html" | grep -q 'nexus-timeline-panel.css'
          curl -fsSL "$base/nexus-timeline-panel.js?v=d9fe458" | grep -q 'NEXUS_TIMELINE_PANEL_V1'
          curl -fsSL "$base/nexus-timeline-panel.css?v=d9fe458" | grep -q 'NEXUS_TIMELINE_PANEL_V1'
          printf 'timeline_panel=HTTP_OK\nwiring_commit=d9fe458646491516707535ece4e2249545571d9b\n' > apps/nexus-graph-preview/relationship-tree/TIMELINE_LIVE_VERIFIED.txt
      - name: Save verification and cleanup
        run: |
          rm .github/workflows/verify-relationship-tree-timeline-live.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/nexus-graph-preview/relationship-tree/TIMELINE_LIVE_VERIFIED.txt .github/workflows/verify-relationship-tree-timeline-live.yml
          git commit -m "Verify Relationship Tree timeline panel live"
          git push origin HEAD:main