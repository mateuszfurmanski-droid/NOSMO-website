name: Publish compact Nexus folder preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-compact-folder-preview.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-cb38-81f4-bdad-027a8d843ad3/raw?se=2026-08-04T12:44:14Z&sp=r&sv=2026-02-06&sr=b&scid=f77d5e36-317e-5adf-9324-297033662043&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T08:35:12Z&ske=2026-08-05T08:35:12Z&sks=b&skv=2026-02-06&sig=OIRFbx%2BTUBbutWancnJMJhLjPqYR%2BxB3bYvwV3WEuSU%3D'

    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated preview
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-preview.zip
          rm -rf /tmp/nexus-preview
          mkdir -p /tmp/nexus-preview
          unzip -q /tmp/nexus-preview.zip -d /tmp/nexus-preview
          test -f /tmp/nexus-preview/index.html
          test -f /tmp/nexus-preview/relationship-tree/index.html
          test -f /tmp/nexus-preview/assets/index-gUNA07Od.js
          test -f /tmp/nexus-preview/assets/index-3aRpcU06.css

      - name: Replace public graph preview
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-preview/. apps/nexus-graph-preview/

      - name: Verify compact tile build
        run: |
          grep -Fq 'index-gUNA07Od.js' apps/nexus-graph-preview/relationship-tree/index.html
          grep -Fq 'index-3aRpcU06.css' apps/nexus-graph-preview/relationship-tree/index.html
          grep -Fq 'w-[112px]' apps/nexus-graph-preview/assets/index-gUNA07Od.js
          grep -Fq 'h-[72px]' apps/nexus-graph-preview/assets/index-gUNA07Od.js
          grep -Fq 'w-[86px]' apps/nexus-graph-preview/assets/index-gUNA07Od.js

      - name: Commit preview and remove workflow
        run: |
          rm .github/workflows/publish-compact-folder-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/nexus-graph-preview .github/workflows/publish-compact-folder-preview.yml
          git commit -m "Publish compact Nexus folder tiles"
          git push origin HEAD:main
