name: Wire Relationship Tree Timeline Panel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-relationship-tree-timeline-panel.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire panel assets
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/nexus-graph-preview/relationship-tree/index.html')
          text=path.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./nexus-timeline-panel.css" />'
          js='<script defer src="./nexus-timeline-panel.js"></script>'
          if css not in text:
              text=text.replace('<link rel="stylesheet" href="./nexus-shell-v2.css" />','<link rel="stylesheet" href="./nexus-shell-v2.css" />\n    '+css,1)
          if js not in text:
              text=text.replace('<script defer src="./nexus-shell-v2.js"></script>','<script defer src="./nexus-shell-v2.js"></script>\n    '+js,1)
          path.write_text(text,encoding='utf-8')
          PY
          node --check apps/nexus-graph-preview/relationship-tree/nexus-timeline-panel.js
          grep -q 'nexus-timeline-panel.css' apps/nexus-graph-preview/relationship-tree/index.html
          grep -q 'nexus-timeline-panel.js' apps/nexus-graph-preview/relationship-tree/index.html
      - name: Commit wiring and cleanup
        run: |
          rm .github/workflows/wire-relationship-tree-timeline-panel.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/nexus-graph-preview/relationship-tree/index.html .github/workflows/wire-relationship-tree-timeline-panel.yml
          git commit -m "Wire restored Relationship Tree timeline panel"
          git push origin HEAD:main