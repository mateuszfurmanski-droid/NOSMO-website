name: Publish blue Nexus dock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-blue-nexus-dock.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified graph preview
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-d830-820d-ac1a-6a55845abd76/raw?se=2026-08-06T15%3A09%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=4ca54f6a-6342-55d4-802b-3244a8e344ef&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T06%3A48%3A07Z&ske=2026-08-07T06%3A48%3A07Z&sks=b&skv=2026-02-06&sig=jrl0MR2hiafezC6Ri2812q%2BPXtUfUvHv8SchvlQ1HVY%3D' -o /tmp/nexus-preview.zip
          rm -rf /tmp/nexus-preview
          mkdir -p /tmp/nexus-preview
          unzip -q /tmp/nexus-preview.zip -d /tmp/nexus-preview

      - name: Replace existing public graph preview
        shell: bash
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-preview/. apps/nexus-graph-preview/
          test -f apps/nexus-graph-preview/relationship-tree/index.html
          test -d apps/nexus-graph-preview/assets

      - name: Commit and remove one-time publisher
        shell: bash
        run: |
          rm -f .github/workflows/publish-blue-nexus-dock.yml
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish blue Nexus dock and integration states'
          git push origin HEAD:main
