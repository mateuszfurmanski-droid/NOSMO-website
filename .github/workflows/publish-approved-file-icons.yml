name: Publish approved Nexus file icons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-approved-file-icons.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified graph preview
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ba14-81f4-80fb-e639b2f3292b/raw?se=2026-08-06T12%3A58%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=c3c21485-a062-52e7-925e-3a108a0e3814&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A54%3A28Z&ske=2026-08-07T05%3A54%3A28Z&sks=b&skv=2026-02-06&sig=5a4D6Rw91P3ag8mCiXZ0QcdsztmoVMNQvPFjGkWi79g%3D' -o /tmp/nexus-preview.zip
          rm -rf /tmp/nexus-preview
          mkdir -p /tmp/nexus-preview
          unzip -q /tmp/nexus-preview.zip -d /tmp/nexus-preview

      - name: Replace public graph preview
        shell: bash
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-preview/. apps/nexus-graph-preview/
          test -f apps/nexus-graph-preview/index.html
          test -f apps/nexus-graph-preview/relationship-tree/index.html
          test -f apps/nexus-graph-preview/assets/file-icons/approved-file-icons.webp

      - name: Commit public build and remove publisher
        shell: bash
        run: |
          rm -f .github/workflows/publish-approved-file-icons.yml
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish approved Nexus file icon assets'
          git push origin HEAD:main
