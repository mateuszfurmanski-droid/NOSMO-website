name: Publish Verified Nexus Graph

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-nexus-graph-artifact.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6e48-81f4-a5c8-10a3dc14209a/raw?se=2026-08-08T18%3A00%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=a0651189-29b3-58af-bbf2-97d15c13015c&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T09%3A15%3A18Z&ske=2026-08-09T09%3A15%3A18Z&sks=b&skv=2026-02-06&sig=zrtL2brBx3vth2LUvWGRl1nh8zKU0MAeAtT1r6v1yxM%3D'

    steps:
      - name: Checkout website main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated graph preview
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-graph-preview.zip
          rm -rf /tmp/nexus-graph-preview
          mkdir -p /tmp/nexus-graph-preview
          unzip -q /tmp/nexus-graph-preview.zip -d /tmp/nexus-graph-preview
          test -f /tmp/nexus-graph-preview/assets/index-CWI-Glgh.js
          test -f /tmp/nexus-graph-preview/assets/index-Dif5omj-.css
          grep -q 'index-CWI-Glgh.js' /tmp/nexus-graph-preview/relationship-tree/index.html

      - name: Publish bundle while preserving Project World bridge
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/nexus-graph-preview/assets/index-CWI-Glgh.js apps/nexus-graph-preview/assets/index-CWI-Glgh.js
          cp /tmp/nexus-graph-preview/assets/index-Dif5omj-.css apps/nexus-graph-preview/assets/index-Dif5omj-.css
          mkdir -p apps/nexus-graph-preview/assets/file-icons
          cp -a /tmp/nexus-graph-preview/assets/file-icons/. apps/nexus-graph-preview/assets/file-icons/
          printf '%s\n' '71daa215dd0dc15638ccaeb317ac88bdc8d7069d' > apps/nexus-graph-preview/DEPLOYED_COMMIT.txt
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['apps/nexus-graph-preview/index.html', 'apps/nexus-graph-preview/relationship-tree/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/apps/nexus-graph-preview/assets/index-[^"\']+\.js', '/apps/nexus-graph-preview/assets/index-CWI-Glgh.js', text)
              text = re.sub(r'/apps/nexus-graph-preview/assets/index-[^"\']+\.css', '/apps/nexus-graph-preview/assets/index-Dif5omj-.css', text)
              path.write_text(text, encoding='utf-8')
          bridge = Path('apps/nexus-graph-preview/relationship-tree/index.html').read_text(encoding='utf-8')
          for required in ['__NEXUS_PROJECT_WORLD__', 'hideEmbeddedChrome', 'nexus:project-time-change', 'index-CWI-Glgh.js']:
              if required not in bridge:
                  raise SystemExit(f'Missing preserved relationship-tree contract: {required}')
          PY
          grep -q '/apps/doorflow/' apps/nexus-graph-preview/assets/index-CWI-Glgh.js
          grep -q '/apps/fire-door-register/' apps/nexus-graph-preview/assets/index-CWI-Glgh.js
          grep -q '/apps/nexus/electrical-commissioning/' apps/nexus-graph-preview/assets/index-CWI-Glgh.js
          grep -q 'Work Wallet' apps/nexus-graph-preview/assets/index-CWI-Glgh.js
          git diff --check

      - name: Commit published bundle and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/deploy-nexus-graph-artifact.yml
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/nexus-graph-preview/assets/index-CWI-Glgh.js apps/nexus-graph-preview/assets/index-Dif5omj-.css apps/nexus-graph-preview/assets/file-icons apps/nexus-graph-preview/index.html apps/nexus-graph-preview/relationship-tree/index.html apps/nexus-graph-preview/DEPLOYED_COMMIT.txt .github/workflows/deploy-nexus-graph-artifact.yml
          git commit -m 'Publish verified Nexus graph 71daa21'
          git push origin HEAD:main
