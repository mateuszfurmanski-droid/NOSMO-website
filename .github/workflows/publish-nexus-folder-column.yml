name: Publish Nexus folder column

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-nexus-folder-column.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b6f8-820a-9c7d-6a250dce7d74/raw?se=2026-08-04T10:54:24Z&sp=r&sv=2026-02-06&sr=b&scid=10189177-f102-5223-a273-f76fa0023294&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T06:20:35Z&ske=2026-08-05T06:20:35Z&sks=b&skv=2026-02-06&sig=TqLDL2FIPbyV/Yn6hCGLJDS7BTcT/1kNdzpwqJ6PFPs%3D'

    steps:
      - name: Checkout website main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated graph preview
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-folder-column.zip
          rm -rf /tmp/nexus-folder-column
          mkdir -p /tmp/nexus-folder-column
          unzip -q /tmp/nexus-folder-column.zip -d /tmp/nexus-folder-column
          test -f /tmp/nexus-folder-column/index.html
          test -f /tmp/nexus-folder-column/relationship-tree/index.html
          grep -q '/apps/nexus-graph-preview/assets/' /tmp/nexus-folder-column/index.html

      - name: Replace public graph preview
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-folder-column/. apps/nexus-graph-preview/

      - name: Commit preview and remove one-time workflow
        run: |
          rm .github/workflows/publish-nexus-folder-column.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/nexus-graph-preview .github/workflows/publish-nexus-folder-column.yml
          git commit -m "Stack Nexus folder items in one column"
          git push origin HEAD:main
