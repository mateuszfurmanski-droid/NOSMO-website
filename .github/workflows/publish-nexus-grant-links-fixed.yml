name: Publish Nexus Grant Preview Link Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-nexus-grant-links-fixed.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a0a8-81f4-94be-7c89388bd576/raw?se=2026-08-04T07:45:04Z&sp=r&sv=2026-02-06&sr=b&scid=941e9cec-46c0-5324-9e51-4dbf3c3dac90&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T05:56:35Z&ske=2026-08-05T05:56:35Z&sks=b&skv=2026-02-06&sig=F3reK%2BtZhlrGX5yTdtzDiw6G3s8W7P64wJDg3XQRxdQ%3D'
      JS_FILE: index-D1luFVE1.js
      CSS_FILE: index-Zq406dZZ.css
      PUBLIC_BASE: /apps/nexus-grant-preview/

    steps:
      - name: Check out public website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated Nexus artifact
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-grant.zip
          rm -rf /tmp/nexus-grant-build
          mkdir -p /tmp/nexus-grant-build
          unzip -q /tmp/nexus-grant.zip -d /tmp/nexus-grant-build
          test -f "/tmp/nexus-grant-build/assets/$JS_FILE"
          test -f "/tmp/nexus-grant-build/assets/$CSS_FILE"

      - name: Configure isolated public base
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path('/tmp/nexus-grant-build')
          public_base = os.environ['PUBLIC_BASE']
          js_name = os.environ['JS_FILE']
          css_name = os.environ['CSS_FILE']

          index = root / 'index.html'
          html = index.read_text()
          replacements = {
              'href="/favicon.svg"': f'href="{public_base}favicon.svg"',
              f'src="/assets/{js_name}"': f'src="{public_base}assets/{js_name}"',
              f'href="/assets/{css_name}"': f'href="{public_base}assets/{css_name}"',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Missing index marker: {old}')
              html = html.replace(old, new, 1)
          index.write_text(html)

          js_path = root / 'assets' / js_name
          js = js_path.read_text()
          js_replacements = {
              'const Aj="/"': f'const Aj="{public_base}"',
              'const Gu="/"': f'const Gu="{public_base}"',
              'const Rp="/"': f'const Rp="{public_base}"',
              'a="/".replace(/\\/$/,"")': f'a="{public_base}".replace(/\\/$/,"")',
              'base:"/".replace(/\\/$/,"")': f'base:"{public_base}".replace(/\\/$/,"")',
          }
          for old, new in js_replacements.items():
              if old not in js:
                  raise SystemExit(f'Missing JS base marker: {old}')
              js = js.replace(old, new, 1)
          js_path.write_text(js)
          PY

      - name: Replace isolated Grant Preview
        run: |
          rm -rf apps/nexus-grant-preview
          mkdir -p apps/nexus-grant-preview
          cp -a /tmp/nexus-grant-build/. apps/nexus-grant-preview/
          cat > nexus-grant-preview.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#050913">
          <title>NOSMO Nexus Grant Demo</title>
          <meta http-equiv="refresh" content="0; url=/apps/nexus-grant-preview/?route=grant-demo">
          <script>window.location.replace('/apps/nexus-grant-preview/?route=grant-demo&v=links3'+window.location.hash);</script>
          </head>
          <body>Opening NOSMO Nexus Grant Demo…</body>
          </html>
          HTML

      - name: Verify every Grant Demo destination
        run: |
          node --check "apps/nexus-grant-preview/assets/$JS_FILE"
          grep -Fq 'const Gu="/apps/nexus-grant-preview/"' "apps/nexus-grant-preview/assets/$JS_FILE"
          grep -Fq '?route=' "apps/nexus-grant-preview/assets/$JS_FILE"
          grep -Fq 'path:"first-run"' "apps/nexus-grant-preview/assets/$JS_FILE"
          grep -Fq 'path:"relationship-tree"' "apps/nexus-grant-preview/assets/$JS_FILE"
          grep -Fq 'path:"person-card-demo"' "apps/nexus-grant-preview/assets/$JS_FILE"
          test -f apps/nexus-grant-preview/fire-door-register-demo/index.html
          test -f apps/nexus-grant-preview/fire-door-register-demo/app.html
          test -f apps/nexus-grant-preview/doorflow-demo/index.html
          test -f apps/nexus-grant-preview/electrical-commissioning/index.html

      - name: Commit preview and remove one-time workflow
        run: |
          rm .github/workflows/publish-nexus-grant-links-fixed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/nexus-grant-preview nexus-grant-preview.html .github/workflows/publish-nexus-grant-links-fixed.yml
          git commit -m "Fix all Nexus grant preview module links"
          git push origin HEAD:main
