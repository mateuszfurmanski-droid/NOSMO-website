name: Nexus e-SAFE Demo CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/nexus-esafe-demo/**'
      - 'apps/nexus-graph-preview/relationship-tree/index.html'
      - '.github/workflows/nexus-esafe-demo-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript
        run: |
          node --check apps/nexus-esafe-demo/data.js
          node --check apps/nexus-esafe-demo/app.js
          node --check apps/nexus-esafe-demo/world.js
          node --check apps/nexus-esafe-demo/world-sync.js
      - name: Validate demo dataset and Project World contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const code=fs.readFileSync('apps/nexus-esafe-demo/data.js','utf8');
          const sandbox={window:{}};
          vm.createContext(sandbox);
          vm.runInContext(code,sandbox);
          const records=sandbox.window.ESAFE_RECORDS;
          if(!Array.isArray(records)||records.length!==95) throw new Error(`Expected 95 records, got ${records?.length}`);
          const core=records.filter(r=>r.core);
          if(core.length<5) throw new Error(`Expected core real-pilot records, got ${core.length}`);
          const world=JSON.parse(fs.readFileSync('apps/nexus-esafe-demo/project-world.json','utf8'));
          if(world.id!=='esafe-catania-demo') throw new Error('Unexpected Project World id');
          if(world.source?.records!==95||world.source?.files!==106) throw new Error('Project World source inventory mismatch');
          if(world.projectGraph?.storeys!==5||world.projectGraph?.apartments!==10) throw new Error('Real pilot building graph contract missing');
          if(world.status!=='DEMO_V1_STATE_RECONSTRUCTION') throw new Error('State reconstruction status missing');
          if(!world.simulation?.playbackSpeeds?.includes(100)) throw new Error('Playback speed contract missing');
          const html=fs.readFileSync('apps/nexus-esafe-demo/index.html','utf8');
          for(const required of ['data.js','app.js','world.js','world-sync.js','world.css','projectWorldLayer','sourceLibrary','projectPanel','nexus-graph-preview/relationship-tree']) if(!html.includes(required)) throw new Error(`Missing ${required}`);
          const worldJs=fs.readFileSync('apps/nexus-esafe-demo/world.js','utf8');
          for(const required of ['e-SAFE Catania','Via Acquicella Porto 27/H','xs=[18,34,50,66,82]','openSources','95']) if(!worldJs.includes(required)) throw new Error(`Project graph missing ${required}`);
          const sync=fs.readFileSync('apps/nexus-esafe-demo/world-sync.js','utf8');
          if(!sync.includes('requestAnimationFrame')||!sync.includes('ESAFE_WORLD.update')) throw new Error('Timeline/world synchronization missing');
          const app=fs.readFileSync('apps/nexus-esafe-demo/app.js','utf8');
          if(app.includes("window.location.href='/apps/nexus-graph-preview/relationship-tree/'")) throw new Error('NEXUS tile must not navigate out of Project World');
          const tree=fs.readFileSync('apps/nexus-graph-preview/relationship-tree/index.html','utf8');
          for(const required of ['__NEXUS_PROJECT_WORLD__','NEXUS_PROJECT_TIME_CHANGE','nexus:project-time-change','hideEmbeddedChrome']) if(!tree.includes(required)) throw new Error(`Relationship Tree embedded contract missing ${required}`);
          console.log(`records=${records.length} core=${core.length} world=${world.id} status=${world.status}`);
          NODE
