name: Publish Nexus icon size fix

# Trigger registered one-time publisher.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-icon-size-fix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified graph preview
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-080c-8243-8dc0-c5431ac11ac1/raw?se=2026-08-06T14%3A57%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=5801053f-c7d5-5998-84a3-9fdd0d48f245&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T09%3A17%3A55Z&ske=2026-08-07T09%3A17%3A55Z&sks=b&skv=2026-02-06&sig=JhCKJvhui9BoqaDCl0xnohfXwMT5rGhBLWiJXs7rLek%3D' -o /tmp/nexus-preview.zip
          rm -rf /tmp/nexus-preview
          mkdir -p /tmp/nexus-preview
          unzip -q /tmp/nexus-preview.zip -d /tmp/nexus-preview

      - name: Replace existing public graph preview only
        shell: bash
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-preview/. apps/nexus-graph-preview/
          test -f apps/nexus-graph-preview/relationship-tree/index.html
          test -f apps/nexus-graph-preview/assets/file-icons/pdf.webp
          test -f apps/nexus-graph-preview/assets/file-icons/xlsx.webp

      - name: Commit and remove one-time publisher
        shell: bash
        run: |
          rm -f .github/workflows/publish-icon-size-fix.yml
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish full-size Nexus document icons'
          git push origin HEAD:main
