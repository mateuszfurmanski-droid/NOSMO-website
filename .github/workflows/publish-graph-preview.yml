name: Publish Graph Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website main
        uses: actions/checkout@v4
        with:
          ref: main
          path: website

      - name: Download verified graph preview artifact
        env:
          ARTIFACT_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-0264-8246-8281-37fb1e5ba74a/raw?se=2026-08-02T23:54:15Z&sp=r&sv=2026-02-06&sr=b&scid=2afbebd2-ddbf-5c80-b47e-283ce9c8eaa0&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T21:52:55Z&ske=2026-08-03T21:52:55Z&sks=b&skv=2026-02-06&sig=AvpiAAlu0LAVq3WYDu8AGyOST7d46wm5AADfXRLc8ng%3D"
        run: |
          curl --fail --location "$ARTIFACT_URL" --output graph-preview.zip
          rm -rf website/apps/nexus-graph-preview
          mkdir -p website/apps/nexus-graph-preview
          unzip -q graph-preview.zip -d website/apps/nexus-graph-preview
          test -f website/apps/nexus-graph-preview/relationship-tree/index.html
          grep -q '/apps/nexus-graph-preview/assets/' website/apps/nexus-graph-preview/index.html

      - name: Commit graph preview to website main
        working-directory: website
        run: |
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/nexus-graph-preview
          if git diff --cached --quiet; then
            echo "No preview changes detected."
            exit 0
          fi
          git commit -m "Publish persistent Nexus graph preview"
          git push origin HEAD:main
