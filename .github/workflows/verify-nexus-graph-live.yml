name: Verify Nexus Graph Live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-nexus-graph-live.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout website main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for public hosting and verify
        shell: bash
        run: |
          set -euo pipefail
          TREE='https://nosmotechnology.co.uk/apps/nexus-graph-preview/relationship-tree/?v=71daa21'
          JS='https://nosmotechnology.co.uk/apps/nexus-graph-preview/assets/index-CWI-Glgh.js?v=71daa21'
          DOORFLOW='https://nosmotechnology.co.uk/apps/doorflow/'
          FIRE='https://nosmotechnology.co.uk/apps/fire-door-register/'
          ELECTRICAL='https://nosmotechnology.co.uk/apps/nexus/electrical-commissioning/'

          ready=0
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 20 "$TREE" -o /tmp/tree.html \
              && grep -q 'index-CWI-Glgh.js' /tmp/tree.html \
              && grep -q '__NEXUS_PROJECT_WORLD__' /tmp/tree.html; then
              ready=1
              break
            fi
            echo "Hosting not ready yet: attempt $attempt/36"
            sleep 10
          done
          test "$ready" = 1

          curl --fail --silent --show-error --location --max-time 30 "$JS" -o /tmp/nexus.js
          grep -q '/apps/doorflow/' /tmp/nexus.js
          grep -q '/apps/fire-door-register/' /tmp/nexus.js
          grep -q '/apps/nexus/electrical-commissioning/' /tmp/nexus.js

          curl --fail --silent --show-error --location --max-time 30 "$DOORFLOW" -o /tmp/doorflow.html
          curl --fail --silent --show-error --location --max-time 30 "$FIRE" -o /tmp/fire.html
          curl --fail --silent --show-error --location --max-time 30 "$ELECTRICAL" -o /tmp/electrical.html
          test -s /tmp/doorflow.html
          test -s /tmp/fire.html
          test -s /tmp/electrical.html

          {
            echo 'source_commit=71daa215dd0dc15638ccaeb317ac88bdc8d7069d'
            echo 'public_bundle=index-CWI-Glgh.js'
            echo 'project_world_bridge=verified'
            echo 'doorflow=HTTP_OK'
            echo 'fire_register=HTTP_OK'
            echo 'electrical=HTTP_OK'
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > apps/nexus-graph-preview/LIVE_VERIFIED.txt

      - name: Save verification and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-nexus-graph-live.yml
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/nexus-graph-preview/LIVE_VERIFIED.txt .github/workflows/verify-nexus-graph-live.yml
          git commit -m 'Verify Nexus graph live 71daa21'
          git push origin HEAD:main
