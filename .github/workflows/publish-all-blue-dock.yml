name: Publish all-blue Nexus dock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-all-blue-dock.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified graph preview
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-cc80-8246-86a4-f5e20055bf51/raw?se=2026-08-06T15%3A20%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=10371450-54a2-5b2c-9920-b86e05633930&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T08%3A39%3A08Z&ske=2026-08-07T08%3A39%3A08Z&sks=b&skv=2026-02-06&sig=UwOsIcGu/9nI%2B7m6P/uCyFZYxoJnHSdxcdJms3/7/H0%3D' -o /tmp/nexus-preview.zip
          rm -rf /tmp/nexus-preview
          mkdir -p /tmp/nexus-preview
          unzip -q /tmp/nexus-preview.zip -d /tmp/nexus-preview

      - name: Replace existing public graph preview
        shell: bash
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-preview/. apps/nexus-graph-preview/
          test -f apps/nexus-graph-preview/relationship-tree/index.html

      - name: Commit and remove publisher
        shell: bash
        run: |
          rm -f .github/workflows/publish-all-blue-dock.yml
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish all-blue Nexus dock tiles'
          git push origin HEAD:main
