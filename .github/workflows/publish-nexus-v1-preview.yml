name: Publish Nexus v1 Preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-nexus-v1-preview.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-f854-8246-ac26-a04cc71a09f3/raw?se=2026-08-02T21:54:43Z&sp=r&sv=2026-02-06&sr=b&scid=d2ec7b1a-92b1-5f2c-93a7-d2aea70fdfe3&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T05:12:41Z&ske=2026-08-03T05:12:41Z&sks=b&skv=2026-02-06&sig=cRXKeV/ka8uP8WFFDzcRWWi5kzun32L0hvGaojrwaMw%3D'
      PUBLIC_BASE: /apps/nexus-v1-preview/
    steps:
      - name: Check out public website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated Nexus build
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-v1.zip
          rm -rf /tmp/nexus-v1
          mkdir -p /tmp/nexus-v1
          unzip -q /tmp/nexus-v1.zip -d /tmp/nexus-v1
          test -f /tmp/nexus-v1/index.html
          test -f /tmp/nexus-v1/assets/index-Bi3f56l1.js
          test -f /tmp/nexus-v1/assets/index-CMYbh2KR.css

      - name: Prepare preview base path
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/nexus-v1')
          base = '/apps/nexus-v1-preview/'
          index = root / 'index.html'
          html = index.read_text()
          html = html.replace('href="/favicon.svg"', f'href="{base}favicon.svg"')
          html = html.replace('src="/assets/index-Bi3f56l1.js"', f'src="{base}assets/index-Bi3f56l1.js"')
          html = html.replace('href="/assets/index-CMYbh2KR.css"', f'href="{base}assets/index-CMYbh2KR.css"')
          restore = '''    <script>\n      (() => {\n        const params = new URLSearchParams(window.location.search);\n        const route = params.get("route");\n        const safe = route && /^[a-z0-9/_-]+$/i.test(route) ? route.replace(/^\\/+|\\/+$/g, "") : "";\n        if (safe) window.history.replaceState(null, "", `/apps/nexus-v1-preview/${safe}${window.location.hash || ""}`);\n      })();\n    </script>\n'''
          marker = f'    <script type="module" crossorigin src="{base}assets/index-Bi3f56l1.js"></script>'
          if marker not in html:
              raise SystemExit('Preview asset marker not found')
          html = html.replace(marker, restore + marker, 1)
          index.write_text(html)

          js_path = root / 'assets/index-Bi3f56l1.js'
          js = js_path.read_text()
          js = js.replace('const gp="/",JV=[', 'const gp="/apps/nexus-v1-preview/",JV=[', 1)
          js = js.replace('s.jsx($w,{base:"/".replace(/\\/$/,""),children:', 's.jsx($w,{base:"/apps/nexus-v1-preview/".replace(/\\/$/,""),children:', 1)
          if 'const gp="/apps/nexus-v1-preview/",JV=[' not in js:
              raise SystemExit('Static tool base was not patched')
          if 'base:"/apps/nexus-v1-preview/".replace' not in js:
              raise SystemExit('Router base was not patched')
          js_path.write_text(js)
          PY

      - name: Replace preview package
        run: |
          rm -rf apps/nexus-v1-preview
          mkdir -p apps/nexus-v1-preview
          cp -a /tmp/nexus-v1/. apps/nexus-v1-preview/
          cat > nexus-v1-preview.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#05070b">
          <title>NOSMO Nexus v1 Preview</title>
          <meta http-equiv="refresh" content="0; url=/apps/nexus-v1-preview/">
          <link rel="canonical" href="https://nosmotechnology.co.uk/apps/nexus-v1-preview/">
          <script>window.location.replace('/apps/nexus-v1-preview/'+window.location.search+window.location.hash);</script>
          </head>
          <body>Opening NOSMO Nexus v1 Preview…</body>
          </html>
          HTML

      - name: Verify preview package
        run: |
          node --check apps/nexus-v1-preview/assets/index-Bi3f56l1.js
          grep -q '/apps/nexus-v1-preview/assets/index-Bi3f56l1.js' apps/nexus-v1-preview/index.html
          grep -q 'base:"/apps/nexus-v1-preview/".replace' apps/nexus-v1-preview/assets/index-Bi3f56l1.js
          grep -q 'Everything happening on site, in one place' apps/nexus-v1-preview/assets/index-Bi3f56l1.js
          grep -q 'Overview' apps/nexus-v1-preview/assets/index-Bi3f56l1.js
          test -f apps/nexus-v1-preview/doorflow-demo/index.html
          test -f apps/nexus-v1-preview/fire-door-register-demo/app.html
          test -f apps/nexus-v1-preview/electrical-commissioning/index.html

      - name: Commit preview and remove one-time workflow
        run: |
          rm .github/workflows/publish-nexus-v1-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/nexus-v1-preview nexus-v1-preview.html .github/workflows/publish-nexus-v1-preview.yml
          git commit -m "Publish Nexus v1 project shell preview"
          git push origin HEAD:main
