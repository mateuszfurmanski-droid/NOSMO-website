name: Publish Radial Timeline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-radial-timeline.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-1104-81f4-8177-83aac20bc595/raw?se=2026-08-08T15%3A53%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=6bb15d3a-ebd0-5677-b39e-bd77f80b09ef&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T10%3A21%3A46Z&ske=2026-08-09T10%3A21%3A46Z&sks=b&skv=2026-02-06&sig=oysQWchYW11sQeBHm6I62JJb1DxKzpLCbmP1Lb%2B9dkU%3D'

    steps:
      - name: Checkout website main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated graph preview
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-graph-preview.zip
          rm -rf /tmp/nexus-graph-preview
          mkdir -p /tmp/nexus-graph-preview
          unzip -q /tmp/nexus-graph-preview.zip -d /tmp/nexus-graph-preview
          test -f /tmp/nexus-graph-preview/index.html
          test -f /tmp/nexus-graph-preview/relationship-tree/index.html
          grep -q 'index-CG6GP8Yp.js' /tmp/nexus-graph-preview/relationship-tree/index.html

      - name: Replace public graph preview
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-graph-preview/. apps/nexus-graph-preview/

      - name: Commit preview and remove one-time workflow
        run: |
          rm .github/workflows/publish-radial-timeline.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A apps/nexus-graph-preview .github/workflows/publish-radial-timeline.yml
          git commit -m "Publish Nexus radial document timeline"
          git push origin HEAD:main
