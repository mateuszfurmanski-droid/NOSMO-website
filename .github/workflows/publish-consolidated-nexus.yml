name: Publish Consolidated Nexus

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-consolidated-nexus.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-e6a8-820c-ad51-b32e7973ad88/raw?se=2026-08-02T06:46:35Z&sp=r&sv=2026-02-06&sr=b&scid=cfa56ba6-16e6-554b-8938-399bf0fb4a72&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T04:02:17Z&ske=2026-08-03T04:02:17Z&sks=b&skv=2026-02-06&sig=cEdGkRsXi8CH9z2nf2ulCk4DGO3BpG50vGEwOi6KFiE%3D'
    steps:
      - name: Check out public website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated Nexus artifact
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus.zip
          rm -rf /tmp/nexus-build
          mkdir -p /tmp/nexus-build
          unzip -q /tmp/nexus.zip -d /tmp/nexus-build
          test -f /tmp/nexus-build/index.html
          test -f /tmp/nexus-build/assets/index-DH2R42fj.js
          test -f /tmp/nexus-build/assets/index-BdsMYLHY.css

      - name: Prepare public base path
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/nexus-build')
          index = root / 'index.html'
          html = index.read_text()
          html = html.replace('href="/favicon.svg"', 'href="/apps/nexus/favicon.svg"')
          html = html.replace('src="/assets/index-DH2R42fj.js"', 'src="/apps/nexus/assets/index-DH2R42fj.js"')
          html = html.replace('href="/assets/index-BdsMYLHY.css"', 'href="/apps/nexus/assets/index-BdsMYLHY.css"')
          restore = '''    <script>\n      (() => {\n        const params = new URLSearchParams(window.location.search);\n        const restoredRoute = params.get("route");\n        const safeRoute = restoredRoute && /^[a-z0-9/_-]+$/i.test(restoredRoute)\n          ? restoredRoute.replace(/^\\/+|\\/+$/g, "")\n          : "";\n        if (safeRoute) {\n          window.history.replaceState(null, "", `/apps/nexus/${safeRoute}${window.location.hash || ""}`);\n        }\n      })();\n    </script>\n'''
          marker = '    <script type="module" crossorigin src="/apps/nexus/assets/index-DH2R42fj.js"></script>'
          if marker not in html:
              raise SystemExit('Public asset marker not found')
          html = html.replace(marker, restore + marker, 1)
          index.write_text(html)

          js_path = root / 'assets/index-DH2R42fj.js'
          js = js_path.read_text()
          js = js.replace('const kw="/",az=[', 'const kw="/apps/nexus/",az=[', 1)
          js = js.replace('s.jsx(Jw,{base:"/".replace(/\\/$/,""),children:', 's.jsx(Jw,{base:"/apps/nexus/".replace(/\\/$/,""),children:', 1)
          if 'const kw="/apps/nexus/",az=[' not in js:
              raise SystemExit('Static application base was not patched')
          if 'base:"/apps/nexus/".replace' not in js:
              raise SystemExit('Router base was not patched')
          js_path.write_text(js)
          PY

      - name: Replace public Nexus build
        run: |
          rm -rf apps/nexus
          mkdir -p apps/nexus
          cp -a /tmp/nexus-build/. apps/nexus/
          cat > nexus-preview.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#05070b">
          <title>NOSMO Nexus</title>
          <meta http-equiv="refresh" content="0; url=/apps/nexus/">
          <link rel="canonical" href="https://nosmotechnology.co.uk/apps/nexus/">
          <script>window.location.replace('/apps/nexus/'+window.location.search+window.location.hash);</script>
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070b;color:#f4f8fb;font-family:Arial,sans-serif}a{color:#43d9ff}</style>
          </head>
          <body>Opening <a href="/apps/nexus/">NOSMO Nexus</a>…</body>
          </html>
          HTML

      - name: Verify published package
        run: |
          node --check apps/nexus/assets/index-DH2R42fj.js
          grep -q '/apps/nexus/assets/index-DH2R42fj.js' apps/nexus/index.html
          grep -q 'base:"/apps/nexus/".replace' apps/nexus/assets/index-DH2R42fj.js
          grep -q 'path:"/first-run"' apps/nexus/assets/index-DH2R42fj.js
          test -f apps/nexus/doorflow-demo/index.html
          test -f apps/nexus/fire-door-register-demo/app.html
          test -f apps/nexus/electrical-commissioning/index.html

      - name: Commit public deployment and remove one-time workflow
        run: |
          rm .github/workflows/publish-consolidated-nexus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/nexus nexus-preview.html .github/workflows/publish-consolidated-nexus.yml
          git commit -m "Publish consolidated Nexus build to public website"
          git push origin HEAD:main
