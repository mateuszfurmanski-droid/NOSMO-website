name: Publish Nexus tiles only

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-nexus-tiles-only.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5608-81f4-a11e-84711493d3f3/raw?se=2026-08-04T12:55:14Z&sp=r&sv=2026-02-06&sr=b&scid=5427c79b-5d0f-5a52-a944-2cafe346b219&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T06:43:10Z&ske=2026-08-05T06:43:10Z&sks=b&skv=2026-02-06&sig=Bo4p1wXRTqxYU1uOKeUgBcgF%2Bt7hYEK9f/hHEKDAhSg%3D'
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Download Nexus preview build
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-preview.zip
          rm -rf /tmp/nexus-preview
          mkdir -p /tmp/nexus-preview
          unzip -q /tmp/nexus-preview.zip -d /tmp/nexus-preview

      - name: Replace public preview
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-preview/. apps/nexus-graph-preview/

      - name: Commit published build
        run: |
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/nexus-graph-preview
          if git diff --cached --quiet; then
            echo "Preview already current."
            exit 0
          fi
          git commit -m "Publish Nexus tile-only folder dock"
          git push origin HEAD:main
