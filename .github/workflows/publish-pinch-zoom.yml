name: Publish Nexus pinch zoom

# Trigger registered workflow after creation.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pinch-zoom.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified graph preview
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ed04-81f4-94a3-d4d42ed51d1f/raw?se=2026-08-06T15%3A38%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=ad479a40-21d2-5a2e-9bb9-c495c11e2ee2&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A39%3A43Z&ske=2026-08-07T05%3A39%3A43Z&sks=b&skv=2026-02-06&sig=pKf0lmrmsaVmKE8Spp86NJLX3Dwtufc00qBvoY9oOZQ%3D' -o /tmp/nexus-preview.zip
          rm -rf /tmp/nexus-preview
          mkdir -p /tmp/nexus-preview
          unzip -q /tmp/nexus-preview.zip -d /tmp/nexus-preview

      - name: Replace existing public graph preview
        shell: bash
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-preview/. apps/nexus-graph-preview/
          test -f apps/nexus-graph-preview/relationship-tree/index.html
          test -d apps/nexus-graph-preview/assets

      - name: Commit and remove publisher
        shell: bash
        run: |
          rm -f .github/workflows/publish-pinch-zoom.yml
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish two-finger pinch zoom for Nexus graph'
          git push origin HEAD:main
