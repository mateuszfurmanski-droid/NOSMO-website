name: Wire Nexus Project Switcher
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-nexus-project-switcher.yml
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire project switcher assets
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/nexus-graph-preview/relationship-tree/index.html')
          text=path.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./nexus-project-switcher.css" />'
          js='<script defer src="./nexus-project-switcher.js"></script>'
          if css not in text:
              text=text.replace('<link rel="stylesheet" href="./nexus-timeline-panel.css" />','<link rel="stylesheet" href="./nexus-timeline-panel.css" />\n    '+css,1)
          if js not in text:
              text=text.replace('<script defer src="./nexus-timeline-panel.js"></script>','<script defer src="./nexus-timeline-panel.js"></script>\n    '+js,1)
          path.write_text(text,encoding='utf-8')
          PY
          node --check apps/nexus-graph-preview/relationship-tree/nexus-project-switcher.js
          grep -q 'nexus-project-switcher.css' apps/nexus-graph-preview/relationship-tree/index.html
          grep -q 'nexus-project-switcher.js' apps/nexus-graph-preview/relationship-tree/index.html
      - name: Commit wiring and cleanup
        run: |
          rm .github/workflows/wire-nexus-project-switcher.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/nexus-graph-preview/relationship-tree/index.html .github/workflows/wire-nexus-project-switcher.yml
          git commit -m "Wire Nexus active project switcher"
          git push origin HEAD:main