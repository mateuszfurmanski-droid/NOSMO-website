name: Publish Project-Centred Timeline
# second push triggers this already-present one-time publisher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-project-centred-timeline.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-4d74-8211-9bcc-d567d2e6ded2/raw?se=2026-08-08T17%3A47%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=95662b43-081c-52fd-a4be-df525e0c27b0&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T05%3A34%3A26Z&ske=2026-08-09T05%3A34%3A26Z&sks=b&skv=2026-02-06&sig=N86nYoOQt1B%2Bd40KaMB5XaTqO0h3xpDOvkSaiYxnsmo%3D'

    steps:
      - name: Checkout website main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated graph preview
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-graph-preview.zip
          rm -rf /tmp/nexus-graph-preview
          mkdir -p /tmp/nexus-graph-preview
          unzip -q /tmp/nexus-graph-preview.zip -d /tmp/nexus-graph-preview
          test -f /tmp/nexus-graph-preview/assets/index-YWKOWJ-1.js
          test -f /tmp/nexus-graph-preview/assets/index-Dif5omj-.css
          grep -q 'index-YWKOWJ-1.js' /tmp/nexus-graph-preview/relationship-tree/index.html

      - name: Publish bundle while preserving Project World bridge
        shell: bash
        run: |
          cp /tmp/nexus-graph-preview/assets/index-YWKOWJ-1.js apps/nexus-graph-preview/assets/index-YWKOWJ-1.js
          cp /tmp/nexus-graph-preview/assets/index-Dif5omj-.css apps/nexus-graph-preview/assets/index-Dif5omj-.css
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['apps/nexus-graph-preview/index.html', 'apps/nexus-graph-preview/relationship-tree/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/apps/nexus-graph-preview/assets/index-[^"\']+\.js', '/apps/nexus-graph-preview/assets/index-YWKOWJ-1.js', text)
              text = re.sub(r'/apps/nexus-graph-preview/assets/index-[^"\']+\.css', '/apps/nexus-graph-preview/assets/index-Dif5omj-.css', text)
              path.write_text(text, encoding='utf-8')
          bridge = Path('apps/nexus-graph-preview/relationship-tree/index.html').read_text(encoding='utf-8')
          for required in ['__NEXUS_PROJECT_WORLD__', 'hideEmbeddedChrome', 'nexus:project-time-change', 'index-YWKOWJ-1.js']:
              if required not in bridge:
                  raise SystemExit(f'Missing preserved relationship-tree contract: {required}')
          PY

      - name: Commit published bundle and remove one-time workflow
        run: |
          rm .github/workflows/publish-project-centred-timeline.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/nexus-graph-preview/assets/index-YWKOWJ-1.js apps/nexus-graph-preview/assets/index-Dif5omj-.css apps/nexus-graph-preview/index.html apps/nexus-graph-preview/relationship-tree/index.html .github/workflows/publish-project-centred-timeline.yml
          git commit -m "Publish project-centred animated Nexus timeline"
          git push origin HEAD:main
