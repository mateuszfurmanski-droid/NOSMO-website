name: Publish Nexus NOSMO colours

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-nexus-nosmo-colours.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-4cec-8243-8c2e-a204e38a2647/raw?se=2026-08-04T13:28:10Z&sp=r&sv=2026-02-06&sr=b&scid=d2c14aeb-06d7-5041-b0da-4fe9aaff586f&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T06:58:44Z&ske=2026-08-05T06:58:44Z&sks=b&skv=2026-02-06&sig=TFJB9OnrduWLBQ2vJeYxEyX5YgIdPb/Ls/jG5y02pAs%3D'
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Download Nexus preview build
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/nexus-preview.zip
          rm -rf /tmp/nexus-preview
          mkdir -p /tmp/nexus-preview
          unzip -q /tmp/nexus-preview.zip -d /tmp/nexus-preview

      - name: Replace public preview
        run: |
          rm -rf apps/nexus-graph-preview
          mkdir -p apps/nexus-graph-preview
          cp -a /tmp/nexus-preview/. apps/nexus-graph-preview/

      - name: Commit published build
        run: |
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/nexus-graph-preview
          if git diff --cached --quiet; then
            echo "Preview already current."
            exit 0
          fi
          git commit -m "Publish NOSMO base colours for Nexus graph"
          git push origin HEAD:main
