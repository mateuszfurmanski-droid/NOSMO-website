<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020713">
<title>NOSMO Nexus — Person Cards</title>
<style>
:root{--bg:#020713;--panel:#071421;--card:#09192a;--line:rgba(108,160,228,.24);--line2:rgba(54,163,255,.38);--blue:#3a8bff;--blue2:#86bdff;--text:#f5f8ff;--muted:#aeb9ca;--green:#25d77f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}body{background:radial-gradient(circle at 50% -140px,rgba(58,139,255,.18),transparent 340px),linear-gradient(180deg,#020713,#02060d)}a,button{-webkit-tap-highlight-color:transparent}.shell{width:min(760px,100%);margin:0 auto;padding:16px 12px 34px}.top{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:14px}.back{width:44px;height:44px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,rgba(9,24,42,.92),rgba(2,9,18,.94));color:white;text-decoration:none;display:grid;place-items:center;font-size:30px}.brand{min-width:0;border:1px solid var(--line);border-radius:18px;background:rgba(6,18,31,.72);padding:10px 12px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--blue2);text-transform:uppercase}.brand h1{margin:3px 0 0;font-size:22px;line-height:1.05}.lead{margin:0 0 14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(7,20,33,.72);color:#c6d2e4;font-size:13px;line-height:1.45}.grid{display:grid;gap:10px}.person-card{border:1px solid var(--line2);border-radius:20px;background:linear-gradient(180deg,rgba(9,25,42,.92),rgba(3,11,22,.97));box-shadow:0 16px 42px rgba(0,0,0,.32);padding:14px}.person-main{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:16px;background:rgba(58,139,255,.16);display:grid;place-items:center;color:#a8d7ff;font-weight:950;font-size:18px}.copy{min-width:0}.copy strong{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.25}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{border:1px solid rgba(108,160,228,.2);border-radius:999px;background:rgba(58,139,255,.08);padding:6px 8px;font-size:10px;font-weight:850;color:#dcecff;text-transform:uppercase;letter-spacing:.05em}.chip.ok{color:#bfffe0;border-color:rgba(37,215,127,.32);background:rgba(37,215,127,.08)}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:13px}.actions a{min-height:38px;border:1px solid rgba(108,160,228,.24);border-radius:12px;background:rgba(4,15,30,.8);color:#f5f8ff;text-decoration:none;display:grid;place-items:center;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;text-align:center}.actions a.primary{border-color:rgba(54,163,255,.48);background:rgba(54,163,255,.14);color:#9ed5ff}.empty{border:1px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted);font-size:13px}.foot{padding:18px 0 0;text-align:center;color:#7fb4ff;font-size:12px}@media(max-width:520px){.shell{padding:13px 10px 28px}.brand h1{font-size:20px}.actions{grid-template-columns:1fr 1fr}.person-card{padding:13px}.copy strong{font-size:16px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><a class="back" href="/apps/nexus-graph-preview/relationship-tree/?v=personcards1" aria-label="Back to Nexus">‹</a><div class="brand"><div class="eyebrow">NOSMO NEXUS</div><h1>Person Cards</h1></div></header>
<p class="lead">System registry for people connected to Nexus Project Graph, Relationship Tree, Data/File Loader and WorkSuite modules.</p>
<section class="grid" id="cards"><div class="empty">Loading Person Cards registry…</div></section>
<div class="foot">Person Cards are shared identity records, not isolated profile pages.</div>
</main>
<script>
const registryUrl='/data/nexus-person-cards.json?v=personcards1';
const cards=document.getElementById('cards');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const initials=name=>String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(part=>part[0]?.toUpperCase()||'').join('')||'?';
function render(data){
  const list=Array.isArray(data?.cards)?data.cards:[];
  if(!list.length){cards.innerHTML='<div class="empty">No Person Cards are registered yet.</div>';return}
  cards.innerHTML=list.map(card=>`
    <article class="person-card">
      <div class="person-main"><div class="avatar">${esc(initials(card.displayName))}</div><div class="copy"><strong>${esc(card.displayName)}</strong><span>${esc(card.role)} · ${esc(card.trade)}</span></div></div>
      <div class="chips"><span class="chip ok">${esc(card.status||'Active')}</span><span class="chip">${esc(card.verification||'Unverified')}</span><span class="chip">${esc(card.nodeId)}</span></div>
      <div class="actions"><a class="primary" href="${esc(card.cardUrl)}">Card</a><a href="${esc(card.treeUrl)}">Tree</a><a href="${esc(card.fileLoaderUrl)}">Data</a><a href="${esc(card.dataUrl)}">JSON</a></div>
    </article>`).join('');
}
fetch(registryUrl,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(new Error('registry offline'))).then(render).catch(err=>{cards.innerHTML=`<div class="empty">${esc(err.message)}</div>`});
</script>
</body>
</html>
