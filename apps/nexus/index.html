    <link rel="stylesheet" crossorigin href="/apps/nexus/assets/index-CTFbKw52.css">
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const moduleName = params.get("module");
        const restoredRoute = params.get("route");
        const routes = {
          workspace: "workspace",
          projects: "projects",
          tasks: "tasks",
          documents: "knowledge",
          timeline: "timeline",
          people: "people",
          cards: "card-maker",
          doorflow: "plan-review",
          safety: "safety-connector",
          integrations: "integrations"
        };

        const requestedRoute = restoredRoute || (moduleName ? routes[moduleName] : "");
        const safeRoute = requestedRoute && /^[a-z0-9/_-]+$/i.test(requestedRoute)
          ? requestedRoute.replace(/^\/+|\/+$/g, "")
          : "";

        if (safeRoute) {
          const suffix = window.location.hash || "";
          window.history.replaceState(null, "", `/apps/nexus/${safeRoute}${suffix}`);
        }
      })();
    </script>

  <body>
    <div id="root"></div>
  </body>
