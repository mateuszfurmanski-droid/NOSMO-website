    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const restoredRoute = params.get("route");
        const safeRoute = restoredRoute && /^[a-z0-9/_-]+$/i.test(restoredRoute)
          ? restoredRoute.replace(/^\/+|\/+$/g, "")
          : "";
        if (safeRoute) {
          window.history.replaceState(null, "", `/apps/nexus/${safeRoute}${window.location.hash || ""}`);
        }
      })();
    </script>
