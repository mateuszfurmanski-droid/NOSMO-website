<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>NOSMO Nexus™ — Relationship Tree</title>
    <meta name="description" content="NOSMO Nexus™ — construction operating layer." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="NOSMO Nexus™" />
    <meta property="og:description" content="NOSMO Nexus™ — construction operating layer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOSMO Nexus™" />
    <meta name="twitter:description" content="NOSMO Nexus™ — construction operating layer." />
    <link rel="icon" type="image/svg+xml" href="/apps/nexus-graph-preview/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Required Vite/Tailwind bundle CSS. Without this the graph mounts as raw text on mobile. -->
    <link rel="stylesheet" crossorigin href="/apps/nexus-graph-preview/assets/index-Dif5omj-.css?v=treefix-20260812b" />

    <link rel="stylesheet" href="./nexus-shell-v2.css?v=treefix-20260812b" />
    <link rel="stylesheet" href="./nexus-timeline-panel.css?v=treefix-20260812b" />
    <link rel="stylesheet" href="./nexus-project-switcher.css?v=treefix-20260812b" />
    <link rel="stylesheet" href="./nexus-people-panel.css?v=treefix-20260812b" />

    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #020713;
        color: #f5f7fb;
        font-family: Inter, Arial, sans-serif;
      }
      body {
        overflow: hidden;
      }
      #root:empty::before {
        content: "Loading Nexus Relationship Tree…";
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: rgba(226, 232, 240, 0.72);
        font-size: 14px;
        letter-spacing: 0.02em;
      }
    </style>

    <script>
      (() => {
        const initialUrl = new URL(window.location.href);
        const world = initialUrl.searchParams.get('world') || 'dev';
        const embedded = initialUrl.searchParams.get('embed') === '1';
        window.__NEXUS_PROJECT_WORLD__ = world;
        window.__NEXUS_PROJECT_TIME__ = null;
        window.__NEXUS_EMBEDDED__ = embedded;
        document.documentElement.dataset.nexusWorld = world;
        if (embedded) document.documentElement.dataset.nexusEmbedded = 'true';
        try {
          document.documentElement.dataset.nexusTheme = localStorage.getItem('nexus.theme') || 'dark';
        } catch {
          document.documentElement.dataset.nexusTheme = 'dark';
        }

        window.addEventListener('message', (event) => {
          if (event.origin !== window.location.origin) return;
          const payload = event.data;
          if (!payload || payload.type !== 'NEXUS_PROJECT_TIME_CHANGE') return;
          window.__NEXUS_PROJECT_TIME__ = payload;
          document.documentElement.dataset.nexusWorld = payload.worldId || world;
          document.documentElement.dataset.nexusTimeMode = payload.mode || '';
          window.dispatchEvent(new CustomEvent('nexus:project-time-change', { detail: payload }));
        });
      })();
    </script>

    <script src="./nexus-world-bootstrap.js?v=treefix-20260812b"></script>
    <script defer src="./nexus-shell-v2.js?v=treefix-20260812b"></script>
    <script defer src="./nexus-timeline-panel.js?v=treefix-20260812b"></script>
    <script defer src="./nexus-project-switcher.js?v=treefix-20260812b"></script>
    <script defer src="./nexus-people-panel.js?v=treefix-20260812b"></script>
    <script defer src="./nexus-trade-content-ai.js?v=treefix-20260812b"></script>

    <script type="module">
      const bundleUrl = '/apps/nexus-graph-preview/assets/index-CWI-Glgh.js?v=treefix-20260812b';

      try {
        const response = await fetch(bundleUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Bundle fetch failed: ${response.status}`);
        const code = await response.text();
        const blobUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        await import(blobUrl);
      } catch (error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#020713;color:#f5f7fb;font-family:Inter,Arial,sans-serif;padding:24px;text-align:center"><section style="max-width:520px;border:1px solid rgba(96,165,250,.35);border-radius:24px;background:rgba(15,23,42,.78);padding:24px"><h1 style="margin:0 0 10px">Nexus graph could not load</h1><p style="color:#b8c4d6">The Relationship Tree runtime failed to mount. Refresh once; if this persists, report the current URL.</p></section></main>';
        }
        console.error('[NOSMO] graph runtime bridge failed', error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
