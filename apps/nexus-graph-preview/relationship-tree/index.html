    <script>
      (() => {
        const initialUrl = new URL(window.location.href);
        const world = initialUrl.searchParams.get('world') || 'dev';
        const embedded = initialUrl.searchParams.get('embed') === '1';
        window.__NEXUS_PROJECT_WORLD__ = world;
        window.__NEXUS_PROJECT_TIME__ = null;
        window.__NEXUS_EMBEDDED__ = embedded;
        document.documentElement.dataset.nexusWorld = world;
        if (embedded) document.documentElement.dataset.nexusEmbedded = 'true';
        try {
          document.documentElement.dataset.nexusTheme = localStorage.getItem('nexus.theme') || 'dark';
        } catch {
          document.documentElement.dataset.nexusTheme = 'dark';
        }

        window.addEventListener('message', (event) => {
          if (event.origin !== window.location.origin) return;
          const payload = event.data;
          if (!payload || payload.type !== 'NEXUS_PROJECT_TIME_CHANGE') return;
          window.__NEXUS_PROJECT_TIME__ = payload;
          document.documentElement.dataset.nexusWorld = payload.worldId || world;
          document.documentElement.dataset.nexusTimeMode = payload.mode || '';
          window.dispatchEvent(new CustomEvent('nexus:project-time-change', { detail: payload }));
        });
      })();
    </script>
    <script src="./nexus-world-bootstrap.js?v=4-restored"></script>
    <script defer src="./nexus-shell-v2.js?v=3"></script>

    <script type="module">
      const bundleUrl = '/apps/nexus-graph-preview/assets/index-CWI-Glgh.js';
      const electricalUrl = '/apps/nexus-graph-preview/electrical-commissioning/';
      const esafeWorld = window.__NEXUS_PROJECT_WORLD__ === 'esafe-demo';

      const replacements = [
        {
          name: 'graph nodes',
          from: 'const ts="proj",Zr="p-sitemgr",ns=[{id:"proj",label:"Riverside Heights Demo",sublabel:"Active Synthetic Project",type:"project",Icon:Dt},',
          to: 'const ts="proj",Zr="p-sitemgr",ns=[{id:"proj",label:"Riverside Heights Demo",sublabel:"Active Synthetic Project",type:"project",Icon:Dt},{id:"m-electrical",label:"Electrical",sublabel:"Trade system",type:"module",Icon:jc},{id:"m-electrical-commissioning",label:"Electrical Commissioning",sublabel:"Open module",type:"module",Icon:jc,href:"/apps/nexus-graph-preview/electrical-commissioning/"},{id:"e-cables",label:"Cables",sublabel:"LV distribution",type:"module",Icon:jc},{id:"e-certificates",label:"Certificates",sublabel:"Apartment testing",type:"module",Icon:jc},{id:"e-communal",label:"Communal",sublabel:"Systems & areas",type:"module",Icon:jc},{id:"e-snags",label:"Electrical Snags",sublabel:"Open defects",type:"module",Icon:jc},'
        },
        {
          name: 'module visual type',
          from: 'gc={project:{chip:"bg-primary/15 text-primary",centerBorder:"border-primary"},person:{chip:"bg-blue-500/15 text-blue-400",centerBorder:"border-blue-500"},task:{chip:"bg-emerald-500/15 text-emerald-400",centerBorder:"border-emerald-500"},document:{chip:"bg-amber-500/15 text-amber-400",centerBorder:"border-amber-500"},issue:{chip:"bg-red-500/15 text-red-400",centerBorder:"border-red-500"}},Ow={issue:-1,person:0,task:1,document:2,project:3}',
          to: 'gc={project:{chip:"bg-primary/15 text-primary",centerBorder:"border-primary"},person:{chip:"bg-blue-500/15 text-blue-400",centerBorder:"border-blue-500"},task:{chip:"bg-emerald-500/15 text-emerald-400",centerBorder:"border-emerald-500"},document:{chip:"bg-amber-500/15 text-amber-400",centerBorder:"border-amber-500"},issue:{chip:"bg-red-500/15 text-red-400",centerBorder:"border-red-500"},module:{chip:"bg-cyan-500/15 text-cyan-300",centerBorder:"border-cyan-400"}},Ow={issue:-1,person:0,module:1,task:2,document:3,project:4}'
        },
        {
          name: 'native graph hierarchy',
          from: 'for(const i of ns)i.id!==ts&&t(ts,i.id);for(const[i,{people:l,docs:d}]of Object.entries(rc))',
          to: 'const elChildren=new Set(["m-electrical-commissioning","e-cables","e-certificates","e-communal","e-snags"]);for(const i of ns)i.id!==ts&&!elChildren.has(i.id)&&t(ts,i.id);for(const id of elChildren)t("m-electrical",id);for(const[i,{people:l,docs:d}]of Object.entries(rc))'
        },
        {
          name: 'module open action',
          from: 'M=B=>{if($.current===B.id){$.current=null;return}',
          to: 'M=B=>{if(B.href){window.location.href=B.href;return}if($.current===B.id){$.current=null;return}'
        },
        {
          name: 'folder dock electrical route',
          from: '"/apps/nexus/electrical-commissioning/"',
          to: '"/apps/nexus-graph-preview/electrical-commissioning/"'
        }
      ];

      try {
        const response = await fetch(bundleUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Bundle fetch failed: ${response.status}`);
        let code = await response.text();

        if (!esafeWorld) {
          for (const patch of replacements) {
            const first = code.indexOf(patch.from);
            const last = code.lastIndexOf(patch.from);
            if (first < 0) throw new Error(`Native graph patch missing: ${patch.name}`);
            if (first !== last) throw new Error(`Native graph patch ambiguous: ${patch.name}`);
            code = code.replace(patch.from, patch.to);
          }

          window.__NEXUS_NATIVE_ELECTRICAL_GRAPH__ = {
            enabled: true,
            root: 'm-electrical',
            children: ['m-electrical-commissioning', 'e-cables', 'e-certificates', 'e-communal', 'e-snags'],
            href: electricalUrl
          };
        } else {
          window.__NEXUS_NATIVE_ELECTRICAL_GRAPH__ = { enabled: false, reason: 'esafe-project-world' };
        }

        const blobUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        try {
          await import(blobUrl);
        } finally {
          URL.revokeObjectURL(blobUrl);
        }
      } catch (error) {
        console.error('[NOSMO] Nexus graph failed to load', error);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#08111f;color:#eaf5ff;font:14px Inter,sans-serif;padding:24px;text-align:center">Nexus graph could not start. Refresh the page or open the previous backup build.</div>';
        }
      }
    </script>

        <button class="nexus-shell-action" type="button" data-nexus-action="projects"><span class="nexus-shell-action-icon">▣</span><span class="nexus-shell-action-copy"><strong>Projects</strong><small>Active project and project worlds</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="people"><span class="nexus-shell-action-icon">◎</span><span class="nexus-shell-action-copy"><strong>People</strong><small>Person Cards and project people</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="trades"><span class="nexus-shell-action-icon">T</span><span class="nexus-shell-action-copy"><strong>Trades</strong><small>Profession and trade tools</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="modules"><span class="nexus-shell-action-icon">▦</span><span class="nexus-shell-action-copy"><strong>Modules</strong><small>Nexus workflow modules</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="connections"><span class="nexus-shell-action-icon">↔</span><span class="nexus-shell-action-copy"><strong>Connections</strong><small>External systems and connectors</small></span></button>
      </div>
      <div class="nexus-shell-section-title">SYSTEM</div>
      <div class="nexus-shell-list">
        <button class="nexus-shell-action" type="button" data-nexus-action="controls"><span class="nexus-shell-action-icon">⌘</span><span class="nexus-shell-action-copy"><strong>View controls</strong><small>Zoom, workflow, timeline and graph tools</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="settings"><span class="nexus-shell-action-icon">⚙</span><span class="nexus-shell-action-copy"><strong>Settings</strong><small id="nexusMenuThemeSub">DARK</small></span></button>
      </div>

    <aside class="nexus-shell-panel right" id="nexusFilesPanel" aria-label="Project files">

        <strong>FILES</strong>
        <button class="nexus-shell-close" type="button" data-nexus-close-panel aria-label="Close files">×</button>
      </div>
      <input class="nexus-file-picker" id="nexusFileInput" type="file" multiple />
      <div class="nexus-shell-list">
        <button class="nexus-shell-action" type="button" data-nexus-file-action="upload"><span class="nexus-shell-action-icon">＋</span><span class="nexus-shell-action-copy"><strong>Upload files</strong><small>Send files to the Nexus File Loader</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-file-action="project-files"><span class="nexus-shell-action-icon">▤</span><span class="nexus-shell-action-copy"><strong>Project files</strong><small>Documents already linked to this project</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-file-action="recent"><span class="nexus-shell-action-icon">◷</span><span class="nexus-shell-action-copy"><strong>Recent</strong><small>Recently added files</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-file-action="unmatched"><span class="nexus-shell-action-icon">?</span><span class="nexus-shell-action-copy"><strong>Unmatched</strong><small>Files that need project context</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-file-action="pending"><span class="nexus-shell-action-icon">✓</span><span class="nexus-shell-action-copy"><strong>Pending review</strong><small>Classified files awaiting confirmation</small></span></button>
      </div>

    <aside class="nexus-shell-panel right" id="nexusSettingsPanel" aria-label="Nexus settings">

      </div>

        <span class="nexus-setting-copy"><strong>Light mode</strong><small>Switch the Nexus interface between dark and white themes</small></span>
        <label class="nexus-theme-switch" aria-label="Toggle light mode">
          <input id="nexusThemeToggle" type="checkbox" />
          <span class="nexus-theme-track"></span>
        </label>
      </div>
      <div class="nexus-theme-note">Theme preference is saved on this device and exposed globally as <code>nexus:theme-change</code> so every Nexus module can use the same setting.</div>
    </aside>

    <div id="root"></div>
