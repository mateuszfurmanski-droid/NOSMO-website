  <body>
    <div id="root"></div>
    <script>
      // Phase 1 WorkSuite compatibility shim.
      // The current Nexus graph is a compiled export. Until its editable source
      // build is republished, rebrand user-visible DoorFlow text and launcher
      // links at runtime without modifying or de-minifying the generated bundle.
      (() => {
        const LEGACY_ROUTE = "/apps/doorflow/";
        const WORKSUITE_ROUTE = "/apps/worksuite/";
        let queued = false;

        function applyWorkSuiteBrand() {
          queued = false;

          document.querySelectorAll(`a[href="${LEGACY_ROUTE}"]`).forEach((link) => {
            if (link.getAttribute("href") === LEGACY_ROUTE) {
              link.setAttribute("href", WORKSUITE_ROUTE);
              link.setAttribute("aria-label", (link.getAttribute("aria-label") || "Open WorkSuite").replace(/DoorFlow/g, "WorkSuite"));
              link.setAttribute("title", (link.getAttribute("title") || "WorkSuite").replace(/DoorFlow/g, "WorkSuite"));
            }
          });

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);

          nodes.forEach((node) => {
            const parent = node.parentElement;
            if (!parent || parent.closest("script, style, textarea, input")) return;
            if (node.nodeValue && node.nodeValue.includes("DoorFlow")) {
              node.nodeValue = node.nodeValue.replace(/DoorFlow/g, "WorkSuite");
            }
          });
        }

        function queueApply() {
          if (queued) return;
          queued = true;
          requestAnimationFrame(applyWorkSuiteBrand);
        }

        const observer = new MutationObserver(queueApply);
        observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        queueApply();
      })();
    </script>
