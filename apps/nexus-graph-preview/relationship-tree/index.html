<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>NOSMO Nexus™</title>
    <meta
      name="description"
      content="NOSMO Nexus relationship tree — the central screen for projects, people, documents, tasks and connected specialist applications."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="NOSMO Nexus™" />
    <meta
      property="og:description"
      content="NOSMO Nexus relationship tree and connected specialist applications."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOSMO Nexus™" />
    <meta
      name="twitter:description"
      content="NOSMO Nexus relationship tree and connected specialist applications."
    />
    <link rel="icon" type="image/svg+xml" href="/apps/nexus-graph-preview/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/apps/nexus-graph-preview/assets/index-BNTHozt8.js"></script>
    <link rel="stylesheet" crossorigin href="/apps/nexus-graph-preview/assets/index-BXtaF8HQ.css" />
    <style>
      .nosmo-specialist-apps {
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: calc(82px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        width: min(344px, calc(100vw - 24px));
        padding: 7px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 18px;
        background: rgba(9, 14, 24, 0.9);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.34);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        font-family: Inter, system-ui, sans-serif;
      }

      .nosmo-specialist-app {
        min-width: 0;
        min-height: 54px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 13px;
        color: #f8fafc;
        background: rgba(30, 41, 59, 0.76);
        text-decoration: none;
        touch-action: manipulation;
        transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
      }

      .nosmo-specialist-app:hover,
      .nosmo-specialist-app:focus-visible {
        border-color: rgba(96, 165, 250, 0.7);
        background: rgba(30, 64, 175, 0.28);
        outline: none;
      }

      .nosmo-specialist-app:active {
        transform: scale(0.98);
      }

      .nosmo-specialist-app__icon {
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        display: grid;
        place-items: center;
        border-radius: 10px;
      }

      .nosmo-specialist-app--doorflow .nosmo-specialist-app__icon {
        color: #93c5fd;
        background: rgba(37, 99, 235, 0.18);
      }

      .nosmo-specialist-app--fire .nosmo-specialist-app__icon {
        color: #fca5a5;
        background: rgba(220, 38, 38, 0.18);
      }

      .nosmo-specialist-app__icon svg {
        width: 21px;
        height: 21px;
        stroke: currentColor;
      }

      .nosmo-specialist-app__copy {
        min-width: 0;
        display: block;
      }

      .nosmo-specialist-app__title,
      .nosmo-specialist-app__label {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nosmo-specialist-app__title {
        font-size: 13px;
        line-height: 1.2;
        font-weight: 700;
      }

      .nosmo-specialist-app__label {
        margin-top: 3px;
        color: #94a3b8;
        font-size: 10px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      @media (min-width: 900px) {
        .nosmo-specialist-apps {
          left: auto;
          right: 24px;
          bottom: 24px;
          transform: none;
        }
      }

      @media (max-width: 370px) {
        .nosmo-specialist-app__label {
          display: none;
        }
      }
    </style>
    <script>
      history.replaceState(null, "", "/apps/nexus-graph-preview/relationship-tree");
    </script>
  </head>
  <body>
    <div id="root"></div>

    <nav class="nosmo-specialist-apps" aria-label="NOSMO specialist applications">
      <a
        class="nosmo-specialist-app nosmo-specialist-app--doorflow"
        href="/apps/doorflow/"
        aria-label="Open DoorFlow"
      >
        <span class="nosmo-specialist-app__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 21h14" />
            <path d="M7 21V4.8a1.8 1.8 0 0 1 1.45-1.77l7-1.4A1.8 1.8 0 0 1 17.6 3.4V21" />
            <path d="M14 12h.01" />
          </svg>
        </span>
        <span class="nosmo-specialist-app__copy">
          <span class="nosmo-specialist-app__title">DoorFlow</span>
          <span class="nosmo-specialist-app__label">Plan &amp; doors</span>
        </span>
      </a>

      <a
        class="nosmo-specialist-app nosmo-specialist-app--fire"
        href="/apps/fire-door-register/"
        aria-label="Open Fire Door Register"
      >
        <span class="nosmo-specialist-app__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c4.4 0 7-2.7 7-6.5 0-2.7-1.5-5-4.5-7.2.1 2-1 3.3-2.2 4.1.2-3.6-1.5-6.7-4.3-9.4.1 3.4-3 5.7-3 9.7C5 18 8 22 12 22Z" />
            <path d="M9.3 17.3c0 1.6 1.1 2.7 2.7 2.7s2.7-1 2.7-2.6c0-1.2-.7-2.2-2-3.2 0 1-.5 1.6-1.1 2-.1-1.5-.8-2.7-2-3.9.1 1.7-.3 2.8-.3 5Z" />
          </svg>
        </span>
        <span class="nosmo-specialist-app__copy">
          <span class="nosmo-specialist-app__title">Fire Register</span>
          <span class="nosmo-specialist-app__label">Standalone app</span>
        </span>
      </a>
    </nav>
  </body>
</html>
