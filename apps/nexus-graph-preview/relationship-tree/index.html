<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOSMO Nexus — Relationship Tree</title>
    <meta name="robots" content="noindex" />
    <script>
      (() => {
        const target = new URL('./controller.html', window.location.href);
        const current = new URL(window.location.href);
        current.searchParams.forEach((value, key) => target.searchParams.set(key, value));
        if (!target.searchParams.has('runtime')) target.searchParams.set('runtime', '4-project-clean');
        target.searchParams.set('entry', 'controller');
        window.location.replace(target.toString());
      })();
    </script>
  </head>
  <body>
    <p>Opening NOSMO Nexus Relationship Tree…</p>
  </body>
</html>
