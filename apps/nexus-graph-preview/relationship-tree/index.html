    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (() => {
        const initialUrl = new URL(window.location.href);
        const world = initialUrl.searchParams.get('world') || 'dev';
        const embedded = initialUrl.searchParams.get('embed') === '1';
        window.__NEXUS_PROJECT_WORLD__ = world;
        window.__NEXUS_PROJECT_TIME__ = null;
        window.__NEXUS_EMBEDDED__ = embedded;
        document.documentElement.dataset.nexusWorld = world;
        if (embedded) document.documentElement.dataset.nexusEmbedded = 'true';

        window.addEventListener('message', (event) => {
          if (event.origin !== window.location.origin) return;
          const payload = event.data;
          if (!payload || payload.type !== 'NEXUS_PROJECT_TIME_CHANGE') return;
          window.__NEXUS_PROJECT_TIME__ = payload;
          document.documentElement.dataset.nexusWorld = payload.worldId || world;
          document.documentElement.dataset.nexusTimeMode = payload.mode || '';
          window.dispatchEvent(new CustomEvent('nexus:project-time-change', { detail: payload }));
        });

        if (embedded) {
          const norm = (value) => String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();

          const hideEmbeddedChrome = () => {
            document.querySelectorAll('button,a').forEach((el) => {
              const label = norm(el.textContent);
              if (label.includes('nexus menu')) {
                el.style.display = 'none';
                el.setAttribute('aria-hidden', 'true');
                el.dataset.nexusEmbeddedHidden = 'nexus-menu';
              }
            });

            const workflowControls = Array.from(document.querySelectorAll('button,[role="button"],div'))
              .filter((el) => norm(el.textContent).includes('workflow mode'));

            workflowControls.forEach((workflowControl) => {
              let node = workflowControl;
              let toolbar = null;
              for (let depth = 0; node && depth < 8; depth += 1, node = node.parentElement) {
                const text = norm(node.innerText || node.textContent);
                const rect = node.getBoundingClientRect();
                const looksLikeToolbar =
                  text.includes('workflow mode') &&
                  text.includes('objects') &&
                  text.includes('links') &&
                  rect.width >= 240 &&
                  rect.height >= 50 &&
                  rect.height <= 190;
                if (looksLikeToolbar) {
                  toolbar = node;
                  break;
                }
              }
              if (toolbar) {
                toolbar.style.display = 'none';
                toolbar.setAttribute('aria-hidden', 'true');
                toolbar.dataset.nexusEmbeddedHidden = 'tree-toolbar';
              }
            });
          };

          window.addEventListener('DOMContentLoaded', () => {
            hideEmbeddedChrome();
            requestAnimationFrame(hideEmbeddedChrome);
            window.setTimeout(hideEmbeddedChrome, 250);
            window.setTimeout(hideEmbeddedChrome, 1000);
            const observer = new MutationObserver(hideEmbeddedChrome);
            observer.observe(document.body, { childList: true, subtree: true, characterData: true });
            window.setTimeout(() => observer.disconnect(), 30000);
          });
        }
      })();
    </script>
    <script type="module" crossorigin src="/apps/nexus-graph-preview/assets/index-CG6GP8Yp.js"></script>
    <link rel="stylesheet" crossorigin href="/apps/nexus-graph-preview/assets/index-CDZx_Sdl.css">
    <script>history.replaceState(null,"","/apps/nexus-graph-preview/relationship-tree");</script>
  </head>

    <div id="root"></div>
  </body>
</html>
