<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOSMO Nexus — Relationship Tree</title>
    <meta name="robots" content="noindex" />
    <script>
      (() => {
        const current = new URL(window.location.href);
        const target = new URL('/apps/nexus-graph-preview/', window.location.origin);
        current.searchParams.forEach((value, key) => target.searchParams.set(key, value));
        target.searchParams.set('relationshipTree', '1');
        if (!target.searchParams.has('world')) target.searchParams.set('world', 'esafe-demo');
        if (!target.searchParams.has('runtime')) target.searchParams.set('runtime', '4-project-clean');
        target.searchParams.set('v', 'root-fallback-20260813a');
        window.location.replace(target.toString());
      })();
    </script>
  </head>
  <body>
    <p>Opening NOSMO Nexus Relationship Tree…</p>
  </body>
</html>
