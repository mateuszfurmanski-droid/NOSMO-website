    <style id="nosmo-electrical-tree-style">
      #nosmo-electrical-tree-node {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 28;
        transform: translate(260px, 220px) translate(-50%, -50%);
        pointer-events: auto;
      }

      #nosmo-electrical-tree-node .nosmo-electrical-tree-card {
        display: flex;
        width: 132px;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        color: hsl(var(--foreground));
        text-decoration: none;
        outline: none;
      }

      #nosmo-electrical-tree-node .nosmo-electrical-tree-icon {
        position: relative;
        display: flex;
        width: 82px;
        height: 82px;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(34, 211, 238, .72);
        border-radius: 18px;
        background: hsl(var(--card));
        color: rgb(103, 232, 249);
        font-size: 32px;
        font-weight: 800;
        box-shadow: 0 14px 38px rgba(0, 0, 0, .38), 0 0 30px rgba(34, 211, 238, .12);
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      }

      #nosmo-electrical-tree-node .nosmo-electrical-tree-card:hover .nosmo-electrical-tree-icon,
      #nosmo-electrical-tree-node .nosmo-electrical-tree-card:focus-visible .nosmo-electrical-tree-icon {
        transform: scale(1.05);
        border-color: rgb(103, 232, 249);
        box-shadow: 0 14px 38px rgba(0, 0, 0, .38), 0 0 36px rgba(34, 211, 238, .25);
      }

      #nosmo-electrical-tree-node .nosmo-electrical-tree-label {
        max-width: 132px;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.15;
      }

      #nosmo-electrical-tree-node .nosmo-electrical-tree-type {
        border: 1px solid hsl(var(--border));
        border-radius: 999px;
        background: hsl(var(--background) / .82);
        padding: 2px 8px;
        color: hsl(var(--muted-foreground));
        font-size: 8px;
        font-weight: 800;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
    </style>
    <script>
      (() => {
        const initialUrl = new URL(window.location.href);
        const world = initialUrl.searchParams.get('world') || 'dev';
        const embedded = initialUrl.searchParams.get('embed') === '1';
        window.__NEXUS_PROJECT_WORLD__ = world;
        window.__NEXUS_PROJECT_TIME__ = null;
        window.__NEXUS_EMBEDDED__ = embedded;
        document.documentElement.dataset.nexusWorld = world;
        if (embedded) document.documentElement.dataset.nexusEmbedded = 'true';
        try {
          document.documentElement.dataset.nexusTheme = localStorage.getItem('nexus.theme') || 'dark';
        } catch {
          document.documentElement.dataset.nexusTheme = 'dark';
        }

        window.addEventListener('message', (event) => {
          if (event.origin !== window.location.origin) return;
          const payload = event.data;
          if (!payload || payload.type !== 'NEXUS_PROJECT_TIME_CHANGE') return;
          window.__NEXUS_PROJECT_TIME__ = payload;
          document.documentElement.dataset.nexusWorld = payload.worldId || world;
          document.documentElement.dataset.nexusTimeMode = payload.mode || '';
          window.dispatchEvent(new CustomEvent('nexus:project-time-change', { detail: payload }));
        });
      })();
    </script>
    <script defer src="./nexus-shell-v2.js"></script>
    <script defer src="./nexus-timeline-panel.js"></script>
    <script>
      (() => {
        const electricalUrl = '/apps/nexus-graph-preview/electrical-commissioning/';
        const legacyElectricalUrl = '/apps/nexus/electrical-commissioning/';
        const nodeId = 'nosmo-electrical-tree-node';
        const overlayId = 'nosmo-electrical-tree-link-overlay';

        function mountElectricalNode() {
          const root = document.getElementById('root');
          if (!root) return;
          const projectNode = root.querySelector('[data-node-id="proj"]');
          if (!projectNode) return;
          const scene = projectNode.parentElement;
          if (!scene) return;

          if (!scene.querySelector('#' + overlayId)) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.id = overlayId;
            svg.setAttribute('aria-hidden', 'true');
            svg.style.position = 'absolute';
            svg.style.left = '0';
            svg.style.top = '0';
            svg.style.overflow = 'visible';
            svg.style.pointerEvents = 'none';
            svg.style.zIndex = '1';

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', '0');
            line.setAttribute('y1', '0');
            line.setAttribute('x2', '260');
            line.setAttribute('y2', '220');
            line.setAttribute('stroke', 'rgba(34, 211, 238, .48)');
            line.setAttribute('stroke-width', '2');
            line.setAttribute('stroke-dasharray', '7 5');
            svg.appendChild(line);
            scene.appendChild(svg);
          }

          if (!scene.querySelector('#' + nodeId)) {
            const node = document.createElement('div');
            node.id = nodeId;
            node.setAttribute('data-control', 'true');
            node.setAttribute('data-nosmo-module-node', 'electrical');
            node.innerHTML = `
              <a class="nosmo-electrical-tree-card" href="${electricalUrl}" aria-label="Open Electrical Commissioning">
                <span class="nosmo-electrical-tree-icon" aria-hidden="true">⚡</span>
                <span class="nosmo-electrical-tree-label">Electrical Commissioning</span>
                <span class="nosmo-electrical-tree-type">NOSMO module</span>
              </a>`;
            scene.appendChild(node);
          }
        }

        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target.closest(`a[href="${legacyElectricalUrl}"]`) : null;
          if (!target) return;
          event.preventDefault();
          window.location.href = electricalUrl;
        }, true);

        window.addEventListener('DOMContentLoaded', () => {
          mountElectricalNode();
          const root = document.getElementById('root');
          if (!root) return;
          const observer = new MutationObserver(mountElectricalNode);
          observer.observe(root, { childList: true, subtree: true });
        });
        window.addEventListener('load', mountElectricalNode);
      })();
    </script>
    <script type="module" crossorigin src="/apps/nexus-graph-preview/assets/index-CWI-Glgh.js"></script>

  <body>
    <nav class="nexus-top-rail" id="nexusTopRail" aria-label="Nexus project navigation">
      <button class="nexus-top-tile nexus-top-menu" id="nexusTopMenu" type="button" aria-label="Open Nexus menu">
        <span class="nexus-top-icon">☰</span>
        <span class="nexus-top-label">MENU</span>
        <span class="nexus-top-sub">NEXUS</span>
      </button>
      <button class="nexus-top-tile" id="nexusTopProject" type="button" aria-label="Open active project">
        <span class="nexus-top-icon">▣</span>
        <span class="nexus-top-label">PROJECT</span>
        <span class="nexus-top-sub">RIVERSIDE</span>
      </button>
      <button class="nexus-top-tile" id="nexusTopTime" type="button" aria-label="Toggle radial timeline">
        <span class="nexus-top-icon">◷</span>
        <span class="nexus-top-label">TIME</span>
        <span class="nexus-top-sub" id="nexusTopTimeSub">OFF</span>
      </button>
      <button class="nexus-top-tile" id="nexusTopFiles" type="button" aria-label="Open project files">
        <span class="nexus-top-icon">▤</span>
        <span class="nexus-top-label">FILES</span>
        <span class="nexus-top-sub">UPLOAD + DOCS</span>
      </button>
    </nav>

    <div class="nexus-shell-scrim" id="nexusShellScrim" aria-hidden="true"></div>

    <aside class="nexus-shell-panel left" id="nexusMenuPanel" aria-label="Nexus menu">
      <div class="nexus-shell-panel-head">
        <strong>NEXUS MENU</strong>
        <button class="nexus-shell-close" type="button" data-nexus-close-panel aria-label="Close menu">×</button>
      </div>
      <div class="nexus-shell-section-title">NAVIGATION</div>
      <div class="nexus-shell-list">
        <button class="nexus-shell-action" type="button" data-nexus-action="home"><span class="nexus-shell-action-icon">⌂</span><span class="nexus-shell-action-copy"><strong>Home</strong><small>Relationship Tree</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="projects"><span class="nexus-shell-action-icon">▣</span><span class="nexus-shell-action-copy"><strong>Projects</strong><small>Active project and project worlds</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="people"><span class="nexus-shell-action-icon">◎</span><span class="nexus-shell-action-copy"><strong>People</strong><small>Person Cards and project people</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="trades"><span class="nexus-shell-action-icon">T</span><span class="nexus-shell-action-copy"><strong>Trades</strong><small>Profession and trade tools</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="modules"><span class="nexus-shell-action-icon">▦</span><span class="nexus-shell-action-copy"><strong>Modules</strong><small>Nexus workflow modules</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="connections"><span class="nexus-shell-action-icon">↔</span><span class="nexus-shell-action-copy"><strong>Connections</strong><small>External systems and connectors</small></span></button>
      </div>
      <div class="nexus-shell-section-title">SYSTEM</div>
      <div class="nexus-shell-list">
        <button class="nexus-shell-action" type="button" data-nexus-action="controls"><span class="nexus-shell-action-icon">⌘</span><span class="nexus-shell-action-copy"><strong>View controls</strong><small>Zoom, workflow, timeline and graph tools</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-action="settings"><span class="nexus-shell-action-icon">⚙</span><span class="nexus-shell-action-copy"><strong>Settings</strong><small id="nexusMenuThemeSub">DARK</small></span></button>
      </div>
    </aside>

    <aside class="nexus-shell-panel right" id="nexusFilesPanel" aria-label="Project files">
      <div class="nexus-shell-panel-head">
        <strong>FILES</strong>
        <button class="nexus-shell-close" type="button" data-nexus-close-panel aria-label="Close files">×</button>
      </div>
      <input class="nexus-file-picker" id="nexusFileInput" type="file" multiple />
      <div class="nexus-shell-list">
        <button class="nexus-shell-action" type="button" data-nexus-file-action="upload"><span class="nexus-shell-action-icon">＋</span><span class="nexus-shell-action-copy"><strong>Upload files</strong><small>Send files to the Nexus File Loader</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-file-action="project-files"><span class="nexus-shell-action-icon">▤</span><span class="nexus-shell-action-copy"><strong>Project files</strong><small>Documents already linked to this project</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-file-action="recent"><span class="nexus-shell-action-icon">◷</span><span class="nexus-shell-action-copy"><strong>Recent</strong><small>Recently added files</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-file-action="unmatched"><span class="nexus-shell-action-icon">?</span><span class="nexus-shell-action-copy"><strong>Unmatched</strong><small>Files that need project context</small></span></button>
        <button class="nexus-shell-action" type="button" data-nexus-file-action="pending"><span class="nexus-shell-action-icon">✓</span><span class="nexus-shell-action-copy"><strong>Pending review</strong><small>Classified files awaiting confirmation</small></span></button>
      </div>
      <div class="nexus-file-selection" id="nexusFileSelection">No files selected</div>
    </aside>

    <aside class="nexus-shell-panel right" id="nexusSettingsPanel" aria-label="Nexus settings">
      <div class="nexus-shell-panel-head">
        <strong>SETTINGS</strong>
        <button class="nexus-shell-close" type="button" data-nexus-close-panel aria-label="Close settings">×</button>
      </div>
      <div class="nexus-shell-section-title">APPEARANCE</div>
      <div class="nexus-setting-row">
        <span class="nexus-setting-copy"><strong>Light mode</strong><small>Switch the Nexus interface between dark and white themes</small></span>
        <label class="nexus-theme-switch" aria-label="Toggle light mode">
          <input id="nexusThemeToggle" type="checkbox" />
          <span class="nexus-theme-track"></span>
        </label>
      </div>
      <div class="nexus-theme-note">Theme preference is saved on this device and exposed globally as <code>nexus:theme-change</code> so every Nexus module can use the same setting.</div>
    </aside>

    <div id="root"></div>
  </body>
