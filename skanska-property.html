<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>NOSMO Nexus — SKANSKA Property Demo</title>
<meta name="description" content="NOSMO Nexus commercial property and building operations demonstrator prepared for SKANSKA use-case exploration.">
<link rel="stylesheet" href="/nexus/nosmo-demo-themes.css">
<style>.property-demo {
  --demo-bg: #07110d;
  --demo-panel: rgba(14, 31, 24, 0.92);
  --demo-panel-strong: #10271d;
  --demo-text: #eef8f2;
  --demo-muted: #9cb8a8;
  --demo-border: rgba(157, 230, 194, 0.2);
  --demo-accent: #9de6c2;
  --demo-accent-strong: #56c996;
  --demo-warn: #f0c24f;
  --demo-danger: #ff8075;
  min-height: 100dvh;
  padding: 16px;
  color: var(--demo-text);
  background:
    radial-gradient(circle at 14% 4%, color-mix(in srgb, var(--demo-accent) 14%, transparent), transparent 28rem),
    linear-gradient(145deg, var(--demo-bg), #050808 72%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.property-demo[data-theme="gold"] { --demo-bg:#161108; --demo-panel:rgba(39,30,14,.93); --demo-panel-strong:#30220e; --demo-text:#fff7de; --demo-muted:#c9b98c; --demo-border:rgba(240,194,79,.22); --demo-accent:#f0c24f; --demo-accent-strong:#d39b21; }
.property-demo[data-theme="blue"] { --demo-bg:#06111a; --demo-panel:rgba(8,29,43,.93); --demo-panel-strong:#0b2637; --demo-text:#edf9ff; --demo-muted:#9bbdd0; --demo-border:rgba(85,189,242,.22); --demo-accent:#55bdf2; --demo-accent-strong:#278bc1; }
.property-demo[data-theme="white"] { --demo-bg:#eeeae0; --demo-panel:rgba(255,255,255,.9); --demo-panel-strong:#fff; --demo-text:#171815; --demo-muted:#60645c; --demo-border:rgba(20,30,22,.16); --demo-accent:#4d8066; --demo-accent-strong:#2c6548; --demo-warn:#9c6a00; --demo-danger:#a42e26; }
.property-demo[data-theme="black"] { --demo-bg:#030303; --demo-panel:rgba(12,12,12,.95); --demo-panel-strong:#161616; --demo-text:#f3f3f3; --demo-muted:#aaa; --demo-border:rgba(255,255,255,.14); --demo-accent:#dedede; --demo-accent-strong:#fff; }

.property-demo *, .property-demo *::before, .property-demo *::after { box-sizing: border-box; }
.property-demo button, .property-demo input { font: inherit; }
.property-demo button { color: inherit; }

.property-demo-header, .property-demo-intro, .property-demo-layout, .property-demo-footer, .property-demo-path, .property-demo-ai { max-width: 1580px; margin-inline: auto; }
.property-demo-header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 4px 18px; border-bottom:1px solid var(--demo-border); }
.property-demo-brand { display:flex; align-items:center; gap:12px; min-width:0; }
.property-demo-brand img { width:42px; height:42px; object-fit:contain; filter:drop-shadow(0 0 16px color-mix(in srgb,var(--demo-accent) 28%,transparent)); }
.property-demo-brand div { display:grid; gap:2px; }
.property-demo-brand strong { letter-spacing:.11em; font-size:13px; }
.property-demo-brand span { color:var(--demo-muted); font-size:12px; }
.property-demo-header-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
.property-demo-theme-picker { display:flex; gap:4px; padding:4px; border:1px solid var(--demo-border); border-radius:999px; background:color-mix(in srgb,var(--demo-panel) 85%,transparent); }
.property-demo-theme-picker button { border:0; border-radius:999px; padding:6px 9px; background:transparent; color:var(--demo-muted); cursor:pointer; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.property-demo-theme-picker button.active { color:var(--demo-bg); background:var(--demo-accent); }

.property-demo-badge { display:inline-flex; align-items:center; width:max-content; max-width:100%; padding:5px 8px; border-radius:999px; font-size:9px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; line-height:1.2; }
.property-demo-badge-demo { color:var(--demo-warn); border:1px solid color-mix(in srgb,var(--demo-warn) 40%,transparent); background:color-mix(in srgb,var(--demo-warn) 9%,transparent); }
.property-demo-badge-source { color:var(--demo-accent); border:1px solid var(--demo-border); background:color-mix(in srgb,var(--demo-accent) 8%,transparent); }

.property-demo-intro { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end; padding:28px 4px 18px; }
.property-demo-eyebrow { margin:0 0 8px; color:var(--demo-accent); font-size:11px; font-weight:850; letter-spacing:.16em; }
.property-demo-intro h1 { margin:0; max-width:850px; font-size:clamp(28px,4vw,58px); line-height:.98; letter-spacing:-.045em; }
.property-demo-intro p:not(.property-demo-eyebrow) { max-width:850px; margin:14px 0 0; color:var(--demo-muted); line-height:1.55; font-size:14px; }
.property-demo-ai-cta { min-width:290px; display:flex; gap:12px; align-items:center; text-align:left; border:1px solid color-mix(in srgb,var(--demo-accent) 42%,transparent); border-radius:16px; padding:14px; background:linear-gradient(135deg,color-mix(in srgb,var(--demo-accent) 16%,transparent),var(--demo-panel)); cursor:pointer; box-shadow:0 16px 50px rgba(0,0,0,.2); }
.property-demo-ai-cta svg { width:28px; height:28px; color:var(--demo-accent); flex:none; }
.property-demo-ai-cta span { display:grid; gap:3px; font-weight:750; }
.property-demo-ai-cta small { color:var(--demo-accent); font-size:9px; letter-spacing:.09em; text-transform:uppercase; }

.property-demo-path { display:flex; align-items:center; gap:7px; padding:10px 12px; overflow-x:auto; border:1px solid var(--demo-border); border-radius:12px; background:color-mix(in srgb,var(--demo-panel) 72%,transparent); color:var(--demo-muted); white-space:nowrap; font-size:11px; }
.property-demo-path span, .property-demo-path strong { display:inline-flex; align-items:center; gap:6px; }
.property-demo-path svg { width:13px; height:13px; flex:none; }
.property-demo-path strong { color:var(--demo-accent); }

.property-demo-ai { margin-top:12px; padding:16px; border:1px solid color-mix(in srgb,var(--demo-accent) 42%,transparent); border-radius:16px; background:linear-gradient(145deg,color-mix(in srgb,var(--demo-accent) 12%,var(--demo-panel)),var(--demo-panel)); }
.property-demo-ai-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
.property-demo-note { margin:10px 0 0; color:var(--demo-muted); font-size:10px; line-height:1.5; }

.property-demo-layout { display:grid; grid-template-columns:minmax(420px,.84fr) minmax(520px,1.16fr); gap:14px; padding-top:14px; }
.property-demo-graph-panel, .property-demo-detail-panel { min-width:0; border:1px solid var(--demo-border); border-radius:18px; background:var(--demo-panel); box-shadow:0 18px 70px rgba(0,0,0,.18); overflow:hidden; }
.property-demo-graph-panel { padding:14px; }
.property-demo-detail-panel { min-height:720px; }
.property-demo-panel-title { min-height:30px; display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--demo-muted); font-size:10px; font-weight:800; letter-spacing:.1em; }
.property-demo-panel-title span { display:flex; align-items:center; gap:6px; }
.property-demo-panel-title svg { width:14px; height:14px; color:var(--demo-accent); }
.property-demo-panel-title button { border:1px solid var(--demo-border); border-radius:8px; padding:5px 8px; background:transparent; cursor:pointer; font-size:10px; }

.property-demo-graph-root { display:flex; justify-content:center; padding:14px 0 19px; position:relative; }
.property-demo-graph-root::after { content:""; position:absolute; bottom:0; left:50%; height:18px; border-left:1px solid var(--demo-border); }
.property-demo-root-node { width:min(100%,310px); display:grid; justify-items:center; gap:5px; padding:18px; border:1px solid color-mix(in srgb,var(--demo-accent) 45%,transparent); border-radius:18px; background:linear-gradient(145deg,color-mix(in srgb,var(--demo-accent) 16%,transparent),var(--demo-panel-strong)); text-align:center; }
.property-demo-root-node svg { width:28px; height:28px; color:var(--demo-accent); }
.property-demo-root-node strong { font-size:14px; }
.property-demo-root-node small { color:var(--demo-muted); font-size:9px; letter-spacing:.08em; }

.property-demo-graph-section { position:relative; padding:14px 0 5px; border-top:1px dashed var(--demo-border); }
.property-demo-graph-section > label { display:flex; align-items:center; gap:6px; margin-bottom:8px; color:var(--demo-muted); font-size:9px; font-weight:800; letter-spacing:.11em; }
.property-demo-graph-section > label svg { width:13px; height:13px; }
.property-demo-node-row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
.property-demo-node-row button { min-height:66px; position:relative; display:grid; gap:4px; align-content:center; padding:9px; border:1px solid var(--demo-border); border-radius:12px; background:color-mix(in srgb,var(--demo-panel-strong) 82%,transparent); cursor:pointer; text-align:left; transition:.16s ease; }
.property-demo-node-row button:hover, .property-demo-node-row button.active { border-color:color-mix(in srgb,var(--demo-accent) 55%,transparent); background:color-mix(in srgb,var(--demo-accent) 10%,var(--demo-panel-strong)); transform:translateY(-1px); }
.property-demo-node-row button.active { box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--demo-accent) 30%,transparent); }
.property-demo-node-row strong { color:var(--demo-text); font-size:11px; }
.property-demo-node-row small { color:var(--demo-muted); font-size:9px; line-height:1.3; }
.property-demo-assets-row { grid-template-columns:repeat(2,minmax(0,1fr)); }
.property-demo-alert-icon { position:absolute; top:8px; right:8px; width:14px; height:14px; color:var(--demo-danger); }
.property-demo-search { display:flex; align-items:center; gap:7px; margin:12px 0 0; padding:9px 11px; border:1px solid var(--demo-border); border-radius:11px; background:color-mix(in srgb,var(--demo-bg) 30%,transparent); }
.property-demo-search svg { width:14px; height:14px; color:var(--demo-muted); }
.property-demo-search input { min-width:0; flex:1; border:0; outline:0; background:transparent; color:var(--demo-text); font-size:11px; }
.property-demo-search input::placeholder { color:var(--demo-muted); }
.property-demo-empty { grid-column:1/-1; margin:0; padding:14px; color:var(--demo-muted); font-size:11px; }

.property-demo-relations { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:13px; padding-top:13px; border-top:1px solid var(--demo-border); }
.property-demo-relation-chip { min-width:0; display:flex; gap:7px; align-items:center; padding:8px; border:1px solid var(--demo-border); border-radius:11px; background:transparent; text-align:left; }
.property-demo-relation-chip:not(:disabled) { cursor:pointer; }
.property-demo-relation-chip:not(:disabled):hover { border-color:color-mix(in srgb,var(--demo-accent) 45%,transparent); }
.property-demo-relation-icon { display:grid; place-items:center; width:27px; height:27px; flex:none; border-radius:8px; color:var(--demo-accent); background:color-mix(in srgb,var(--demo-accent) 10%,transparent); }
.property-demo-relation-icon svg { width:14px; height:14px; }
.property-demo-relation-chip > span:last-child { min-width:0; display:grid; gap:2px; }
.property-demo-relation-chip small { color:var(--demo-muted); font-size:8px; font-weight:750; letter-spacing:.08em; }
.property-demo-relation-chip strong { overflow:hidden; color:var(--demo-text); font-size:9px; text-overflow:ellipsis; white-space:nowrap; }
.property-demo-mini-stats { display:flex; gap:7px; flex-wrap:wrap; margin-top:13px; color:var(--demo-muted); font-size:9px; }
.property-demo-mini-stats span { padding:5px 7px; border-radius:8px; background:color-mix(in srgb,var(--demo-bg) 30%,transparent); }
.property-demo-mini-stats strong { color:var(--demo-accent); }

.property-demo-tabs { display:flex; gap:2px; padding:8px; overflow-x:auto; border-bottom:1px solid var(--demo-border); background:color-mix(in srgb,var(--demo-bg) 15%,transparent); }
.property-demo-tabs button { flex:1 0 auto; border:0; border-radius:9px; padding:8px 10px; background:transparent; color:var(--demo-muted); cursor:pointer; font-size:9px; font-weight:800; letter-spacing:.06em; }
.property-demo-tabs button.active { background:color-mix(in srgb,var(--demo-accent) 12%,transparent); color:var(--demo-accent); }
.property-demo-object-card, .property-demo-work, .property-demo-circular, .property-demo-esg, .property-demo-sources { padding:16px; }
.property-demo-object-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding-bottom:14px; }
.property-demo-object-heading > div:first-child { min-width:0; }
.property-demo-object-heading span:first-child { color:var(--demo-accent); font-size:9px; font-weight:800; letter-spacing:.1em; }
.property-demo-object-heading h2 { margin:4px 0; font-size:24px; line-height:1.05; letter-spacing:-.025em; }
.property-demo-object-heading p { margin:0; color:var(--demo-muted); font-size:11px; line-height:1.45; }
.property-demo-object-heading > svg { width:32px; height:32px; color:var(--demo-accent); }

.property-demo-card-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
.property-demo-kv { min-width:0; display:grid; gap:4px; align-content:start; padding:9px 10px; border:1px solid var(--demo-border); border-radius:11px; background:color-mix(in srgb,var(--demo-bg) 17%,transparent); }
.property-demo-kv > span { color:var(--demo-muted); font-size:8px; font-weight:760; letter-spacing:.07em; text-transform:uppercase; }
.property-demo-kv > strong { font-size:10px; line-height:1.45; overflow-wrap:anywhere; }
.property-demo-evidence-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:12px; }
.property-demo-evidence-grid > div { display:grid; gap:5px; align-content:start; padding:10px; border:1px solid var(--demo-border); border-radius:11px; }
.property-demo-evidence-grid svg { width:16px; height:16px; color:var(--demo-accent); }
.property-demo-evidence-grid strong { font-size:10px; }
.property-demo-evidence-grid span { color:var(--demo-muted); font-size:9px; line-height:1.35; }

.property-demo-history { margin-top:14px; padding-top:12px; border-top:1px solid var(--demo-border); }
.property-demo-history h3 { margin:0 0 8px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
.property-demo-history-event { display:grid; grid-template-columns:80px 94px minmax(0,1fr); gap:8px; align-items:start; padding:8px 0; border-top:1px solid color-mix(in srgb,var(--demo-border) 65%,transparent); }
.property-demo-history-event time { color:var(--demo-muted); font-size:9px; }
.property-demo-history-event > div { min-width:0; }
.property-demo-history-event strong { display:block; font-size:10px; }
.property-demo-history-event p { margin:2px 0 0; color:var(--demo-muted); font-size:9px; line-height:1.4; }
.property-demo-event-type { width:max-content; max-width:100%; padding:3px 5px; border-radius:999px; background:color-mix(in srgb,var(--demo-accent) 9%,transparent); color:var(--demo-accent); font-size:7px; font-weight:800; }
.property-demo-event-issue { color:var(--demo-danger); background:color-mix(in srgb,var(--demo-danger) 10%,transparent); }
.property-demo-event-replacement, .property-demo-event-reuse { color:var(--demo-warn); background:color-mix(in srgb,var(--demo-warn) 10%,transparent); }

.property-demo-primary, .property-demo-secondary { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:38px; margin-top:14px; border-radius:11px; padding:9px 13px; cursor:pointer; font-size:10px; font-weight:800; }
.property-demo-primary { border:1px solid color-mix(in srgb,var(--demo-accent) 55%,transparent); background:var(--demo-accent); color:var(--demo-bg); }
.property-demo-primary:hover:not(:disabled) { filter:brightness(1.06); }
.property-demo-primary:disabled { cursor:not-allowed; opacity:.35; }
.property-demo-secondary { border:1px solid var(--demo-border); background:transparent; color:var(--demo-text); }
.property-demo-primary svg, .property-demo-secondary svg { width:15px; height:15px; }
.property-demo-good { display:flex; align-items:flex-start; gap:7px; margin-top:11px; padding:10px; border:1px solid color-mix(in srgb,var(--demo-accent) 35%,transparent); border-radius:11px; background:color-mix(in srgb,var(--demo-accent) 8%,transparent); color:var(--demo-accent); font-size:10px; line-height:1.4; }
.property-demo-good svg { width:15px; height:15px; flex:none; }

.property-demo-work-progress { display:flex; gap:4px; overflow-x:auto; padding-bottom:12px; }
.property-demo-work-progress span { display:inline-flex; align-items:center; gap:4px; flex:0 0 auto; padding:5px 7px; border:1px solid var(--demo-border); border-radius:999px; color:var(--demo-muted); font-size:7px; font-weight:800; letter-spacing:.05em; }
.property-demo-work-progress span.active { border-color:var(--demo-accent); color:var(--demo-accent); }
.property-demo-work-progress span.done { border-color:color-mix(in srgb,var(--demo-accent) 26%,transparent); color:var(--demo-accent); opacity:.68; }
.property-demo-work-progress svg { width:10px; height:10px; }
.property-demo-issue-card, .property-demo-reuse-opportunity { display:flex; gap:10px; padding:12px; border:1px solid color-mix(in srgb,var(--demo-danger) 34%,transparent); border-radius:13px; background:color-mix(in srgb,var(--demo-danger) 8%,transparent); }
.property-demo-issue-card > svg, .property-demo-reuse-opportunity > svg { width:22px; height:22px; flex:none; color:var(--demo-danger); }
.property-demo-issue-card small, .property-demo-reuse-opportunity small { color:var(--demo-danger); font-size:8px; font-weight:850; letter-spacing:.09em; }
.property-demo-issue-card h2, .property-demo-reuse-opportunity h3 { margin:3px 0 4px; font-size:15px; }
.property-demo-issue-card p, .property-demo-reuse-opportunity p { margin:0; color:var(--demo-muted); font-size:10px; line-height:1.45; }
.property-demo-step-card { margin-top:12px; padding:13px; border:1px solid var(--demo-border); border-radius:13px; background:color-mix(in srgb,var(--demo-panel-strong) 68%,transparent); }
.property-demo-step-card h3 { margin:0 0 5px; font-size:12px; }
.property-demo-step-card > p { margin:0 0 10px; color:var(--demo-muted); font-size:10px; line-height:1.45; }
.property-demo-step-card .property-demo-kv + .property-demo-kv { margin-top:6px; }
.property-demo-worker-context { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }

.property-demo-work-mode { margin-top:12px; padding:14px; border:1px solid color-mix(in srgb,var(--demo-accent) 45%,transparent); border-radius:16px; background:linear-gradient(145deg,color-mix(in srgb,var(--demo-accent) 10%,transparent),var(--demo-panel-strong)); }
.property-demo-work-mode-header { display:flex; gap:10px; align-items:flex-start; }
.property-demo-work-mode-header > svg { width:28px; height:28px; color:var(--demo-accent); }
.property-demo-work-mode-header small { color:var(--demo-accent); font-size:8px; font-weight:850; letter-spacing:.1em; }
.property-demo-work-mode-header h2 { margin:2px 0; font-size:19px; }
.property-demo-work-mode-header p { margin:0; color:var(--demo-muted); font-size:10px; }
.property-demo-checklist { display:grid; gap:6px; margin-top:14px; }
.property-demo-checklist label { display:flex; align-items:center; gap:8px; padding:9px; border:1px solid var(--demo-border); border-radius:10px; cursor:pointer; font-size:10px; }
.property-demo-checklist label.done { color:var(--demo-accent); background:color-mix(in srgb,var(--demo-accent) 7%,transparent); }
.property-demo-checklist input { accent-color:var(--demo-accent-strong); }
.property-demo-photo-actions { display:flex; align-items:center; gap:9px; margin-top:10px; }
.property-demo-photo-actions button { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--demo-border); border-radius:10px; padding:8px 10px; background:transparent; cursor:pointer; font-size:9px; }
.property-demo-photo-actions svg { width:14px; height:14px; }
.property-demo-photo-actions span { color:var(--demo-muted); font-size:9px; }
.property-demo-required-evidence { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
.property-demo-required-evidence span { display:flex; align-items:center; gap:4px; color:var(--demo-muted); font-size:8px; }
.property-demo-required-evidence svg { width:11px; height:11px; color:var(--demo-accent); }

.property-demo-empty-state { min-height:430px; display:grid; place-items:center; align-content:center; gap:8px; padding:30px; text-align:center; }
.property-demo-empty-state > svg { width:40px; height:40px; color:var(--demo-accent); }
.property-demo-empty-state h2 { margin:0; font-size:20px; }
.property-demo-empty-state p { max-width:520px; margin:0; color:var(--demo-muted); font-size:11px; line-height:1.5; }

.property-demo-reuse-opportunity { margin-top:12px; border-color:color-mix(in srgb,var(--demo-warn) 38%,transparent); background:color-mix(in srgb,var(--demo-warn) 8%,transparent); }
.property-demo-reuse-opportunity > svg, .property-demo-reuse-opportunity small { color:var(--demo-warn); }
.property-demo-material-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:11px; }
.property-demo-material-list > div { display:grid; gap:3px; padding:10px; border:1px solid var(--demo-border); border-radius:11px; }
.property-demo-material-list strong { color:var(--demo-accent); font-size:10px; }

rsonId(null);\n  }\n\n  function returnToDemoCase() {\n    selectAsset(workflowAsset);\n    setTab(\"work\");\n  }\n\n  function openTask() {\n    setWorkStage(\"task\");\n    setTab(\"work\");\n    setChecklistDone(new Array(workflowIssue.checklist.length).fill(false));\n    setEvidenceCount(0);\n  }\n\n  function startWork() {\n    setWorkStage(\"work\");\n  }\n\n  function toggleChecklist(index: number) {\n    setChecklistDone((current) => current.map((value, i) => (i === index ? !value : value)));\n  }\n\n  function finishWork() {\n    if (!workflowComplete) return;\n    setWorkStage(\"evidence\");\n    setCompletionHistory((current) => [\n      ...current.filter((event) => event.id !== \"ahu-demo-work-complete\"),\n      {\n        id: \"ahu-demo-work-complete\",\n        date: \"2026-08-24\",\n        type: \"MAINTENANCE\",\n        title: \"Field inspection completed\",\n        detail: \"Demo Work Mode checklist completed with required photo evidence; technician recommends fan module replacement.\",\n        personId: \"person-piotr-service\",\n        companyId: \"company-xyz-mech\",\n      },\n    ]);\n  }\n\n  function approveEvidence() {\n    setWorkStage(\"approved\");\n    setCompletionHistory((current) => [\n      ...current.filter((event) => event.id !== \"ahu-demo-approved\"),\n      {\n        id: \"ahu-demo-approved\",\n        date: \"2026-08-24\",\n        type: \"APPROVAL\",\n        title: \"Evidence approved\",\n        detail: \"Facility Manager accepted the synthetic inspection evidence and replacement recommendation.\",\n        personId: \"person-anna-fm\",\n        companyId: \"company-skanska-property\",\n      },\n    ]);\n  }\n\n  function updateAssetHistory() {\n    setWorkStage(\"updated\");\n    setCompletionHistory((current) => [\n      ...current.filter((event) => event.id !== \"ahu-demo-history-updated\"),\n      {\n        id: \"ahu-demo-history-updated\",\n        date: \"2026-08-24\",\n        type: \"REPLACEMENT\",\n        title: \"Replacement planning opened\",\n        detail: \"Object Card and Building Graph updated with approved replacement planning event.\",\n        personId: \"person-anna-fm\",\n        companyId: \"company-skanska-property\",\n      },\n    ]);\n  }\n\n  function openReuse() {\n    setWorkStage(\"reuse\");\n    setTab(\"circular\");\n  }\n\n  function createEsgEvidence() {\n    setWorkStage(\"esg\");\n    setTab(\"esg\");\n    setCompletionHistory((current) => [\n      ...current.filter((event) => event.id !== \"ahu-demo-reuse-record\"),\n      {\n        id: \"ahu-demo-reuse-record\",\n        date: \"2026-08-24\",\n        type: \"REUSE\",\n        title: \"Circular resource route recorded\",\n        detail: \"Reusable / recoverable material routes and cross-project opportunity recorded as synthetic ESG evidence.\",\n        personId: \"person-anna-fm\",\n        companyId: \"company-skanska-property\",\n      },\n    ]);\n  }\n\n  function resetWorkflow() {\n    setWorkStage(\"issue\");\n    setChecklistDone([]);\n    setEvidenceCount(0);\n    setCompletionHistory([]);\n    returnToDemoCase();\n  }\n\n  return (\n    <main className=\"property-demo\" data-skin={theme} lang={language}>\n      <header className=\"property-demo-header\">\n        <div className=\"property-demo-brand\">\n          <img src={compactNexusLogo} alt=\"Nexus\" />\n          <div>\n            <strong>SKANSKA PROPERTY OPERATIONS DEMO</strong>\n            <span>Construction + Building Operating Layer</span>\n          </div>\n        </div>\n        <nav className=\"property-demo-top-tabs nosmo-demo-tabs\" aria-label=\"Demo view\">\n          <button type=\"button\" className={topView === \"building\" ? \"active\" : \"\"} onClick={() => { setTopView(\"building\"); if (tab === \"esg\") setTab(\"object\"); }}>Building</button>\n          <button type=\"button\" className={topView === \"environment\" ? \"active\" : \"\"} onClick={() => setTopView(\"environment\")}>Environmental</button>\n          <button type=\"button\" className={topView === \"settings\" ? \"active\" : \"\"} onClick={() => setTopView(\"settings\")}>Settings</button>\n        </nav>\n        <div className=\"property-demo-header-actions\"><ProvenanceBadge /></div>\n      </header>\n\n      {topView === \"settings\" ? (\n        <PropertySettings theme={theme} language={language} onTheme={setTheme} onLanguage={setLanguage} />\n      ) : (\n        <>\n      <section className=\"property-demo-intro\">\n        <div>\n          <p className=\"property-demo-eyebrow\">ONE PROJECT / BUILDING GRAPH</p>\n          <h1>Everything SKANSKA knows about this physical object.</h1>\n          <p>\n            One operational graph connects the building, BIM identity, asset, material, people, work, evidence, maintenance and circular outcome.\n            Existing systems stay the source of record where appropriate; Nexus connects the context and action.\n          </p>\n        </div>\n        <button type=\"button\" className=\"property-demo-ai-cta\" onClick={() => setAiOpen(true)}>\n          <Bot />\n          <span><small>Stop Searching. Start Asking.</small>What do we know about this asset?</span>\n        </button>\n      </section>\n\n      <section className=\"property-demo-path\" aria-label=\"Selected graph path\">\n        <span><Building2 /> {propertyPortfolio.name}</span><ArrowRight />\n        <span>{building.name}</span><ArrowRight />\n        <span>{selectedFloor.level}</span><ArrowRight />\n        <span>{selectedSpace.code}</span><ArrowRight />\n        <strong>{selectedAsset.tag}</strong>\n      </section>\n\n      {aiOpen && (\n        <section className=\"property-demo-ai\" data-testid=\"nexus-ai-answer\">\n          <div className=\"property-demo-panel-title\">\n            <span><Bot /> NEXUS AI · GRAPH ANSWER</span>\n            <button type=\"button\" onClick={() => setAiOpen(false)}>Close</button>\n          </div>\n          <div className=\"property-demo-ai-grid\">\n ame={selectedSpaceId === space.id ? \"active\" : \"\"} onClick={() => selectSpace(space.id)}>\n                  <strong>{space.code}</strong><small>{space.name}</small>\n                </button>\n              ))}\n            </div>\n          </div>\n\n          <div className=\"property-demo-search\">\n            <Search />\n            <input value={query} onChange={(event) => setQuery(event.target.value)} placeholder=\"Search assets in selected space\" aria-label=\"Search assets in selected space\" />\n          </div>\n\n          <div className=\"property-demo-graph-section\">\n            <label><Boxes /> ASSETS</label>\n            <div className=\"property-demo-node-row property-demo-assets-row\">\n              {visibleAssets.length > 0 ? visibleAssets.map((asset) => (\n                <button key={asset.id} type=\"button\" className={selectedAssetId === asset.id ? \"active\" : \"\"} onClick={() => selectAsset(asset)}>\n                  {asset.issue && <AlertTriangle className=\"property-demo-alert-icon\" />}\n                  <strong>{asset.tag}</strong><small>{asset.name}</small>\n                </button>\n              )) : <p className=\"property-demo-empty\">No matching asset in this space.</p>}\n            </div>\n          </div>\n\n          <div className=\"property-demo-relations\">\n            <RelationChip icon={<Recycle />} label=\"MATERIAL\" value={`${selectedMaterials.length} linked`} onClick={() => setTab(\"circular\")} />\n            <RelationChip icon={<User />} label=\"PERSON\" value={fmOwner?.name ?? \"Unknown\"} onClick={() => setSelectedPersonId(selectedAsset.fmOwnerPersonId)} />\n            <RelationChip icon={<Factory />} label=\"COMPANY\" value={serviceCompany?.name ?? \"Unknown\"} />\n            <RelationChip icon={<Wrench />} label=\"TASK\" value={selectedAsset.issue ? \"1 active\" : \"No active task\"} onClick={selectedAsset.issue ? () => setTab(\"work\") : undefined} />\n            <RelationChip icon={<ClipboardCheck />} label=\"INSPECTION\" value={`${combinedHistory.filter((event) => event.type === \"INSPECTION\").length} events`} />\n            <RelationChip icon={<FileText />} label=\"DOCUMENT\" value={`${selectedAsset.manuals.length + selectedAsset.certificates.length} linked`} />\n            <RelationChip icon={<Camera />} label=\"PHOTO\" value={`${selectedAsset.photos.length} records`} />\n            <RelationChip icon={<History />} label=\"MAINTENANCE\" value={`${combinedHistory.filter((event) => event.type === \"MAINTENANCE\").length} events`} />\n            <RelationChip icon={<Leaf />} label=\"REPLACEMENT / REUSE\" value={selectedAsset.replacement ? \"Open case\" : \"No open case\"} onClick={selectedAsset.replacement ? () => setTab(\"circular\") : undefined} />\n          </div>\n\n          <div className=\"property-demo-mini-stats\">\n            <span><strong>1</strong> building</span>\n            <span><strong>{floors.length}</strong> floors</span>\n            <span><strong>{spaces.length}</strong> spaces</span>\n            <span><strong>{assets.length}</strong> assets</span>\n            <span><strong>{companies.length}</strong> companies</span>\n            <span><strong>{people.length}</strong> people</span>\n          </div>\n        </div>\n\n        <div className=\"property-demo-detail-panel\">\n          <nav className=\"property-demo-tabs\" aria-label=\"Commercial demo detail views\">\n            {([\"object\", \"work\", \"circular\", \"esg\", \"sources\"] as DetailTab[]).map((item) => (\n              <button key={item} type=\"button\" className={tab === item ? \"active\" : \"\"} onClick={() => setTab(item)}>{item === \"object\" ? \"OBJECT CARD\" : item.toUpperCase()}</button>\n            ))}\n          </nav>\n\n          {tab === \"object\" && (\n            <div className=\"property-demo-object-card\" data-testid=\"commercial-object-card\">\n              <div className=\"property-demo-object-heading\">\n                <div>\n es.map((item) => <span key={item}>{item}</span>)}</div>\n                <div><Camera /><strong>Photos</strong>{selectedAsset.photos.map((item) => <span key={item}>{item}</span>)}</div>\n              </div>\n\n              <div className=\"property-demo-history\">\n                <h3>Asset history</h3>\n                {combinedHistory.map((event) => (\n                  <div key={event.id} className=\"property-demo-history-event\">\n                    <time>{formatDate(event.date)}</time>\n                    <span className={`property-demo-event-type property-demo-event-${event.type.toLowerCase()}`}>{event.type}</span>\n                    <div><strong>{event.title}</strong><p>{event.detail}</p></div>\n                  </div>\n                ))}\n              </div>\n\n              {selectedAsset.issue ? (\n                <button type=\"button\" className=\"property-demo-primary\" onClick={() => setTab(\"work\")}>\n                  <AlertTriangle /> Active issue · open work flow <ArrowRight />\n                </button>\n              ) : (\n                <div className=\"property-demo-good\"><CheckCircle2 /> No active issue in this synthetic asset record.</div>\n              )}\n            </div>\n          )}\n\n          {tab === \"work\" && (\n            <div className=\"property-demo-work\" data-testid=\"asset-workflow\">\n              {selectedAsset.id !== workflowAsset.id ? (\n                <div className=\"property-demo-empty-state\">\n                  <CheckCircle2 />\n                  <h2>No active maintenance issue on {selectedAsset.tag}</h2>\n                  <p>The full executable demo case is attached to AHU-04 so the story remains one coherent workflow rather than eight unrelated mock tasks.</p>\n                  <button type=\"button\" className=\"property-demo-primary\" onClick={returnToDemoCase}>Open AHU-04 demo case <ArrowRight /></button>\n                </div>\n              ) : (\n                <>\n                  <div className=\"property-demo-work-progress\">\n                    {workStageOrder.map((stage) => {\n                      const currentIndex = workStageOrder.indexOf(workStage);\n                      const itemIndex = workStageOrder.indexOf(stage);\n                      return <span key={stage} className={stage === workStage ? \"active\" : itemIndex < currentIndex ? \"done\" : \"\"}>{itemIndex < currentIndex ? <CheckCircle2 /> : null}{workStageLabels[stage]}</span>;\n                    })}\n                  </div>\n\n                  <div className=\"property-demo-issue-card\">\n                    <AlertTriangle />\n                    <div><small>ACTIVE ISSUE · HIGH</small><h2>{workflowIssue.title}</h2><p>{workflowIssue.instruction}</p></div>\n                  </div>\n\n                  {workStage === \"issue\" && (\n                    <div className=\"property-demo-step-card\">\n                      <h3>Facility Manager · NEXT</h3>\n                      <p>Create one task already bound to AHU-04, its exact room, responsible service company and required proof.</p>\n                      <KeyValue label=\"Assignee\" value=\"Piotr Nowak · Service Technician · XYZ Mechanical Demo Ltd\" />\n                      <KeyValue label=\"Location\" value=\"L00-MEP-01 · Mechanical Plant Room\" />\n                      <button type=\"button\" className=\"property-demo-primary\" onClick={openTask}>Create task <ArrowRight /></button>\n                    </div>\n                  )}\n\n                  {workStage === \"task\" && (\n                    <div className=\"property-demo-step-card\">\n                      <h3>Task ready for Nexus Work Mode</h3>\n                      <p>The worker receives only the bounded operational context required to perform this job.</p>\n                      <div className=\"property-demo-worker-context\">\n                        <KeyValue label=\"PLACE\" value=\"L00-MEP-01 · Mechanical Plant Room\" />\n                        <KeyValue label=\"ASSET\" value=\"AHU-04 · Air Handling Unit 04\" />\n                        <KeyValue label=\"PROBLEM\" value={workflowIssue.title} />\n                        <KeyValue label=\"INSTRUCTION\" value={workflowIssue.instruction} />\n                      </div>\n                      <button type=\"button\" className=\"property-demo-primary\" onClick={startWork}><Play /> Open Work Mode</button>\n                    </div>\n                  )}\n\n                  {workStage === \"work\" && (\n                    <div className=\"property-demo-work-mode\">\n                      <div className=\"property-demo-work-mode-header\"><Wrench /><div><small>NEXUS WORK MODE</small><h2>AHU-04 inspection</h2><p>L00-MEP-01 · Mechanical Plant Room</p></div></div>\n                      <div className=\"property-demo-checklist\">\n                        {workflowIssue.checklist.map((item, index) => (\n                          <label key={item} className={checklistDone[index] ? \"done\" : \"\"}>\n                            <input type=\"checkbox\" checked={Boolean(checklistDone[index])} onChange={() => toggleChecklist(index)} />\n                            <span>{item}</span>\n                          </label>\n                        ))}\n                      </div>\n                      <div className=\"property-demo-photo-actions\">\n                        <button type=\"button\" onClick={() => setEvidenceCount((count) => Math.min(2, count + 1))}><Camera /> Capture demo photo</button>\n                        <span>{evidenceCount}/2 required photos recorded</span>\n                      </div>\n                      <div className=\"property-demo-required-evidence\">\n                        {workflowIssue.requiredEvidence.map((item) => <span key={item}><CheckCircle2 /> {item}</span>)}\n                      </div>\n                      <button type=\"button\" className=\"property-demo-primary\" disabled={!workflowComplete} onClick={finishWork}><Upload /> Finish · send evidence to Object Card</button>\n                      {!workflowComplete && <p className=\"property-demo-note\">Finish unlocks after all checklist items and two required demo photos are recorded.</p>}\n                    </div>\n                  )}\n\n                  {workStage === \"evidence\" && (\n                    <div className=\"property-demo-step-card\">\n                      <h3>Evidence returned to Project Graph</h3>\n                      <div className=\"property-demo-good\"><CheckCircle2 /> 5/5 checklist items · 2/2 required photos · technician completion record</div>\n                      <p>Recommendation: replace the affected fan module; retain the AHU casing, coils and reusable assemblies.</p>\n                      <button type=\"button\" className=\"property-demo-primary\" onClick={approveEvidence}><ShieldCheck /> Approve evidence</button>\n                    </div>\n                  )}\n\n                  {workStage === \"approved\" && (\n                    <div className=\"property-demo-step-card\">\n                      <h3>Human approval recorded</h3>\n                      <p>Approval is attached to the same asset identity; it does not overwrite BIM or the original maintenance source.</p>\n                      <button type=\"button\" className=\"property-demo-primary\" onClick={updateAssetHistory}><Database /> Update Object Card + Building Graph</button>\n                    </div>\n                  )}\n\n                  {workStage === \"updated\" && (\n                    <div className=\"property-demo-step-card\">\n                      <h3>Asset history updated</h3>\n                      <div className=\"property-demo-good\"><CheckCircle2 /> Object Card now contains the completed work, evidence, approval and replacement planning event.</div>\n                      <button type=\"button\" className=\"property-demo-primary\" onClick={openReuse}><Recycle /> Open replacement / reuse decision</button>\n                    </div>\n                  )}\n\n                  {(workStage === \"reuse\" || workStage === \"esg\") && (\n                    <div className=\"property-demo-step-card\">\n                      <h3>{workStage === \"esg\" ? \"Circular route completed\" : \"Replacement / reuse decision is open\"}</h3>\n                      <button type=\"button\" className=\"property-demo-primary\" onClick={() => setTab(workStage === \"esg\" ? \"esg\" : \"circular\")}>Continue in {workStage === \"esg\" ? \"ESG evidence\" : \"Circularity\"} <ArrowRight /></button>\n                    </div>\n                  )}\n                </>\n              )}\n            </div>\n          )}\n\n          {tab === \"circular\" && (\n            <div className=\"property-demo-circular\" data-testid=\"circular-resource-record\">\n              {!selectedAsset.replacement ? (\n                <div className=\"property-demo-empty-state\"><Recycle /><h2>No active replacement case</h2><p>{selectedAsset.tag} still exposes its material composition and recovery route, but the coherent executable replacement story is attached to AHU-04.</p><button type=\"button\" className=\"property-demo-primary\" onClick={returnToDemoCase}>Open AHU-04 replacement case <ArrowRight /></button></div>\n              ) : (\n                <>\n                  <div className=\"property-demo-object-heading\"><div><span>CIRCULAR RESOURCE RECORD</span><h2>{selectedAsset.tag} · Replacement / reuse</h2><p>{selectedAsset.replacement.reason}</p></div><ProvenanceBadge /></div>\n                  <div className=\"property-demo-card-grid\">\n                    <KeyValue label=\"Replacement option\" value={selectedAsset.replacement.replacementOption} />\n                    <KeyValue label=\"Existing composition\" value={selectedMaterials.map((item) => `${item.name} · ${item.composition}`).join(\" | \")} />\n                    <KeyValue label=\"Retained in building\" value={selectedAsset.replacement.retainedMaterials.join(\" · \")} />\n                    <KeyValue label=\"Recycling route\" value={selectedAsset.replacement.recyclingRoute} />\n                    <KeyValue label=\"CO₂ / LCA boundary\" value={selectedAsset.replacement.co2Statement} />\n                  </div>\n                  <div className=\"property-demo-reuse-opportunity\"><Recycle /><div><small>REUSE ELSEWHERE · SYNTHETIC MATCH</small><h3>Cross-project opportunity</h3><p>{selectedAsset.replacement.reuseOpportunity}</p></div></div>\n                  <div className=\"property-demo-material-list\">\n                    {selectedMaterials.map((material) => <div key={material.id}><strong>{material.name}</strong><span>{material.composition}</span><span>Reuse potential · {material.reusePotential}</span><span>{material.recoveryRoute}</span></div>)}\n                  </div>\n                  {workStage === \"updated\" ? <button type=\"button\" className=\"property-demo-primary\" onClick={openReuse}><Recycle /> Record circular decision</button> : workStage === \"reuse\" ? <button type=\"button\" className=\"property-demo-primary\" onClick={createEsgEvidence}><Leaf /> Confirm route + create ESG evidence</button> : <div className=\"property-demo-good\"><CheckCircle2 /> Circular resource record attached to the asset history.</div>}\n                </>\n              )}\n            </div>\n          )}\n\n          {tab === \"esg\" && (\n            <div className=\"property-demo-esg\" data-testid=\"esg-evidence\">\n              <div className=\"property-demo-object-heading\"><div><span>ESG / CIRCULARITY EVIDENCE</span><h2>Asset-level evidence, not a disconnected report</h2><p>The ESG record is generated from the same physical-object history and retains source / provenance boundaries.</p></div><Leaf /></div>\n              {workStage === \"esg\" ? (\n                <>\n                  <div className=\"property-demo-esg-grid\">\n                    <div><CheckCircle2 /><strong>Inspection evidence</strong><span>Checklist + 2 demo photos + technician completion</span></div>\n                    <div><CheckCircle2 /><strong>Human approval</strong><span>Facility Manager approval linked to AHU-04</span></div>\n                    <div><CheckCircle2 /><strong>Material record</strong><span>{joinLabels(workflowAsset.materialIds, materials)}</span></div>\n                    <div><CheckCircle2 /><strong>Reuse opportunity</strong><span>Cross-project compatibility match recorded as synthetic demo data</span></div>\n                    <div><ShieldCheck /><strong>Carbon integrity</strong><span>No fabricated kgCO₂e. Quantification remains blocked until verified EPD/LCA factors are connected.</span></div>\n                    <div><Database /><strong>Graph outcome</strong><span>Asset history + circular resource route + ESG evidence share one Nexus object identity.</span></div>\n                  </div>\n                  <div className=\"property-demo-good property-demo-finale\"><Leaf /> Building Graph updated: maintenance action, approval, replacement / reuse route and ESG evidence are now connected.</div>\n                  <button type=\"button\" className=\"property-demo-secondary\" onClick={resetWorkflow}><RotateCcw /> Reset demo workflow</button>\n                </>\n              ) : (\n                <div className=\"property-demo-empty-state\"><Leaf /><h2>Complete the AHU-04 workflow first</h2><p>ESG evidence is the outcome of approved operational work and a circular decision, not a standalone decorative dashboard.</p><button type=\"button\" className=\"property-demo-primary\" onClick={returnToDemoCase}>Continue AHU-04 workflow <ArrowRight /></button></div>\n              )}\n            </div>\n          )}\n\n          {tab === \"sources\" && (\n            <div className=\"property-demo-sources\" data-testid=\"source-systems\">\n              <div className=\"property-demo-object-heading\"><div><span>OPERATIONAL INTELLIGENCE LAYER</span><h2>Existing systems remain sources. Nexus connects them.</h2><p>This demo does not claim that Nexus replaces BIM, CAFM, document storage or specialist tools.</p></div><Database /></div>\n              <div className=\"property-demo-source-stack\">\n                {sourceSystems.map((source) => <div key={source.id}><Database /><span><strong>{source.name}</strong><small>{source.role}</small></span><SourceBadge>{source.status}</SourceBadge></div>)}\n              </div>\n              <div className=\"property-demo-source-arrow\"><ArrowRight /></div>\n              <div className=\"property-demo-nexus-graph-box\"><img src={compactNexusLogo} alt=\"Nexus\" /><span><strong>NOSMO NEXUS PROJECT / BUILDING GRAPH</strong><small>Identity · relationships · context · action · evidence · history</small></span></div>\n            </div>\n          )}\n        </div>\n      </section>\n\n      {selectedPerson && (\n        <aside className=\"property-demo-person-card\" data-testid=\"person-relation-card\">\n          <button type=\"button\" onClick={() => setSelectedPersonId(null)}>Close</button>\n          <User />\n          <small>PERSON RELATION · EXISTING PERSON CARD BOUNDARY</small>\n          <h3>{selectedPerson.name}</h3>\n          <p>{selectedPerson.role}</p>\n          <strong>{selectedPersonCompany?.name}</strong>\n          <span>Related to {selectedAsset.tag} through the Building Graph. Full Person Card UI remains the protected Nexus component; this panel only proves the asset-to-person relation in this isolated demo.</span>\n        </aside>\n      )}\n\n      <footer className=\"property-demo-footer\">\n        <span><ShieldCheck /> SYNTHETIC DEMO · no real SKANSKA Property asset, worker or project data</span>\n        <span><Database /> BIM / CAFM / storage remain source systems · Nexus provides the relationship and operational intelligence layer</span>\n      </footer>\n        </>\n      )}\n    </main>\n  );\n}\n";

try {
  let dataSource = dataRaw.replace(/\bexport\s+/g, '');
  const appStart = appRaw.indexOf('type DemoTheme');
  if (appStart < 0) throw new Error('Property demo component boundary was not found.');
  let appSource = appRaw.slice(appStart)
    .replace('export default function SkanskaPropertyDemo()', 'function SkanskaPropertyDemo()');

  const source = [
    'const compactNexusLogo = "/nexus/spark/NEXUS_Logo_UI_Mark_N.png";',
    dataSource,
    appSource,
    'createRoot(document.getElementById("root")).render(React.createElement(SkanskaPropertyDemo));'
  ].join('\n');

  const compiled = Babel.transform(source, {
    filename: 'SkanskaPropertyDemo.tsx',
    presets: ['typescript', ['react', {runtime:'classic'}]],
    sourceType: 'script'
  }).code;

  eval(compiled);
} catch (error) {
  console.error(error);
  const target = document.getElementById('bootError');
  target.style.display = 'block';
  target.textContent = 'NOSMO SKANSKA Property Demo failed to start: ' + (error?.message || String(error));
}
</script>
</body>
</html>
