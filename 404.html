<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NOSMO | Page not found</title>
<link rel="icon" href="/assets/nosmo-logo.png">
<link rel="stylesheet" href="/assets/site-v2.css">
<script src="/assets/site.js" defer></script>
<script>
(function(){
  var p=window.location.pathname;
  if(p==="/nexus/skanska-property"||p==="/nexus/skanska-property/"){window.location.replace("/skanska-property.html");return;}
  if(p.indexOf("/apps/nexus/")===0){
    var route=p.slice("/apps/nexus/".length).replace(/^\/+|\/+$/g,"");
    var target=new URL("/apps/nexus/",window.location.origin);
    if(route&&/^[a-z0-9\/_-]+$/i.test(route))target.searchParams.set("route",route);
    target.hash=window.location.hash;
    window.location.replace(target.toString());
  }
})();
</script>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><img src="/assets/NOSMO_LOGO_LONG_TRANSPARENT.svg" alt="NOSMO Technology"></a></div></header>
<main class="page not-found"><section class="panel"><p class="eyebrow">404</p><h1>Page not found.</h1><p>The requested address does not exist or has moved.</p><div class="actions"><a class="button primary" href="/">Return to NOSMO</a></div></section></main>
</body>
</html>
