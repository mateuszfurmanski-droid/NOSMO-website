<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>NOSMO — Page not found</title>
  <script>
    (() => {
      const nexusPrefix = "/apps/nexus/";
      const pathname = window.location.pathname;

      if (pathname.startsWith(nexusPrefix)) {
        const route = pathname
          .slice(nexusPrefix.length)
          .replace(/^\/+|\/+$/g, "");

        const target = new URL(nexusPrefix, window.location.origin);
        if (route && /^[a-z0-9/_-]+$/i.test(route)) {
          target.searchParams.set("route", route);
        }
        target.hash = window.location.hash;
        window.location.replace(target.toString());
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #030407;
      color: #f5f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid rgba(245, 196, 0, .28);
      background: #0a0f18;
      text-align: center;
    }
    .brand {
      color: #f5c400;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 { margin: 16px 0 10px; font-size: 38px; }
    p { color: #aeb8ca; line-height: 1.6; }
    a {
      display: inline-flex;
      margin-top: 14px;
      min-height: 46px;
      align-items: center;
      padding: 0 18px;
      background: #f5c400;
      color: #05070b;
      text-decoration: none;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">NOSMO Technology</div>
    <h1>Page not found</h1>
    <p>The requested address does not exist or has moved.</p>
    <a href="/">Return to NOSMO</a>
  </main>
</body>
</html>
